veCodecs; }\n  std::string name() const override { return label; }\n  std::string encode(const std::string\u0026 t) const override { return label + \":\" + t; }\n};\n\nCodecFactory tagFactory(const std::string\u0026 label) {\n  return [label] {\n    ++factoryCalls;\n    return std::make_unique\u003cTag\u003e(label);\n  };\n}\n}  // namespace\n\nTEST(Registry, CreatesWhatWasRegistered) {\n  CodecRegistry reg;\n  EXPECT_TRUE(reg.registerCodec(\"zip\", tagFactory(\"zip\")));\n  EXPECT_TRUE(reg.registerCodec(\"b64\", tagFactory(\"b64\")));\n  auto zip = reg.create(\"zip\");\n  ASSERT_TRUE(zip != nullptr);\n  EXPECT_EQ(zip-\u003eencode(\"x\"), std::string(\"zip:x\"));\n  auto b64 = reg.create(\"b64\");\n  ASSERT_TRUE(b64 != nullptr);\n  EXPECT_EQ(b64-\u003ename(), std::string(\"b64\"));\n}\n\nTEST(Registry, UnknownNameIsNull) {\n  CodecRegistry reg;\n  EXPECT_TRUE(reg.create(\"zip\") == nullptr);\n  reg.registerCodec(\"zip\", tagFactory(\"zip\"));\n  EXPECT_TRUE(reg.create(\"gzip\") == nullptr);\n  EXPECT_TRUE(reg.create(\"\") == nullptr);\n}\n\nTEST(Registry, EveryCallMakesAFreshCodec) {\n  liveCodecs = 0;\n  CodecRegistry reg;\n  reg.registerCodec(\"zip\", tagFactory(\"zip\"));\n  auto a = reg.create(\"zip\");\n  auto b = reg.create(\"zip\");\n  ASSERT_TRUE(a != nullptr \u0026\u0026 b != nullptr);\n  EXPECT_TRUE(a.get() != b.get());\n  EXPECT_EQ(liveCodecs, 2);\n  a.reset();\n  EXPECT_EQ(liveCodecs, 1);\n}\n\nTEST(Registry, FactoriesRunLazily) {\n  factoryCalls = 0;\n  CodecRegistry reg;\n  reg.registerCodec(\"zip\", tagFactory(\"zip\"));\n  reg.registerCodec(\"b64\", tagFactory(\"b64\"));\n  EXPECT_EQ(factoryCalls, 0);\n  auto c = reg.create(\"zip\");\n  EXPECT_EQ(factoryCalls, 1);\n  auto d = reg.create(\"zip\");\n  EXPECT_EQ(factoryCalls, 2);\n}\n\nTEST(Registry, FirstRegistrationWins) {\n  CodecRegistry reg;\n  EXPECT_TRUE(reg.registerCodec(\"zip\", tagFactory(\"first\")));\n  EXPECT_FALSE(reg.registerCodec(\"zip\", tagFactory(\"second\")));\n  auto c = reg.create( hod `\"GET\"`, timeout `30000`, no headers, empty body.\n\nRules checked in `build()`:\n- the URL is required and starts with `http://` or `https://`;\n- the method is one of `GET`, `POST`, `PUT`, `DELETE`;\n- a non-empty body needs `POST` or `PUT`;\n- the timeout is between 1 and 120000 inclusive;\n- header names are not empty, and header names are compared **case-insensitively**: setting the same name again replaces its value, keeping the first position and the first spelling.\n\n`build()` is `const`: the builder can be reused or changed afterwards without affecting a request already built.\n33:T467,#pragma once\n#include \u003coptional\u003e\n#include \u003cstring\u003e\n#include \u003cutility\u003e\n#include \u003cvector\u003e\n\n// TODO: HttpRequest must be immutable with no public constructor; the builder validates.\nclass HttpRequest {\n public:\n  HttpRequest() = default;\n  const std::string\u0026 method() const { return method_; }\n  const std::string\u0026 url() const { return url_; }\n  const std::string\u0026 body() const { return body_; }\n  int timeoutMs() const { return timeoutMs_; }\n  const std::vector\u003cstd::pair\u003cstd::string, std::string\u003e\u003e\u0026 headers() const { return headers_; }\n\n private:\n  std::string method_;\n  std::string url_;\n  std::string body_;\n  int timeoutMs_ = 0;\n  std::vector\u003cstd::pair\u003cstd::string, std::string\u003e\u003e headers_;\n};\n\nclass HttpRequestBuilder {\n public:\n  HttpRequestBuilder\u0026 method(std::string m) { return *this; }\n  HttpRequestBuilder\u0026 url(std::string u) { return *this; }\n  HttpRequestBuilder\u0026 header(std::string name, std::string value) { return *this; }\n  HttpRequestBuilder\u0026 body(std::string b) { return *this; }\n  HttpRequestBuilder\u0026 timeoutMs(int ms) { return *this; }\n  std::optional\u003cHttpRequest\u003e build() const { return std::nullopt; }\n};\n34:Tff4,#include \u003coptional\u003e\n#include \u003cstring\u003e\n#include \u003ctype_traits\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nTEST(Defaults, GetWithThirtySecondTimeout) {\n  auto r = HttpRequestBuilder().url(\"https://example.com/a\").build();\n  ASSERT_TRUE(r.has_value());\n  EXPECT_EQ(r-\u003emethod(), std::string(\"GET\"));\n  EXPECT_EQ(r-\u003eurl(), std::string(\"https://example.com/a\"));\n  EXPECT_EQ(r-\u003etimeoutMs(), 30000);\n  EXPECT_TRUE(r-\u003ebody().empty());\n  EXPECT_TRUE(r-\u003eheaders().empty());\n}\n\nTEST(Fluent, SettersChainAndAreApplied) {\n  HttpRequestBuilder b;\n  b.method(\"POST\").url(\"http://x.test/p\").body(\"{}\").timeoutMs(500).header(\"Accept\", \"json\");\n  auto r = b.build();\n  ASSERT_TRUE(r.has_value());\n  EXPECT_EQ(r-\u003emethod(), std::string(\"POST\"));\n  EXPECT_EQ(r-\u003ebody(), std::string(\"{}\"));\n  EXPECT_EQ(r-\u003etimeoutMs(), 500);\n  ASSERT_EQ(r-\u003eheaders().size(), static_cast\u003cstd::size_t\u003e(1));\n  EXPECT_EQ(r-\u003eheaders()[0].first, std::string(\"Accept\"));\n  EXPECT_EQ(r-\u003eheaders()[0].second, std::string(\"json\"));\n}\n\nTEST(Validation, UrlIsRequiredAndMustBeHttp) {\n  EXPECT_FALSE(HttpRequestBuilder().build().has_value());\n  EXPECT_FALSE(HttpRequestBuilder().url(\"\").build().has_value());\n  EXPECT_FALSE(HttpRequestBuilder().url(\"ftp://x.test\").build().has_value());\n  EXPECT_FALSE(HttpRequestBuilder().url(\"example.com\").build().has_value());\n  EXPECT_TRUE(HttpRequestBuilder().url(\"http://x.test\").build().has_value());\n}\n\nTEST(Validation, MethodMustBeKnown) {\n  for (const char* m : {\"GET\", \"POST\", \"PUT\", \"DELETE\"}) {\n    EXPECT_TRUE(HttpRequestBuilder().url(\"https://a.test\").method(m).build().has_value());\n  }\n  EXPECT_FALSE(HttpRequestBuilder().url(\"https://a.test\").method(\"PATCH\").build().has_value());\n  EXPECT_FALSE(HttpRequestBuilder().url(\"https://a.test\").method(\"get\").build().has_value());\n}\n\nTEST(Validation, BodyNeedsPostOrPut) {\n  EXPECT_FALSE(HttpRequestBuilder().url(\"https://a.test\").body(\"x\").build().has_value());\n  EXPECT_FALSE(HttpRequestBuilder().url(\"https://a.test\").method(\"DELETE\").body(\"x\").build().has_value());\n  EXPECT_TRUE(HttpRequestBuilder().url(\"https://a.test\").method(\"PUT\").body(\"x\").build().has_value());\n  EXPECT_TRUE(HttpRequestBuilder().url(\"https://a.test\").method(\"POST\").body(\"\").build().has_value());\n}\n\nTEST(Validation, TimeoutRangeIsInclusive) {\n  auto make = [](int ms) { return HttpRequestBuilder().url(\"https://a.test\").timeoutMs(ms).build().has_value(); };\n  EXPECT_FALSE(make(0));\n  EXPECT_FALSE(make(-5));\n  EXPECT_TRUE(make(1));\n  EXPECT_TRUE(make(120000));\n  EXPECT_FALSE(make(120001));\n}\n\nTEST(Headers, NamesAreCaseInsensitiveAndReplaceInPlace) {\n  auto r = HttpRequestBuilder()\n               .url(\"https://a.test\")\n               .header(\"Content-Type\", \"a\")\n               .header(\"X-Id\", \"1\")\n               .header(\"content-type\", \"b\")\n               .build();\n  ASSERT_TRUE(r.has_value());\n  ASSERT_EQ(r-\u003eheaders().size(), static_cast\u003cstd::size_t\u003e(2));\n  EXPECT_EQ(r-\u003eheaders()[0].first, std::string(\"Content-Type\"));\n  EXPECT_EQ(r-\u003eheaders()[0].second, std::string(\"b\"));\n  EXPECT_EQ(r-\u003eheaders()[1].first, std::string(\"X-Id\"));\n}\n\nTEST(Headers, EmptyNameIsInvalid) {\n  EXPECT_FALSE(HttpRequestBuilder().url(\"https://a.test\").header(\"\", \"v\").build().has_value());\n}\n\nTEST(Reuse, BuiltRequestIsASnapshot) {\n  HttpRequestBuilder b;\n  b.url(\"https://a.test\").header(\"A\", \"1\");\n  auto first = b.build();\n  b.url(\"https://b.test\").header(\"A\", \"2\").header(\"B\", \"3\");\n  auto second = b.build();\n  ASSERT_TRUE(first.has_value() \u0026\u0026 second.has_value());\n  EXPECT_EQ(first-\u003eurl(), std::string(\"https://a.test\"));\n  EXPECT_EQ(first-\u003eheaders().size(), static_cast\u003cstd::size_t\u003e(1));\n  EXPECT_EQ(first-\u003eheaders()[0].second, std::string(\"1\"));\n  EXPECT_EQ(second-\u003eheaders().size(), static_cast\u003cstd::size_t\u003e(2));\n}\n\nTEST(Shape, RequestHasNoPublicConstructorButIsCopyable) {\n  EXPECT_FALSE(std::is_default_constructible\u003cHttpRequest\u003e::value);\n  EXPECT_FALSE((std::is_constructible\u003cHttpRequest, std::string, std::string\u003e::value));\n  EXPECT_TRUE(std::is_copy_constructible\u003cHttpRequest\u003e::value);\n  EXPECT_TRUE(std::is_nothrow_move_constructible\u003cHttpRequest\u003e::value);\n}\n35:T503,A settings screen draws buttons and checkboxes. Today each call site picks `LightButton` or `DarkCheckbox` by hand, and last week a dark button ended up beside a light checkbox. Fix it with an **abstract factory**: one factory per visual family, and screens that only ever hold a `WidgetFactory`. `api.h` gives `Button`, `Checkbox` and `WidgetFactory`. Write these in `solution.h`:\n\n- `LightFactory` and `DarkFactory`, both `WidgetFactory`s. Every product a factory makes reports that factory's family from `family()`: `\"light\"` or `\"dark\"`. Rendering:\n  - light: button `[Sign in]`, checkbox `[x] Remember me` / `[ ] Remember me`\n  - dark: button `\u003cSign in\u003e`, checkbox `(x) Remember me` / `( ) Remember me`\n- `std::unique_ptr\u003cWidgetFactory\u003e makeFactory(const std::string\u0026 family)`: `\"light\"` or `\"dark\"`; anything else (including `\"\"`) gives `nullptr`.\n- `std::string renderLogin(const WidgetFactory\u0026 factory)`: the login screen, built **only** through the factory: the checkbox `\"Remember me\"` (checked), a newline, then the button `\"Sign in\"`. It must work for a factory you have never seen: the tests pass in a new family.\n\nEach `create...` call returns a new object. Keep the concrete product classes out of the public face of the screen code: `renderLogin` must not name them.\n36:Tb10,#include \u003cmemory\u003e\n#include \u003cstring\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\n// A family the solution has never seen.\nclass ContrastButton : public Button {\n public:\n  std::string family() const override { return \"contrast\"; }\n  std::string render(const std::string\u0026 l) const override { return \"#\" + l + \"#\"; }\n};\nclass ContrastCheckbox : public Checkbox {\n public:\n  std::string family() const override { return \"contrast\"; }\n  std::string render(const std::string\u0026 l, bool c) const override { return std::string(c ? \"#X# \" : \"#_# \") + l; }\n};\nclass ContrastFactory : public WidgetFactory {\n public:\n  std::unique_ptr\u003cButton\u003e createButton() const override { return std::make_unique\u003cContrastButton\u003e(); }\n  std::unique_ptr\u003cCheckbox\u003e createCheckbox() const override { return std::make_unique\u003cContrastCheckbox\u003e(); }\n};\n}  // namespace\n\nTEST(Family, LightRendersLightWidgets) {\n  const auto f = makeFactory(\"light\");\n  ASSERT_TRUE(f != nullptr);\n  EXPECT_EQ(f-\u003ecreateButton()-\u003erender(\"Sign in\"), std::string(\"[Sign in]\"));\n  EXPECT_EQ(f-\u003ecreateCheckbox()-\u003erender(\"Remember me\", true), std::string(\"[x] Remember me\"));\n  EXPECT_EQ(f-\u003ecreateCheckbox()-\u003erender(\"Remember me\", false), std::string(\"[ ] Remember me\"));\n}\n\nTEST(Family, DarkRendersDarkWidgets) {\n  const auto f = makeFactory(\"dark\");\n  ASSERT_TRUE(f != nullptr);\n  EXPECT_EQ(f-\u003ecreateButton()-\u003erender(\"Sign in\"), std::string(\"\u003cSign in\u003e\"));\n  EXPECT_EQ(f-\u003ecreateCheckbox()-\u003erender(\"Remember me\", true), std::string(\"(x) Remember me\"));\n  EXPECT_EQ(f-\u003ecreateCheckbox()-\u003erender(\"Remember me\", false), std::string(\"( ) Remember me\"));\n}\n\nTEST(Family, ProductsOfOneFactoryShareItsFamily) {\n  for (const char* name : {\"light\", \"dark\"}) {\n    const auto f = makeFactory(name);\n    ASSERT_TRUE(f != nullptr);\n    const auto b = f-\u003ecreateButton();\n    const auto c = f-\u003ecreateCheckbox();\n    ASSERT_TRUE(b != nullptr \u0026\u0026 c != nullptr);\n    EXPECT_EQ(b-\u003efamily(), std::string(name));\n    EXPECT_EQ(c-\u003efamily(), std::string(name));\n  }\n}\n\nTEST(Family, UnknownFamilyIsNull) {\n  EXPECT_TRUE(makeFactory(\"\") == nullptr);\n  EXPECT_TRUE(makeFactory(\"sepia\") == nullptr);\n  EXPECT_TRUE(makeFactory(\"Light\") == nullptr);\n}\n\nTEST(Family, EveryCreateCallMakesANewObject) {\n  const auto f = makeFactory(\"dark\");\n  ASSERT_TRUE(f != nullptr);\n  const auto a = f-\u003ecreateButton();\n  const auto b = f-\u003ecreateButton();\n  ASSERT_TRUE(a != nullptr \u0026\u0026 b != nullptr);\n  EXPECT_TRUE(a.get() != b.get());\n}\n\nTEST(Screen, LoginUsesTheFactoryItIsGiven) {\n  EXPECT_EQ(renderLogin(*makeFactory(\"light\")), std::string(\"[x] Remember me\\n[Sign in]\"));\n  EXPECT_EQ(renderLogin(*makeFactory(\"dark\")), std::string(\"(x) Remember me\\n\u003cSign in\u003e\"));\n}\n\nTEST(Screen, WorksWithAFamilyItHasNeverSeen) {\n  ContrastFactory contrast;\n  EXPECT_EQ(renderLogin(contrast), std::string(\"#X# Remember me\\n#Sign in#\"));\n}\n37:T58c,A form designer lets users stamp out copies of a prepared element: a label, a badge, or a whole panel of them. The copy must be completely independent, and callers only hold a `Widget`. `api.h` gives the `Widget` interface with its `clone()`. Write in `solution.h`:\n\n- `Label(std::string text)`: `describe()` is `label(\u003ctext\u003e)`.\n- `Badge(std::string text)`: a kind of `Label` that `describe()`s as `badge(\u003ctext\u003e)`.\n- `Panel(std::string title)`: owns children. `Panel\u0026 add(std::unique_ptr\u003cWidget\u003e child)` appends and returns `*this`; `std::size_t size() const`; `Widget* child(std::size_t i)` (`nullptr` out of range). `describe()` is `panel(\u003ctitle\u003e)[\u003cchild\u003e,\u003cchild\u003e]` using each child's `describe()`, e.g. `panel(form)[label(Name),badge(new)]`; with no children `panel(form)[]`. `setText` changes the title.\n- `Palette`: a registry of prototypes. `bool add(const std::string\u0026 name, const Widget\u0026 prototype)` stores a **private copy** and returns `true`; it returns `false` and changes nothing for an empty or duplicate name. `std::unique_ptr\u003cWidget\u003e spawn(const std::string\u0026 name) const` returns a new independent copy, or `nullptr` for an unknown name.\n\n`clone()` must return an object of the **same dynamic type** (a cloned `Badge` is still a `Badge`) and a **deep** copy: editing a clone, or any child of a cloned panel, must never change the original, and the other way round. For `Label::setText` replace its text.\n38:T5e6,#pragma once\n#include \u003ccstddef\u003e\n#include \u003cmap\u003e\n#include \u003cmemory\u003e\n#include \u003cstring\u003e\n#include \u003cutility\u003e\n#include \u003cvector\u003e\n#include \"api.h\"\n\n// TODO: implement Label, Badge, Panel and Palette. Every concrete widget overrides clone() and\n// returns a deep copy of the SAME dynamic type.\nclass Label : public Widget {\n public:\n  explicit Label(std::string text) : text_(std::move(text)) {}\n  std::unique_ptr\u003cWidget\u003e clone() const override { return nullptr; }\n  std::string describe() const override { return \"\"; }\n  void setText(const std::string\u0026 text) override { text_ = text; }\n\n protected:\n  std::string text_;\n};\n\nclass Badge : public Label {\n public:\n  explicit Badge(std::string text) : Label(std::move(text)) {}\n};\n\nclass Panel : public Widget {\n public:\n  explicit Panel(std::string title) : title_(std::move(title)) {}\n  Panel\u0026 add(std::unique_ptr\u003cWidget\u003e child) {\n    (void)child;\n    return *this;\n  }\n  std::size_t size() const { return 0; }\n  Widget* child(std::size_t i) const {\n    (void)i;\n    return nullptr;\n  }\n  std::unique_ptr\u003cWidget\u003e clone() const override { return nullptr; }\n  std::string describe() const override { return \"\"; }\n  void setText(const std::string\u0026 text) override { title_ = text; }\n\n private:\n  std::string title_;\n};\n\nclass Palette {\n public:\n  bool add(const std::string\u0026 name, const Widget\u0026 prototype) {\n    (void)name;\n    (void)prototype;\n    return false;\n  }\n  std::unique_ptr\u003cWidget\u003e spawn(const std::string\u0026 name) const {\n    (void)name;\n    return nullptr;\n  }\n};\n39:Te95,#include \u003cmemory\u003e\n#include \u003cstring\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nTEST(Describe, WidgetsDescribeThemselves) {\n  EXPECT_EQ(Label(\"Name\").describe(), std::string(\"label(Name)\"));\n  EXPECT_EQ(Badge(\"new\").describe(), std::string(\"badge(new)\"));\n  Panel p(\"form\");\n  EXPECT_EQ(p.describe(), std::string(\"panel(form)[]\"));\n  p.add(std::make_unique\u003cLabel\u003e(\"Name\")).add(std::make_unique\u003cBadge\u003e(\"new\"));\n  EXPECT_EQ(p.describe(), std::string(\"panel(form)[label(Name),badge(new)]\"));\n  EXPECT_EQ(p.size(), static_cast\u003cstd::size_t\u003e(2));\n  EXPECT_TRUE(p.child(2) == nullptr);\n}\n\nTEST(Clone, KeepsTheDynamicType) {\n  const Badge b(\"new\");\n  const std::unique_ptr\u003cWidget\u003e c = b.clone();\n  ASSERT_TRUE(c != nullptr);\n  EXPECT_EQ(c-\u003edescribe(), std::string(\"badge(new)\"));\n  const Label l(\"hi\");\n  EXPECT_EQ(l.clone()-\u003edescribe(), std::string(\"label(hi)\"));\n}\n\nTEST(Clone, ThroughTheBaseInterface) {\n  std::unique_ptr\u003cWidget\u003e w = std::make_unique\u003cBadge\u003e(\"beta\");\n  std::unique_ptr\u003cWidget\u003e copy = w-\u003eclone();\n  EXPECT_TRUE(copy.get() != w.get());\n  EXPECT_EQ(copy-\u003edescribe(), std::string(\"badge(beta)\"));\n}\n\nTEST(Clone, EditingACopyLeavesTheOriginalAlone) {\n  Label original(\"a\");\n  auto copy = original.clone();\n  copy-\u003esetText(\"b\");\n  EXPECT_EQ(original.describe(), std::string(\"label(a)\"));\n  EXPECT_EQ(copy-\u003edescribe(), std::string(\"label(b)\"));\n  original.setText(\"c\");\n  EXPECT_EQ(copy-\u003edescribe(), std::string(\"label(b)\"));\n}\n\nTEST(Clone, PanelCopiesAreDeep) {\n  Panel original(\"form\");\n  original.add(std::make_unique\u003cLabel\u003e(\"Name\")).add(std::make_unique\u003cBadge\u003e(\"new\"));\n  auto copy = original.clone();\n  ASSERT_TRUE(copy != nullptr);\n  EXPECT_EQ(copy-\u003edescribe(), original.describe());\n  auto\u0026 copyPanel = static_cast\u003cPanel\u0026\u003e(*copy);\n  ASSERT_TRUE(copyPanel.child(0) != nullptr);\n  copyPanel.child(0)-\u003esetText(\"Email\");\n  copy-\u003esetText(\"signup\");\n  EXPECT_EQ(original.describe(), std::string(\"panel(form)[label(Name),badge(new)]\"));\n  EXPECT_EQ(copy-\u003edescribe(), std::string(\"panel(signup)[label(Email),badge(new)]\"));\n  EXPECT_TRUE(copyPanel.child(0) != original.child(0));\n  original.child(1)-\u003esetText(\"old\");\n  EXPECT_EQ(copy-\u003edescribe(), std::string(\"panel(signup)[label(Email),badge(new)]\"));\n}\n\nTEST(Clone, NestedPanelsAreDeep) {\n  Panel outer(\"outer\");\n  auto inner = std::make_unique\u003cPanel\u003e(\"inner\");\n  inner-\u003eadd(std::make_unique\u003cBadge\u003e(\"x\"));\n  outer.add(std::move(inner));\n  auto copy = outer.clone();\n  static_cast\u003cPanel*\u003e(static_cast\u003cPanel\u0026\u003e(*copy).child(0))-\u003echild(0)-\u003esetText(\"y\");\n  EXPECT_EQ(outer.describe(), std::string(\"panel(outer)[panel(inner)[badge(x)]]\"));\n  EXPECT_EQ(copy-\u003edescribe(), std::string(\"panel(outer)[panel(inner)[badge(y)]]\"));\n}\n\nTEST(Palette, SpawnsIndependentCopies) {\n  Panel proto(\"card\");\n  proto.add(std::make_unique\u003cBadge\u003e(\"hot\"));\n  Palette palette;\n  EXPECT_TRUE(palette.add(\"card\", proto));\n  auto a = palette.spawn(\"card\");\n  auto b = palette.spawn(\"card\");\n  ASSERT_TRUE(a != nullptr \u0026\u0026 b != nullptr);\n  EXPECT_TRUE(a.get() != b.get());\n  a-\u003esetText(\"changed\");\n  EXPECT_EQ(b-\u003edescribe(), std::string(\"panel(card)[badge(hot)]\"));\n  EXPECT_EQ(palette.spawn(\"card\")-\u003edescribe(), std::string(\"panel(card)[badge(hot)]\"));\n}\n\nTEST(Palette, KeepsItsOwnSnapshot) {\n  Label source(\"v1\");\n  Palette palette;\n  EXPECT_TRUE(palette.add(\"title\", source));\n  source.setText(\"v2\");\n  EXPECT_EQ(palette.spawn(\"title\")-\u003edescribe(), std::string(\"label(v1)\"));\n}\n\nTEST(Palette, RejectsBadNamesAndUnknownSpawn) {\n  Label a(\"a\");\n  Label b(\"b\");\n  Palette palette;\n  EXPECT_FALSE(palette.add(\"\", a));\n  EXPECT_TRUE(palette.add(\"x\", a));\n  EXPECT_FALSE(palette.add(\"x\", b));\n  EXPECT_EQ(palette.spawn(\"x\")-\u003edescribe(), std::string(\"label(a)\"));\n  EXPECT_TRUE(palette.spawn(\"nope\") == nullptr);\n}\n3a:T44e,An order service needs unique, increasing order numbers. Today it reaches for a global counter, so nothing can test it with known numbers and nothing stops two counters from existing. Do both halves in `solution.h`; `api.h` gives the `IdSource` interface.\n\n**1. `IdGenerator`**: the one real counter, as a *Meyers singleton* implementing `IdSource`.\n- `static IdGenerator\u0026 instance()`: always the same object (a function-local `static`, so construction is thread-safe).\n- `long next() override`: returns 1, 2, 3, ... across **all** callers of `instance()`.\n- Nobody else can create one: private constructor, and no copy or move (a stray `auto g = IdGenerator::instance();` must not compile).\n\n**2. `OrderService`**: takes an `IdSource\u0026` in its constructor and never names `IdGenerator`. `std::string place(const std::string\u0026 item)` returns `\"ORD-\u003cid\u003e:\u003citem\u003e\"`, for example `\"ORD-7:tea\"`.\n\nThe tests build `OrderService` with a fake `IdSource` that returns known numbers, and with the real singleton. The singleton exists once, at the edge; the logic that needs numbers does not know it is a singleton.\n3b:T79f,#include \u003cstring\u003e\n#include \u003ctype_traits\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\nstruct FakeIds : IdSource {  // known numbers, no singleton involved\n  long value;\n  explicit FakeIds(long start) : value(start) {}\n  long next() override { return value++; }\n};\n}  // namespace\n\nTEST(Singleton, SameObjectEveryTime) {\n  IdGenerator\u0026 a = IdGenerator::instance();\n  IdGenerator\u0026 b = IdGenerator::instance();\n  EXPECT_TRUE(\u0026a == \u0026b);\n}\n\nTEST(Singleton, CountsAcrossAllCallers) {\n  IdGenerator\u0026 a = IdGenerator::instance();\n  IdGenerator\u0026 b = IdGenerator::instance();\n  const long first = a.next();\n  EXPECT_EQ(b.next(), first + 1);\n  EXPECT_EQ(IdGenerator::instance().next(), first + 2);\n}\n\nTEST(Singleton, CannotBeCopiedOrCreated) {\n  EXPECT_FALSE(std::is_copy_constructible\u003cIdGenerator\u003e::value);\n  EXPECT_FALSE(std::is_copy_assignable\u003cIdGenerator\u003e::value);\n  EXPECT_FALSE(std::is_move_constructible\u003cIdGenerator\u003e::value);\n  EXPECT_FALSE(std::is_move_assignable\u003cIdGenerator\u003e::value);\n  EXPECT_FALSE(std::is_default_constructible\u003cIdGenerator\u003e::value);\n}\n\nTEST(OrderService, UsesTheInjectedSource) {\n  FakeIds ids(100);\n  OrderService service(ids);\n  EXPECT_EQ(service.place(\"tea\"), std::string(\"ORD-100:tea\"));\n  EXPECT_EQ(service.place(\"cake\"), std::string(\"ORD-101:cake\"));\n  EXPECT_EQ(ids.value, 102L);\n}\n\nTEST(OrderService, TwoServicesShareOneSourceWhenGivenOne) {\n  FakeIds ids(1);\n  OrderService a(ids);\n  OrderService b(ids);\n  EXPECT_EQ(a.place(\"x\"), std::string(\"ORD-1:x\"));\n  EXPECT_EQ(b.place(\"y\"), std::string(\"ORD-2:y\"));\n}\n\nTEST(OrderService, WorksWithTheRealSingleton) {\n  OrderService service(IdGenerator::instance());\n  const std::string first = service.place(\"a\");\n  const std::string second = service.place(\"b\");\n  EXPECT_TRUE(first.rfind(\"ORD-\", 0) == 0);\n  EXPECT_TRUE(first.size() \u003e 6 \u0026\u0026 first.substr(first.size() - 2) == \":a\");\n  EXPECT_TRUE(second.substr(second.size() - 2) == \":b\");\n  EXPECT_TRUE(first != second);\n}\n3c:T4bb,A server builds a response in a scratch `Buffer` (`api.h`: an alias for `std::string`) for every request, and allocating a big one each time is slow. Write `BufferPool` in `solution.h`: it owns a fixed number of buffers and **leases** them out.\n\n- `explicit BufferPool(std::size_t capacity)` creates `capacity` buffers up front. `capacity()` and `available()` (idle buffers right now) report counts.\n- `Lease acquire()` hands out an idle buffer. When none is idle it returns an **empty** lease (`explicit operator bool` is `false`); it never allocates a new one and never throws.\n- `BufferPool::Lease` is the RAII handle: `*lease` / `lease-\u003e` reach the buffer. It is **move-only**. When a lease is destroyed, or overwritten by a move-assignment, its buffer goes back to the pool, **cleared**, so the next user never sees the previous request's data. A moved-from lease is empty and gives nothing back.\n\nPitfalls the tests probe: a returned buffer must be reset; a move must hand over ownership exactly once (no double release); move-assigning onto a live lease must first release what it held; and a pooled buffer is *reused* (same object), not recreated. The pool must outlive its leases; say so in a comment.\n3d:Td24,#include \u003cstring\u003e\n#include \u003ctype_traits\u003e\n#include \u003cutility\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nTEST(Pool, StartsFullAndExhaustsAtCapacity) {\n  BufferPool pool(2);\n  EXPECT_EQ(pool.capacity(), static_cast\u003cstd::size_t\u003e(2));\n  EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(2));\n  auto a = pool.acquire();\n  auto b = pool.acquire();\n  EXPECT_TRUE(static_cast\u003cbool\u003e(a));\n  EXPECT_TRUE(static_cast\u003cbool\u003e(b));\n  EXPECT_TRUE(\u0026*a != \u0026*b);\n  EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(0));\n}\n\nTEST(Pool, ExhaustedGivesAnEmptyLease) {\n  BufferPool pool(1);\n  auto a = pool.acquire();\n  auto b = pool.acquire();\n  EXPECT_TRUE(static_cast\u003cbool\u003e(a));\n  EXPECT_FALSE(static_cast\u003cbool\u003e(b));\n  EXPECT_EQ(pool.capacity(), static_cast\u003cstd::size_t\u003e(1));\n  EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(0));\n}\n\nTEST(Pool, LeaseReturnsOnScopeExit) {\n  BufferPool pool(2);\n  {\n    auto a = pool.acquire();\n    EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(1));\n  }\n  EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(2));\n}\n\nTEST(Pool, ReturnedBufferIsClearedAndReused) {\n  BufferPool pool(1);\n  const Buffer* first = nullptr;\n  {\n    auto a = pool.acquire();\n    ASSERT_TRUE(static_cast\u003cbool\u003e(a));\n    *a += \"secret of request 1\";\n    first = \u0026*a;\n  }\n  auto b = pool.acquire();\n  ASSERT_TRUE(static_cast\u003cbool\u003e(b));\n  EXPECT_TRUE(b-\u003eempty());\n  EXPECT_TRUE(\u0026*b == first);  // reused, not recreated\n}\n\nTEST(Pool, EmptyLeaseGivesNothingBack) {\n  BufferPool pool(1);\n  auto a = pool.acquire();\n  {\n    auto none = pool.acquire();\n    EXPECT_FALSE(static_cast\u003cbool\u003e(none));\n  }\n  EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(0));\n}\n\nTEST(Lease, IsMoveOnly) {\n  EXPECT_FALSE(std::is_copy_constructible\u003cBufferPool::Lease\u003e::value);\n  EXPECT_FALSE(std::is_copy_assignable\u003cBufferPool::Lease\u003e::value);\n  EXPECT_TRUE(std::is_move_constructible\u003cBufferPool::Lease\u003e::value);\n  EXPECT_TRUE(std::is_move_assignable\u003cBufferPool::Lease\u003e::value);\n}\n\nTEST(Lease, MoveTransfersOwnershipOnce) {\n  BufferPool pool(2);\n  {\n    auto a = pool.acquire();\n    *a = \"hello\";\n    BufferPool::Lease b = std::move(a);\n    EXPECT_FALSE(static_cast\u003cbool\u003e(a));\n    ASSERT_TRUE(static_cast\u003cbool\u003e(b));\n    EXPECT_EQ(*b, std::string(\"hello\"));\n    EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(1));\n  }\n  EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(2));  // exactly one give-back, not two\n  auto x = pool.acquire();\n  auto y = pool.acquire();\n  EXPECT_TRUE(\u0026*x != \u0026*y);\n  EXPECT_FALSE(static_cast\u003cbool\u003e(pool.acquire()));\n}\n\nTEST(Lease, MoveAssignReleasesWhatItHeld) {\n  BufferPool pool(2);\n  auto a = pool.acquire();\n  auto b = pool.acquire();\n  EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(0));\n  a = std::move(b);  // a's old buffer must go back to the pool\n  EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(1));\n  EXPECT_TRUE(static_cast\u003cbool\u003e(a));\n  EXPECT_FALSE(static_cast\u003cbool\u003e(b));\n  a = BufferPool::Lease();  // overwrite with an empty lease: releases the second buffer too\n  EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(2));\n}\n\nTEST(Lease, SelfMoveAssignKeepsTheBuffer) {\n  BufferPool pool(1);\n  auto a = pool.acquire();\n  *a = \"kept\";\n  BufferPool::Lease\u0026 same = a;\n  a = std::move(same);\n  ASSERT_TRUE(static_cast\u003cbool\u003e(a));\n  EXPECT_EQ(*a, std::string(\"kept\"));\n  EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(0));\n}\nc:[\"$\",\"$L24\",null,{\"exercises\":{\"old-town\":[{\"id\":\"file-handle\",\"title\":\"FileHandle: RAII and move-only ownership\",\"prompt\":\"The `os` namespace in `api.h` hands out numeric ids you must give back with `os::close`. Forgetting leaks an id; closing twice is an error.\\n\\nWrite `FileHandle` in `solution.h` so that nobody ever has to remember:\\n\\n- `explicit FileHandle(const std::string\u0026 path)` opens the file; the destructor closes it.\\n- `int id() const` returns the id, or `0` for a moved-from handle.\\n- It **cannot be copied** (two owners would close twice) but it **can be moved**: a move transfers the id and leaves the source empty (`id() == 0`), and the empty source closes nothing.\\n- Move assignment closes whatever the target already held before taking the new id. Self-move-assignment must not close anything.\\n\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n\\n// A tiny pretend operating system. open() hands out ids, close() takes them back.\\nnamespace os {\\nint open(const std::string\u0026 path);   // returns a fresh id (\u003e 0)\\nvoid close(int id);                  // closing an id that is not open counts as an error\\nint openCount();                     // how many ids are open right now\\nint closeErrors();                   // how many bad closes (double close, unknown id) happened\\nvoid reset();\\n}  // namespace os\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: own the id, release it in the destructor, forbid copying, allow moving.\\nclass FileHandle {\\n public:\\n  explicit FileHandle(const std::string\u0026 path) : id_(os::open(path)) {}\\n  int id() const { return id_; }\\n\\n private:\\n  int id_;\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$25\"}],\"hints\":[\"Who is responsible for calling `os::close`? Make that the destructor's job, never the caller's.\",\"If two objects could hold the same id, both destructors would close it. Delete the copy operations and write the moves.\",\"A move must leave the source owning nothing. `std::exchange(other.id_, 0)` takes the id and empties the source in one expression. Close the old id before overwriting it in move assignment.\"],\"driver\":{\"path\":\"driver.cpp\",\"content\":\"#define BP_TEST_MAIN\\n#include \\\"bp_test.h\\\"\\n\",\"readOnly\":true},\"testCount\":7}],\"solid-square\":[{\"id\":\"srp-invoice\",\"title\":\"Invoice: one class, one reason to change\",\"prompt\":\"A single `Invoice` class used to hold line items, add up the total, format the text *and* save it. Four reasons to change in one class. Split it so each class has one job. In `solution.h` write:\\n\\n- `Invoice`: holds data and the arithmetic of its own data only. `void add(const LineItem\u0026)`, `long long totalCents() const` (sum of `unitCents * quantity`), `const std::vector\u003cLineItem\u003e\u0026 items() const`. It must **not** know how to render or store itself.\\n- `InvoiceFormatter` with `std::string render(const Invoice\u0026) const`. One line per item in the form `\\\"\u003cname\u003e x\u003cquantity\u003e = \u003cmoney\u003e\\\\n\\\"`, then `\\\"TOTAL \u003cmoney\u003e\\\\n\\\"`. `\u003cmoney\u003e` is cents as dollars with two digits: `1250` is `12.50`, `5` is `0.05`, `0` is `0.00`.\\n- `InvoiceArchiver` constructed with an `InvoiceSink\u0026`, with `void archive(const Invoice\u0026)` that renders the invoice (using `InvoiceFormatter`) and passes the text to the sink's `store` exactly once.\\n\\nA test checks with a compile-time trait that `Invoice` has no `render` or `store` member.\\n\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n\\nstruct LineItem {\\n  std::string name;\\n  long long unitCents;\\n  int quantity;\\n};\\n\\n// Where finished invoice text goes (a file, a database, a test double).\\nclass InvoiceSink {\\n public:\\n  virtual ~InvoiceSink() = default;\\n  virtual void store(const std::string\u0026 text) = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n#include \u003cvector\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: one class per reason to change. Invoice holds data and its total only.\\nclass Invoice {\\n public:\\n  void add(const LineItem\u0026 item) { items_.push_back(item); }\\n  long long totalCents() const { return 0; }\\n  const std::vector\u003cLineItem\u003e\u0026 items() const { return items_; }\\n\\n private:\\n  std::vector\u003cLineItem\u003e items_;\\n};\\n\\nclass InvoiceFormatter {\\n public:\\n  std::string render(const Invoice\u0026) const { return \\\"\\\"; }\\n};\\n\\nclass InvoiceArchiver {\\n public:\\n  explicit InvoiceArchiver(InvoiceSink\u0026 sink) { (void)sink; }\\n  void archive(const Invoice\u0026) {}\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$26\"}],\"hints\":[\"List who would ask for a change: finance (how totals work), design (how text looks), operations (where it is saved). Each is a different reason to change.\",\"`Invoice` keeps items and sums them. `InvoiceFormatter` only turns an `Invoice` into text. `InvoiceArchiver` only hands text to an `InvoiceSink`.\",\"`money(cents)`: dollars are `cents / 100`; the remainder `cents % 100` needs a leading `0` when below 10. `archive` is `sink_.store(formatter_.render(invoice))`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":9},{\"id\":\"ocp-shipping\",\"title\":\"Shipping quotes: add a carrier without editing the calculator\",\"prompt\":\"A shop prices shipping with rules. Today it has a big `if (country == ...) ... else if (grams \u003e ...)` ladder, and every new carrier means editing it. Make the calculator **closed for modification, open for extension**. `api.h` gives `Parcel` and the `ShippingRule` interface. Write `ShippingCalculator` in `solution.h`:\\n\\n- `void add(std::unique_ptr\u003cShippingRule\u003e rule)`: the calculator takes ownership of the rule. A null rule is ignored.\\n- `long long quote(const Parcel\u0026 parcel) const`: the **cheapest** price among the rules that `matches` the parcel; `-1` when no rule matches.\\n- `std::size_t ruleCount() const`.\\n\\nThe calculator must not know any concrete rule: the tests register rules you have never seen, and destroying the calculator must destroy every rule it owns.\\n\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n\\nstruct Parcel {\\n  int grams;\\n  std::string country;\\n};\\n\\n// One way of pricing a parcel. New carriers and promotions are new subclasses.\\nclass ShippingRule {\\n public:\\n  virtual ~ShippingRule() = default;\\n  // Does this rule apply to the parcel?\\n  virtual bool matches(const Parcel\u0026 parcel) const = 0;\\n  // Price in cents (only meaningful when matches() is true).\\n  virtual long long cents(const Parcel\u0026 parcel) const = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cmemory\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: the price must come from registered ShippingRule objects, not from an if-ladder here.\\nclass ShippingCalculator {\\n public:\\n  void add(std::unique_ptr\u003cShippingRule\u003e rule) { (void)rule; }\\n  long long quote(const Parcel\u0026 parcel) const {\\n    if (parcel.country == \\\"US\\\") return 500;\\n    return -1;\\n  }\\n  std::size_t ruleCount() const { return 0; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$27\"}],\"hints\":[\"Which part changes every time marketing invents a carrier, and which part (pick the cheapest, handle none) never does? Put only the stable part in the calculator.\",\"Keep a `std::vector\u003cstd::unique_ptr\u003cShippingRule\u003e\u003e`. `add` moves the rule in; `quote` loops over the rules and never names a concrete class.\",\"`quote`: `long long best = -1; for (const auto\u0026 r : rules_) { if (!r-\u003ematches(p)) continue; const long long c = r-\u003ecents(p); if (best \u003c 0 || c \u003c best) best = c; } return best;`\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":6},{\"id\":\"lsp-account\",\"title\":\"Accounts: subtypes that keep the base's promises\",\"prompt\":\"$28\",\"api\":\"#pragma once\\n\\n// The contract every Account must honour (callers rely on it, so subtypes must not break it):\\n//   deposit(x):  ignored when x \u003c= 0, otherwise balance() grows by exactly x.\\n//   withdraw(x): when it returns true, balance() fell by exactly x;\\n//                when it returns false, balance() is unchanged.\\n//   A subtype may accept MORE withdrawals than the base promises, never fewer.\\n//   Base promise: withdraw(x) succeeds whenever 0 \u003c x \u003c= balance().\\nclass Account {\\n public:\\n  virtual ~Account() = default;\\n  virtual void deposit(long long cents) = 0;\\n  virtual bool withdraw(long long cents) = 0;\\n  virtual long long balance() const = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"$29\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$2a\"}],\"hints\":[\"Read the contract in `api.h`: after a failed withdraw nothing may change, and after a successful one the balance falls by exactly the amount. Which kind of subclass would break that?\",\"`CheckingAccount` may accept more (overdraft) but must never refuse something the base promises. `FixedDeposit` cannot promise anything about `withdraw`, so it should not claim to be an `Account` at all.\",\"Both accounts: ignore non-positive amounts, check the limit (`balance_` for savings, `balance_ + overdraft_` for checking), then `balance_ -= cents`. `FixedDeposit::redeem` deposits the principal into `into` only when matured, then zeroes it.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":11},{\"id\":\"isp-machine\",\"title\":\"Office machines: no client forced to depend on what it does not use\",\"prompt\":\"An office once had a fat `Machine` interface with `print`, `scan` and `fax`, so the cheap `BasicPrinter` had to implement `scan` and `fax` as stubs that did nothing. `api.h` already splits the roles into `Printer` and `Scanner`. Write in `solution.h`:\\n\\n- `class BasicPrinter : public Printer`: **only** a printer. One page holds 10 characters, so `print` returns `ceil(text.size() / 10)` pages (`0` for an empty text).\\n- `class AllInOne : public Printer, public Scanner`: prints like `BasicPrinter`; `scan` returns `\\\"scan#1\\\"`, then `\\\"scan#2\\\"`, and so on.\\n- `int copyDocument(Scanner\u0026 from, Printer\u0026 to)`: scan one document, print it, return the pages printed. It must work with *any* scanner and *any* printer, including two different objects.\\n\\n`BasicPrinter` must not be a `Scanner`.\\n\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n\\n// Narrow roles. A client depends only on the role it uses.\\nclass Printer {\\n public:\\n  virtual ~Printer() = default;\\n  // Prints the text and returns the number of pages used.\\n  virtual int print(const std::string\u0026 text) = 0;\\n};\\n\\nclass Scanner {\\n public:\\n  virtual ~Scanner() = default;\\n  // Returns the text of the next scanned document.\\n  virtual std::string scan() = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: split the roles. BasicPrinter must not be a Scanner; copyDocument takes the narrow roles.\\nclass BasicPrinter : public Printer {\\n public:\\n  int print(const std::string\u0026 text) override {\\n    (void)text;\\n    return 0;\\n  }\\n};\\n\\nclass AllInOne : public Printer {\\n public:\\n  int print(const std::string\u0026 text) override {\\n    (void)text;\\n    return 0;\\n  }\\n};\\n\\ninline int copyDocument(Printer\u0026 to, Printer\u0026 from) {\\n  (void)to;\\n  (void)from;\\n  return 0;\\n}\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$2b\"}],\"hints\":[\"Who is forced to carry a `scan` they cannot do? Let each class implement exactly the roles it really has.\",\"`BasicPrinter : Printer`; `AllInOne : Printer, Scanner`. Share the page maths in one small helper instead of copying it. `copyDocument` takes the two roles, not a machine.\",\"Pages: `static_cast\u003cint\u003e((text.size() + 9) / 10)`. `copyDocument(Scanner\u0026 from, Printer\u0026 to) { return to.print(from.scan()); }`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":8},{\"id\":\"dip-notifier\",\"title\":\"Order service: depend on an abstraction, not on email\",\"prompt\":\"An order service must tell customers their order is confirmed, but it must not know *how*. `api.h` gives the abstraction `MessageSender`. Write `OrderService` in `solution.h`:\\n\\n- `explicit OrderService(MessageSender\u0026 sender)`: the service uses the sender it is given. It does not create one, and it does not use a global.\\n- `bool placeOrder(const std::string\u0026 customer, int quantity)`:\\n  - `quantity \u003c= 0` is rejected: return `false` and send nothing.\\n  - otherwise send one message to `customer` with the body `\\\"Order confirmed: \u003cquantity\u003e item(s)\\\"` (for example `\\\"Order confirmed: 3 item(s)\\\"`).\\n  - return `true` only when the sender reports delivery; if `send` returns `false`, the order is not confirmed and `placeOrder` returns `false`.\\n- `int confirmedCount() const`: how many orders were confirmed (delivered) so far.\\n\\nThe tests pass in senders of their own: one that records messages and one that always fails.\\n\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n\\n// The abstraction the order service depends on. Real senders (email, SMS, a test double) implement it.\\nclass MessageSender {\\n public:\\n  virtual ~MessageSender() = default;\\n  // Returns true when the message was delivered.\\n  virtual bool send(const std::string\u0026 to, const std::string\u0026 body) = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: depend on the MessageSender abstraction. Do not create a sender yourself.\\nclass OrderService {\\n public:\\n  explicit OrderService(MessageSender\u0026 sender) { (void)sender; }\\n  bool placeOrder(const std::string\u0026 customer, int quantity) {\\n    (void)customer;\\n    (void)quantity;\\n    return false;\\n  }\\n  int confirmedCount() const { return 0; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$2c\"}],\"hints\":[\"The tests give you a sender you have never seen. Where can the service get it from, if it must not create one or reach for a global?\",\"Take `MessageSender\u0026` in the constructor and keep it in a member. The service decides *when* to notify; the sender decides *how*.\",\"`placeOrder`: reject `quantity \u003c= 0` first; build the body with `std::to_string`; `if (!sender_.send(customer, body)) return false;` then `++confirmed_` and return true.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":6},{\"id\":\"dip-clock\",\"title\":\"Sessions: inject the clock and own it\",\"prompt\":\"Code that calls the system clock directly cannot be tested: you would have to sleep. Make time an injected dependency. `api.h` gives the `Clock` abstraction. Write `SessionStore` in `solution.h`:\\n\\n- `SessionStore(std::unique_ptr\u003cClock\u003e clock, long long ttlSeconds)`: the store **owns** its clock (the caller hands it over with `std::move`). It never reads the system clock itself.\\n- `std::string open(const std::string\u0026 user)`: creates a session at the current time and returns its token: `\\\"s1\\\"`, `\\\"s2\\\"`, ...\\n- `bool isValid(const std::string\u0026 token) const`: true when the token exists and `now - createdAt \u003c ttlSeconds` (a session created exactly `ttl` seconds ago has expired).\\n- `std::size_t activeCount() const`: how many sessions are valid right now.\\n\\nThe tests give you a clock they can move, and check that destroying the store destroys the clock it owns.\\n\",\"api\":\"#pragma once\\n\\n// Where \\\"now\\\" comes from. Production uses the system clock; tests use a clock they can move.\\nclass Clock {\\n public:\\n  virtual ~Clock() = default;\\n  virtual long long nowSeconds() const = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: use the injected Clock (and own it); never read the system clock here.\\nclass SessionStore {\\n public:\\n  SessionStore(std::unique_ptr\u003cClock\u003e clock, long long ttlSeconds) {\\n    (void)clock;\\n    (void)ttlSeconds;\\n  }\\n  std::string open(const std::string\u0026 user) {\\n    (void)user;\\n    return \\\"\\\";\\n  }\\n  bool isValid(const std::string\u0026 token) const {\\n    (void)token;\\n    return false;\\n  }\\n  std::size_t activeCount() const { return 0; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$2d\"}],\"hints\":[\"How would a test ever make a session expire without waiting? The store needs a time source it does not create itself.\",\"Take `std::unique_ptr\u003cClock\u003e` by value in the constructor and `std::move` it into a member: that says \\\"the store owns this clock\\\". Keep a `std::map\u003cstd::string, long long\u003e` of token to creation time.\",\"`isValid`: find the token; `return it != end \u0026\u0026 clock_-\u003enowSeconds() - it-\u003esecond \u003c ttl_;`. `activeCount` counts the valid ones. Tokens: `\\\"s\\\" + std::to_string(++counter_)`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":6},{\"id\":\"demeter-wallet\",\"title\":\"Shop and customer: tell, don't ask\",\"prompt\":\"A shop sells to customers who have money. The tempting code is `customer.getWallet().getBalance() \u003e= price` followed by `customer.getWallet().setBalance(...)`: the shop reaches through the customer into its wallet, so every caller depends on the customer's internals. Follow the Law of Demeter and *tell, don't ask*. Write in `solution.h`:\\n\\n- `class Wallet`: `explicit Wallet(long long cents = 0)`; `bool charge(long long cents)` (false and no change unless `0 \u003c cents \u003c= balance`); `void deposit(long long cents)` (ignores `cents \u003c= 0`); `long long balance() const`.\\n- `class Customer`: `Customer(std::string name, long long openingCents)`; `const std::string\u0026 name() const`; `bool pay(long long cents)`; `void topUp(long long cents)`; `long long funds() const`. A `Customer` must **not** hand out its wallet: no `wallet()` accessor.\\n- `class Shop`: `bool sell(Customer\u0026 buyer, long long priceCents)` asks the customer to pay and counts the price as revenue only when the payment succeeded; `long long revenue() const`.\\n\",\"api\":\"$undefined\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n\\n// TODO: Customer must not expose its Wallet; Shop only calls customer.pay(...).\\nclass Wallet {\\n public:\\n  explicit Wallet(long long cents = 0) : balance_(cents) {}\\n  bool charge(long long cents) {\\n    (void)cents;\\n    return false;\\n  }\\n  void deposit(long long cents) { (void)cents; }\\n  long long balance() const { return balance_; }\\n\\n private:\\n  long long balance_;\\n};\\n\\nclass Customer {\\n public:\\n  Customer(std::string name, long long openingCents) : name_(name), wallet_(openingCents) {}\\n  const std::string\u0026 name() const { return name_; }\\n  Wallet\u0026 wallet() { return wallet_; }\\n\\n private:\\n  std::string name_;\\n  Wallet wallet_;\\n};\\n\\nclass Shop {\\n public:\\n  bool sell(Customer\u0026 buyer, long long priceCents) {\\n    (void)buyer;\\n    (void)priceCents;\\n    return false;\\n  }\\n  long long revenue() const { return 0; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$2e\"}],\"hints\":[\"Who knows whether a payment is allowed? The object that holds the money. The shop should not need to know a wallet exists.\",\"`Customer` owns a `Wallet` member and forwards `pay`, `topUp` and `funds` to it. The rule (positive amount, enough money) lives in `Wallet::charge`. `Shop::sell` only calls `buyer.pay(price)`.\",\"`Shop::sell`: `if (!buyer.pay(priceCents)) return false; revenue_ += priceCents; return true;`. `Wallet::charge`: `if (cents \u003c= 0 || cents \u003e balance_) return false; balance_ -= cents; return true;`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":8},{\"id\":\"composition-history\",\"title\":\"Command history: has-a container, not is-a container\",\"prompt\":\"A text editor keeps the last few commands. The quick way is `class History : public std::vector\u003cstd::string\u003e`, and it works until someone calls `push_back` in a loop, `insert` in the middle or `clear` and the \\\"at most N entries\\\" rule is gone. Inheritance gave away the whole `vector` interface; you only wanted storage. Use **composition**. Write `BoundedHistory` in `solution.h`:\\n\\n- `explicit BoundedHistory(std::size_t capacity)`.\\n- `void add(const std::string\u0026 entry)`: appends; when the history is already at capacity the **oldest** entry is dropped first. A capacity of `0` keeps nothing.\\n- `std::size_t size() const`.\\n- `const std::string\u0026 at(std::size_t index) const`: index `0` is the oldest kept entry (the caller passes `index \u003c size()`).\\n- `std::string latest() const`: the newest entry, or `\\\"\\\"` when empty.\\n\\n`BoundedHistory` must not derive from `std::vector` and must not offer `push_back`.\\n\",\"api\":\"$undefined\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cstring\u003e\\n#include \u003cvector\u003e\\n\\n// TODO: do not inherit std::vector. Hold the storage as a private member and enforce the capacity.\\nclass BoundedHistory : public std::vector\u003cstd::string\u003e {\\n public:\\n  explicit BoundedHistory(std::size_t capacity) : capacity_(capacity) {}\\n  void add(const std::string\u0026 entry) { (void)entry; }\\n  std::string latest() const { return \\\"\\\"; }\\n\\n private:\\n  std::size_t capacity_;\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$2f\"}],\"hints\":[\"Does a history *behave like* a vector everywhere a vector is used? What would `history.insert(history.begin(), x)` do to the capacity rule?\",\"Hold a `std::deque\u003cstd::string\u003e` as a private member and expose only the five operations in the prompt. The invariant `size() \u003c= capacity` can then only be broken inside the class.\",\"`add`: `if (capacity_ == 0) return; if (items_.size() == capacity_) items_.pop_front(); items_.push_back(entry);`. `latest`: `items_.empty() ? std::string() : items_.back()`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":7}],\"creational-foundry\":[{\"id\":\"factory-registry\",\"title\":\"Codec factory: new codecs without editing the creator\",\"prompt\":\"$30\",\"api\":\"#pragma once\\n#include \u003cfunctional\u003e\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n\\n// A product that callers want by name, without knowing its concrete class.\\nclass Codec {\\n public:\\n  virtual ~Codec() = default;\\n  virtual std::string name() const = 0;\\n  virtual std::string encode(const std::string\u0026 text) const = 0;\\n};\\n\\n// How to make one Codec. New codecs ship a new factory, nothing else.\\nusing CodecFactory = std::function\u003cstd::unique_ptr\u003cCodec\u003e()\u003e;\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n#include \u003cvector\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: look the factory up in a registry instead of hard-coding names here.\\nclass CodecRegistry {\\n public:\\n  bool registerCodec(const std::string\u0026 name, CodecFactory factory) {\\n    (void)name;\\n    (void)factory;\\n    return false;\\n  }\\n  std::unique_ptr\u003cCodec\u003e create(const std::string\u0026 name) const {\\n    (void)name;\\n    return nullptr;\\n  }\\n  std::vector\u003cstd::string\u003e names() const { return {}; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$31\"}],\"hints\":[\"What changes when someone invents a codec, and what never does? The registry should only know how to look a name up and call what it finds.\",\"Store `std::map\u003cstd::string, CodecFactory\u003e`. `registerCodec` inserts; `create` finds the entry and calls the stored function. Nothing is built at registration.\",\"`return factories_.emplace(name, std::move(factory)).second;` rejects duplicates and keeps the first. `std::map` iterates in key order, so `names()` is already sorted.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":8},{\"id\":\"builder-request\",\"title\":\"HTTP request builder: only valid requests can exist\",\"prompt\":\"$32\",\"api\":\"$undefined\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"$33\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$34\"}],\"hints\":[\"Who may create an `HttpRequest`? If only the builder can, then every request that exists was validated. Make the constructor private and befriend the builder.\",\"The builder keeps defaults in its own members. Each setter returns `*this`. `build()` checks all the rules, then copies the fields into a new `HttpRequest` (build is const, so the builder stays reusable).\",\"For headers, scan for a case-insensitive match before appending: `std::tolower(static_cast\u003cunsigned char\u003e(c))` on both sides. Replace the value in place if found.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":10},{\"id\":\"abstract-factory-family\",\"title\":\"Widget families: products that must match\",\"prompt\":\"$35\",\"api\":\"#pragma once\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n\\n// Two kinds of widget. Every widget belongs to one visual family (\\\"light\\\", \\\"dark\\\", ...).\\nclass Button {\\n public:\\n  virtual ~Button() = default;\\n  virtual std::string family() const = 0;\\n  virtual std::string render(const std::string\u0026 label) const = 0;\\n};\\n\\nclass Checkbox {\\n public:\\n  virtual ~Checkbox() = default;\\n  virtual std::string family() const = 0;\\n  virtual std::string render(const std::string\u0026 label, bool checked) const = 0;\\n};\\n\\n// Makes a matching set of widgets. A screen is built from ONE factory, so it can never mix families.\\nclass WidgetFactory {\\n public:\\n  virtual ~WidgetFactory() = default;\\n  virtual std::unique_ptr\u003cButton\u003e createButton() const = 0;\\n  virtual std::unique_ptr\u003cCheckbox\u003e createCheckbox() const = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: one concrete factory per family (LightFactory, DarkFactory) that makes MATCHING products,\\n// a makeFactory(name) lookup, and a renderLogin(factory) that only talks to the WidgetFactory interface.\\ninline std::unique_ptr\u003cWidgetFactory\u003e makeFactory(const std::string\u0026 family) {\\n  (void)family;\\n  return nullptr;\\n}\\n\\ninline std::string renderLogin(const WidgetFactory\u0026 factory) {\\n  (void)factory;\\n  return \\\"\\\";\\n}\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$36\"}],\"hints\":[\"Which two decisions must always agree? The button and the checkbox come from the same family. Put that choice in one object, so call sites cannot disagree.\",\"`LightFactory` and `DarkFactory` each return their own button and checkbox. `renderLogin` takes a `const WidgetFactory\u0026` and calls `createCheckbox()` and `createButton()` on it, nothing else.\",\"Do not look at the concrete factory type inside `renderLogin` (no `dynamic_cast`, no family name compare). The test hands in a family you have never seen.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":7},{\"id\":\"prototype-clone\",\"title\":\"Prototype: copy a widget tree without knowing its types\",\"prompt\":\"$37\",\"api\":\"#pragma once\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n\\n// A UI element that can copy itself without the caller knowing its concrete type.\\nclass Widget {\\n public:\\n  virtual ~Widget() = default;\\n  // The prototype operation. C++ cannot make `unique_ptr\u003cDerived\u003e` covariant with `unique_ptr\u003cWidget\u003e`,\\n  // so every class returns `unique_ptr\u003cWidget\u003e` and must override this itself.\\n  virtual std::unique_ptr\u003cWidget\u003e clone() const = 0;\\n  virtual std::string describe() const = 0;\\n  virtual void setText(const std::string\u0026 text) = 0;  // a Panel's text is its title\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"$38\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$39\"}],\"hints\":[\"A copy constructor on the base class cannot know the derived type. Put the copy behind a virtual `clone()`; each concrete class creates its own type with `std::make_unique\u003cSelf\u003e(*this)`.\",\"`Badge` inherits from `Label`, so it inherits `Label::clone()` too, and that would return a `Label`. Override `clone()` in `Badge`.\",\"A `Panel` owns `unique_ptr` children, so the compiler cannot copy it for you. Its `clone()` makes a new `Panel` and adds `child-\u003eclone()` for each child. `Palette::add` must store `prototype.clone()`, not the address you were handed.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":9},{\"id\":\"singleton-meyers\",\"title\":\"Meyers singleton, injected where it is used\",\"prompt\":\"$3a\",\"api\":\"#pragma once\\n\\n// Anything that hands out unique, increasing order numbers.\\nclass IdSource {\\n public:\\n  virtual ~IdSource() = default;\\n  virtual long next() = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: make IdGenerator a Meyers singleton (private constructor, deleted copy and move,\\n// instance() returning a reference), and give OrderService an IdSource\u0026 instead of a global.\\nclass IdGenerator : public IdSource {\\n public:\\n  static IdGenerator\u0026 instance() {\\n    static IdGenerator generator;\\n    return generator;\\n  }\\n  long next() override { return 0; }\\n\\n private:\\n  IdGenerator() = default;\\n};\\n\\nclass OrderService {\\n public:\\n  std::string place(const std::string\u0026 item) { return item; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$3b\"}],\"hints\":[\"Two jobs: make exactly one `IdGenerator` possible, and keep `OrderService` from depending on that fact. The second job is just a constructor parameter of type `IdSource\u0026`.\",\"`static IdGenerator\u0026 instance() { static IdGenerator g; return g; }` with a private default constructor and `= delete` for copy and move. Return a reference, never a value.\",\"`OrderService` stores `IdSource\u0026 ids_` and builds `\\\"ORD-\\\" + std::to_string(ids_.next()) + \\\":\\\" + item`. Only the code that wires the app calls `IdGenerator::instance()`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":6},{\"id\":\"pool-lease\",\"title\":\"Object pool with RAII leases\",\"prompt\":\"$3c\",\"api\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cstring\u003e\\n\\n// What a caller sees of a pooled resource: a scratch buffer it may fill and read.\\nusing Buffer = std::string;\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: own `capacity` buffers; make Lease a move-only RAII handle that returns its buffer\\n// (cleared) to the pool when destroyed or overwritten.\\nclass BufferPool {\\n public:\\n  class Lease {\\n   public:\\n    explicit operator bool() const { return false; }\\n    Buffer\u0026 operator*() const { return *buffer_; }\\n    Buffer* operator-\u003e() const { return buffer_; }\\n\\n   private:\\n    Buffer* buffer_ = nullptr;\\n  };\\n\\n  explicit BufferPool(std::size_t capacity) : capacity_(capacity) {}\\n  Lease acquire() { return Lease(); }\\n  std::size_t capacity() const { return capacity_; }\\n  std::size_t available() const { return 0; }\\n\\n private:\\n  std::size_t capacity_;\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$3d\"}],\"hints\":[\"Callers must never have to remember to give the buffer back. Return a small handle object whose destructor does it.\",\"The pool holds `std::vector\u003cstd::unique_ptr\u003cBuffer\u003e\u003e` for stable addresses and a `std::vector\u003cBuffer*\u003e` of idle ones. `acquire` pops from the idle list; `giveBack` clears the buffer and pushes it.\",\"Lease: delete copy; move constructor steals the pointers and nulls the source; move assignment does `release()` first, then steals (guard self-assignment); the destructor calls `release()`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":9}]}}]\n"])</script></body></html>
