t\":\"$43\"}],\"hints\":[\"Two things vary: shape kind and backend. Do not make a class per combination. Give every shape a `Renderer` it calls, and implement each backend once.\",\"Put the shared piece in a small base class that stores a pointer to the `Renderer` (a pointer, not a reference, so `setRenderer` can switch it). Shapes call only `line` and `circle`.\",\"`Drawing::useRenderer` must walk every shape and call `setRenderer`. A `Rectangle` is four `line` calls in the documented order; `move` has to shift the stored coordinates so later draws use them.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":9},{\"id\":\"composite-fs\",\"title\":\"Composite: files and folders behind one interface\",\"prompt\":\"$44\",\"api\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cstring\u003e\\n\\n// One interface for both leaves and containers: callers treat a file and a whole folder the same way.\\nclass Node {\\n public:\\n  virtual ~Node() = default;\\n  virtual const std::string\u0026 name() const = 0;\\n  // Bytes: a file's own size, or the total of everything below a directory.\\n  virtual long long size() const = 0;\\n  // Number of files at or below this node (a file counts itself as 1).\\n  virtual std::size_t fileCount() const = 0;\\n  // The listing, indented two spaces per `depth` level.\\n  virtual std::string render(int depth = 0) const = 0;\\n  // Resolve a relative path like \\\"src/util/a.h\\\" below this node. An empty path means this node.\\n  // Returns nullptr when nothing is there.\\n  virtual const Node* find(const std::string\u0026 path) const = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"$45\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$46\"}],\"hints\":[\"Both `File` and `Directory` are a `Node`. The directory's answers to `size`, `fileCount` and `render` are built from its children's answers, so it never needs to ask whether a child is a file or a folder.\",\"`Directory::size` must add up `child-\u003esize()`, which for a nested folder is itself a sum. For `find`, split the path at the first `/`, pick the child by name and hand the *rest* of the path to that child.\",\"`add` has three refusal cases: null, an existing child name, and `child.get() == this`. A `File::find` answers `this` only for an empty path.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":8},{\"id\":\"decorator-stream\",\"title\":\"Decorator: stackable writers, and the order is the caller's choice\",\"prompt\":\"$47\",\"api\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cstring\u003e\\n\\n// The component interface every wrapper and the real destination share.\\nclass Writer {\\n public:\\n  virtual ~Writer() = default;\\n  virtual void write(const std::string\u0026 text) = 0;\\n  // Pushes buffered data towards the real destination.\\n  virtual void flush() = 0;\\n};\\n\\n// The real destination for tests and demos: remembers what it received.\\nclass MemoryWriter final : public Writer {\\n public:\\n  void write(const std::string\u0026 text) override {\\n    text_ += text;\\n    ++writes_;\\n  }\\n  void flush() override { ++flushes_; }\\n  const std::string\u0026 text() const { return text_; }\\n  std::size_t writes() const { return writes_; }\\n  std::size_t flushes() const { return flushes_; }\\n\\n private:\\n  std::string text_;\\n  std::size_t writes_ = 0;\\n  std::size_t flushes_ = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n#include \u003cutility\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: write UpperWriter, TruncateWriter, BracketWriter and CountingWriter.\\n// Each one is a Writer that owns another Writer (unique_ptr), adds one behaviour, and forwards flush().\\n// Tip: a small shared base class can own the wrapped writer and forward flush once.\\nclass UpperWriter : public Writer {\\n public:\\n  explicit UpperWriter(std::unique_ptr\u003cWriter\u003e next) : next_(std::move(next)) {}\\n  void write(const std::string\u0026) override {}\\n  void flush() override {}\\n\\n private:\\n  std::unique_ptr\u003cWriter\u003e next_;\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$48\"}],\"hints\":[\"Each wrapper is a `Writer` that holds another `Writer`. Put the shared part (owning the wrapped writer, forwarding `flush`) in one small base class so every decorator only adds its single behaviour in `write`.\",\"Hold the inner writer in a `std::unique_ptr\u003cWriter\u003e`: destroying the outermost wrapper then destroys the chain exactly once, with no manual `delete`. Never `release()` it into a raw pointer.\",\"Decorators must forward the *whole* interface, not just `write`: a wrapper that forgets `flush` silently strands buffered data. Do not special-case empty text, and let `CountingWriter` count what it receives, before downstream wrappers change it.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":8},{\"id\":\"facade-checkout\",\"title\":\"Facade: one checkout call over four subsystems\",\"prompt\":\"$49\",\"api\":\"$4a\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: implement the Checkout facade. place() validates, reserves stock, charges, and only then ships and\\n// emails. If the charge is declined, give the reservation back. Keep references to the subsystems.\\nclass Checkout {\\n public:\\n  Checkout(Inventory\u0026 inventory, Payments\u0026 payments, Shipping\u0026 shipping, Mailer\u0026 mailer)\\n      : inventory_(inventory), payments_(payments), shipping_(shipping), mailer_(mailer) {}\\n\\n  CheckoutResult place(const Order\u0026) { return CheckoutResult{}; }\\n\\n private:\\n  Inventory\u0026 inventory_;\\n  Payments\u0026 payments_;\\n  Shipping\u0026 shipping_;\\n  Mailer\u0026 mailer_;\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$4b\"}],\"hints\":[\"Write one method that is the whole script: validate, reserve, charge, ship, email. Each subsystem call is one line; the facade's value is the order and the failure handling, not new logic.\",\"The order protects the customer and the stock: reserve before charging (so nobody pays for goods you cannot supply) and charge before shipping. If the charge is declined, undo the reservation with `release`, and do not email.\",\"Validate first, before any subsystem is touched, and compute the total as `quantity * unitCents` in `long long`. Store the subsystems as references: the facade neither owns nor copies them, and they remain usable on their own.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":7},{\"id\":\"flyweight-glyphs\",\"title\":\"Flyweight: share the immutable part, keep the position outside\",\"prompt\":\"$4c\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n#include \u003cutility\u003e\\n\\n// Intrinsic state only: what a glyph *is*. It never knows where it is drawn, so one object can be shared.\\nclass Glyph {\\n public:\\n  Glyph(char ch, std::string font, int size) : ch_(ch), font_(std::move(font)), size_(size) { ++constructed(); }\\n  char ch() const { return ch_; }\\n  const std::string\u0026 font() const { return font_; }\\n  int size() const { return size_; }\\n  // Horizontal space the glyph takes, in whole pixels (60% of the size, rounded down).\\n  int advance() const { return size_ * 6 / 10; }\\n\\n  // How many Glyph objects have ever been built. Tests use it to prove that sharing really happens.\\n  static int\u0026 constructed() {\\n    static int count = 0;\\n    return count;\\n  }\\n\\n private:\\n  char ch_;\\n  std::string font_;\\n  int size_;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"$4d\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$4e\"}],\"hints\":[\"Split the state first. What makes a glyph a glyph (character, font, size) is intrinsic and shareable. Where it sits on the line is extrinsic: it changes per use, so it must live in the line, not in the glyph.\",\"Keep a `std::map` in the factory keyed by `std::tuple\u003cchar, std::string, int\u003e`: look the key up, build the glyph only on a miss, and return the stored `shared_ptr\u003cconst Glyph\u003e`. Every part of the key must be in the tuple.\",\"In `TextLine`, track a running x: each placed glyph gets the current x, then x grows by that glyph's advance. `width()` is that final x. Do not sum over distinct glyphs: a shared glyph is still drawn at every place it appears.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":9},{\"id\":\"proxy-cache\",\"title\":\"Proxy: a caching proxy and a lazy proxy behind the same interface\",\"prompt\":\"$4f\",\"api\":\"$50\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"$51\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$52\"}],\"hints\":[\"Both proxies implement `Store`, so a client cannot tell them from the real one. Put the control logic (cache lookup, lazy creation) in the proxy and forward everything else untouched.\",\"For `CachingStore::get`: look in the map first; on a miss call the real store and only then insert. If the real store answers `std::nullopt`, return it without inserting: a miss must not be remembered. For `put`, write to the real store first, then update the cached copy so it is never stale.\",\"For `LazyStore`: keep a `std::unique_ptr\u003cStore\u003e`, null at first, and a private `real()` helper that builds it with `make_()` only when null. Every public method goes through `real()`; the constructor must not call `make_`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":11}],\"behavioural-theatre\":[{\"id\":\"strategy-ranker\",\"title\":\"Strategy: a leaderboard whose ranking rule can be swapped at runtime\",\"prompt\":\"$53\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n\\nstruct Player {\\n  std::string name;\\n  int score = 0;\\n  int games = 0;\\n};\\n\\n// A ranking policy decides which of two players is listed first.\\n// It must be a strict weak ordering: before(a, a) is false, and if before(a, b) then !before(b, a).\\n// Players for whom neither is before the other are \\\"tied\\\".\\nclass RankingPolicy {\\n public:\\n  virtual ~RankingPolicy() = default;\\n  virtual bool before(const Player\u0026 a, const Player\u0026 b) const = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003calgorithm\u003e\\n#include \u003ccstddef\u003e\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n#include \u003cutility\u003e\\n#include \u003cvector\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: higher score first.\\nclass HighestScore final : public RankingPolicy {\\n public:\\n  bool before(const Player\u0026, const Player\u0026) const override { return false; }\\n};\\n\\n// TODO: smaller name first.\\nclass Alphabetical final : public RankingPolicy {\\n public:\\n  bool before(const Player\u0026, const Player\u0026) const override { return false; }\\n};\\n\\n// TODO: hold a RankingPolicy, delegate ordering to it, keep ties in insertion order.\\nclass Leaderboard {\\n public:\\n  explicit Leaderboard(std::unique_ptr\u003cRankingPolicy\u003e) {}\\n  void add(Player) {}\\n  void setPolicy(std::unique_ptr\u003cRankingPolicy\u003e) {}\\n  std::vector\u003cstd::string\u003e top(std::size_t) const { return {}; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$54\"}],\"hints\":[\"The leaderboard should only know `RankingPolicy`. Store it in a `std::unique_ptr\u003cRankingPolicy\u003e` and never ask which concrete rule it is.\",\"`top(n)` works on a copy of the players: copy the vector, `std::stable_sort` it with a lambda that calls `policy_-\u003ebefore(a, b)`, then take the first `min(n, size)` names. `stable_sort` is what keeps tied players in insertion order.\",\"A policy's `before` must be a strict comparison (`\u003e` or `\u003c`, never `\u003e=`/`\u003c=`). Never let a null policy reach `top()`: the constructor falls back to `HighestScore`, and `setPolicy` ignores null so the old rule stays in place.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":10},{\"id\":\"observer-topic\",\"title\":\"Observer: a topic that notifies listeners without owning them\",\"prompt\":\"$55\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n\\n// Anything that wants to hear about messages implements this.\\nclass Listener {\\n public:\\n  virtual ~Listener() = default;\\n  virtual void onMessage(const std::string\u0026 message) = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003calgorithm\u003e\\n#include \u003ccstddef\u003e\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n#include \u003cvector\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: notify live listeners in subscription order without owning them, forget dead ones,\\n// ignore duplicate subscriptions and survive (un)subscribing from inside onMessage.\\nclass Topic {\\n public:\\n  void subscribe(const std::shared_ptr\u003cListener\u003e\u0026) {}\\n  void unsubscribe(const Listener\u0026) {}\\n  std::size_t publish(const std::string\u0026) { return 0; }\\n  std::size_t subscriberCount() { return 0; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$56\"}],\"hints\":[\"Store `std::weak_ptr\u003cListener\u003e`, not `shared_ptr` and not a raw pointer. A `weak_ptr` lets you ask 'is it still alive?' via `lock()` without keeping it alive.\",\"In `publish`, walk a **copy** of the subscriber list. A listener that unsubscribes or subscribes from inside `onMessage` then modifies the real list, not the one you are iterating. For each entry call `lock()` and only call the listener if you got a non-null `shared_ptr`.\",\"Prune dead entries (`expired()`) while you publish and in `subscriberCount()`. To avoid duplicates, compare `lock().get()` with the incoming pointer in `subscribe`; `unsubscribe` compares against `\u0026listener`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":10},{\"id\":\"command-undo\",\"title\":\"Command: undo and redo for a text editor\",\"prompt\":\"$57\",\"api\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cstring\u003e\\n\\n// The receiver: a plain text buffer that knows nothing about undo.\\nclass TextBuffer {\\n public:\\n  const std::string\u0026 text() const { return text_; }\\n  void append(const std::string\u0026 s) { text_ += s; }\\n  // Removes up to n characters from the end and returns the characters removed (possibly fewer than n).\\n  std::string eraseLast(std::size_t n) {\\n    const std::size_t count = n \u003c text_.size() ? n : text_.size();\\n    std::string removed = text_.substr(text_.size() - count);\\n    text_.erase(text_.size() - count);\\n    return removed;\\n  }\\n\\n private:\\n  std::string text_;\\n};\\n\\n// A request turned into an object so it can be stored, undone and redone.\\nclass Command {\\n public:\\n  virtual ~Command() = default;\\n  virtual void execute() = 0;\\n  virtual void undo() = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"$58\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$59\"}],\"hints\":[\"Two `std::vector\u003cstd::unique_ptr\u003cCommand\u003e\u003e` stacks: `done_` and `undone_`. `run` executes then pushes onto `done_` and clears `undone_`. `undo` moves the top of `done_` to `undone_` after calling its `undo()`; `redo` does the reverse with `execute()`.\",\"A command that destroys information must save it when it executes. `EraseCommand::execute` should store the string returned by `eraseLast(count)` in a member; `undo` appends that member back. Never assume `count` characters were removed.\",\"`undo()` and `redo()` check for an empty stack first and return `false` without touching the buffer. Check `std::unique_ptr` ownership: moving between stacks uses `std::move`, never a copy.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":11},{\"id\":\"state-document\",\"title\":\"State: a document workflow without a switch on its state\",\"prompt\":\"$5a\",\"api\":\"$undefined\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n#include \u003cutility\u003e\\n\\n// TODO: one class per state (draft, review, published) behind a private State interface.\\n// Document forwards each action to the current state and swaps to the state it returns.\\nclass Document {\\n public:\\n  bool edit() { return false; }\\n  bool submit() { return false; }\\n  bool approve() { return false; }\\n  bool reject() { return false; }\\n  std::string stateName() const { return \\\"draft\\\"; }\\n  int revision() const { return 0; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$5b\"}],\"hints\":[\"Define a private interface `State` with a virtual method per action. Each concrete state (`Draft`, `Review`, `Published`) answers the actions it allows and refuses the rest. `Document` holds a `std::unique_ptr\u003cState\u003e` and forwards every call.\",\"Let each handler return the *next* state (or null for 'not allowed / stay put'), so a state is never destroyed while its own method is still running: `Document` swaps `state_` only after the handler has returned.\",\"`edit()` is the only action that stays in the same state but changes data, so it needs the revision counter: let `Document` increment `revision_` when the state reports the edit as allowed.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":11},{\"id\":\"template-report\",\"title\":\"Template Method: a report skeleton with hooks\",\"prompt\":\"$5c\",\"api\":\"$undefined\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n#include \u003cvector\u003e\\n\\n// TODO: generate() is public, non-virtual and const. It calls the private virtual steps in order:\\n// heading, rows (once), footer hook.\\nclass ReportGenerator {\\n public:\\n  virtual ~ReportGenerator() = default;\\n\\n  std::string generate() const { return \\\"\\\"; }\\n\\n private:\\n  virtual std::string title() const = 0;\\n  virtual std::vector\u003cstd::string\u003e rows() const = 0;\\n  virtual std::string footer() const { return \\\"\\\"; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$5d\"}],\"hints\":[\"The base class owns the algorithm: `generate()` is public, non-virtual and const, and calls the steps in a fixed order. Subclasses supply steps; they never supply the order.\",\"Make the steps private virtuals. A derived class may override a private virtual, and callers cannot bypass `generate()`. Give `footer()` a default body (that is the hook) and leave `title()` and `rows()` pure.\",\"Call `rows()` once into a local `const std::vector\u003cstd::string\u003e lines`, then use it both for the emptiness check and the loop. Build the string as heading, rows (or the placeholder), then `out += footer();`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":6},{\"id\":\"iterator-roster\",\"title\":\"Iterator: hide the tombstones behind begin() and end()\",\"prompt\":\"$5e\",\"api\":\"$undefined\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"$5f\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$60\"}],\"hints\":[\"The iterator needs two things: a pointer to the slots (`const std::vector\u003cSlot\u003e*`) and an index. `begin()` and `end()` build one each; `end()` is index `slots_.size()`.\",\"Write one private helper, `skipDead()`: `while (index_ \u003c slots_-\u003esize() \u0026\u0026 !(*slots_)[index_].live) ++index_;`. Call it from the constructor (so `begin()` skips leading tombstones) and from `operator++` (so runs of tombstones and trailing ones are skipped).\",\"Return `const std::string\u0026` from `operator*`. Post-increment copies `*this`, calls pre-increment, and returns the copy. Add the five typedefs (`iterator_category = std::forward_iterator_tag`, `value_type`, `difference_type`, `pointer`, `reference`) so `std::count_if` and `std::distance` accept it. Keep a separate `live_` counter for `size()`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":11},{\"id\":\"chain-approval\",\"title\":\"Chain of Responsibility: expense approvals\",\"prompt\":\"$61\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n\\n// A request travelling through the chain. Amounts are in cents.\\nstruct Expense {\\n  std::string employee;\\n  long long cents;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n#include \u003cutility\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: a chain link that owns its successor. handle() answers with role() if canApprove(),\\n// otherwise forwards, otherwise returns \\\"rejected\\\".\\nclass Approver {\\n public:\\n  virtual ~Approver() = default;\\n\\n  Approver\u0026 then(std::unique_ptr\u003cApprover\u003e next) {\\n    next_ = std::move(next);\\n    return *this;\\n  }\\n\\n  std::string handle(const Expense\u0026) const { return \\\"\\\"; }\\n\\n protected:\\n  virtual bool canApprove(const Expense\u0026 expense) const = 0;\\n  virtual std::string role() const = 0;\\n\\n private:\\n  std::unique_ptr\u003cApprover\u003e next_;\\n};\\n\\n// TODO: approve when 0 \u003c cents \u003c= limitCents.\\nclass LimitApprover final : public Approver {\\n public:\\n  LimitApprover(std::string role, long long limitCents) : role_(std::move(role)), limitCents_(limitCents) {}\\n\\n protected:\\n  bool canApprove(const Expense\u0026) const override { return false; }\\n  std::string role() const override { return role_; }\\n\\n private:\\n  std::string role_;\\n  long long limitCents_;\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$62\"}],\"hints\":[\"Each link holds `std::unique_ptr\u003cApprover\u003e next_`. `handle` asks this link first (`canApprove`), and only if it cannot does it call `next_-\u003ehandle(...)`.\",\"`then` moves the pointer into `next_` and returns `*next_`, not `*this`; that is what lets `a-\u003ethen(b).then(c)` append c to b instead of replacing b. Remember to guard `next_` against null before forwarding.\",\"`handle`: `if (canApprove(e)) return role(); if (next_) return next_-\u003ehandle(e); return \\\"rejected\\\";`. `LimitApprover::canApprove` is `e.cents \u003e 0 \u0026\u0026 e.cents \u003c= limitCents_`. Keep `canApprove` and `role` protected: callers go through `handle`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":10},{\"id\":\"mediator-lobby\",\"title\":\"Mediator: a game lobby that owns the rules\",\"prompt\":\"$63\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n\\n// Anything that can receive messages from the lobby (a game client, a bot, a test spy).\\n// Participants never talk to each other directly; they only know the Lobby.\\nclass Participant {\\n public:\\n  virtual ~Participant() = default;\\n  virtual void notify(const std::string\u0026 message) = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n#include \u003cvector\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: the mediator. Keep each player's name, a non-owning Participant* and a ready flag.\\n// say() fans out to everyone but the sender; the start rule (\u003e= 2 players, all ready, once)\\n// is checked after setReady() and after leave().\\nclass Lobby {\\n public:\\n  bool join(const std::string\u0026, Participant\u0026) { return false; }\\n  void leave(const std::string\u0026) {}\\n  void setReady(const std::string\u0026, bool) {}\\n  void say(const std::string\u0026, const std::string\u0026) {}\\n  bool matchStarted() const { return false; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$64\"}],\"hints\":[\"Store `struct Member { std::string name; Participant* participant; bool ready; }` in a `std::vector`. A private `find(name)` returns an iterator so `join`, `leave`, `setReady` and `say` all share one lookup.\",\"Write one private `startIfEveryoneIsReady()`: return early if `started_` or fewer than two members; if `std::all_of` members are ready, set `started_` and notify each member in order. Call it from `setReady` **and** from `leave`.\",\"`say` first checks the sender exists, then loops over the members and skips the one whose name equals `from`. `join` returns `false` when `find` already finds the name. Erase the member in `leave` before re-checking the start rule so the departed player is not notified.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":11},{\"id\":\"memento-editor\",\"title\":\"Memento: undo without exposing the editor\",\"prompt\":\"$65\",\"api\":\"$undefined\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cstring\u003e\\n#include \u003cutility\u003e\\n#include \u003cvector\u003e\\n\\n// TODO: Snapshot must hold text AND cursor, be creatable only by Editor (private constructor + friend),\\n// and expose no getters. History is the caretaker: a stack of snapshots, newest restored first.\\nclass Editor {\\n public:\\n  class Snapshot {\\n   private:\\n    friend class Editor;\\n    Snapshot() = default;\\n  };\\n\\n  void type(const std::string\u0026) {}\\n  void moveCursor(std::size_t) {}\\n  const std::string\u0026 text() const { return text_; }\\n  std::size_t cursor() const { return cursor_; }\\n\\n  Snapshot save() const { return Snapshot(); }\\n  void restore(const Snapshot\u0026) {}\\n\\n private:\\n  std::string text_;\\n  std::size_t cursor_ = 0;\\n};\\n\\nclass History {\\n public:\\n  void push(Editor::Snapshot) {}\\n  bool undo(Editor\u0026) { return false; }\\n  std::size_t size() const { return 0; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$66\"}],\"hints\":[\"The Snapshot must hold copies of the text and the cursor, and only `Editor` may build one: make the constructor private and declare `friend class Editor;` inside Snapshot.\",\"`save()` returns `Snapshot(text_, cursor_)` by value; `restore(s)` assigns `text_ = s.text_; cursor_ = s.cursor_;` (legal because Editor is a friend). History is just a `std::vector\u003cEditor::Snapshot\u003e` used as a stack.\",\"`type`: `text_.insert(cursor_, s); cursor_ += s.size();`. `moveCursor`: `cursor_ = std::min(pos, text_.size());`. `undo`: if empty return false; restore `stack_.back()`, `pop_back()`, return true. Do not give Snapshot a default constructor or any public getter.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":9},{\"id\":\"visitor-basket\",\"title\":\"Visitor: totals and receipts over a basket\",\"prompt\":\"$67\",\"api\":\"$undefined\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"$68\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$69\"}],\"hints\":[\"Forward-declare `Goods`, `Service`, `Voucher`, then declare `ItemVisitor` with three `visit` overloads taking `const` references. Each item's `accept` is the one line `visitor.visit(*this);`: the call happens inside the concrete class, which is how the compiler picks the right overload.\",\"`Basket` keeps a `std::vector\u003cstd::unique_ptr\u003cItem\u003e\u003e`; `add` ignores a null pointer; `accept` loops in order and calls `item-\u003eaccept(visitor)`. `TotalVisitor` is an `ItemVisitor` with a running `long long total_`.\",\"Goods add `quantity() * unitCents()`, services add `hours() * rateCents()`, vouchers subtract `cents()`. Put none of this in the item classes: the whole point is that a receipt printer can be added later without editing them.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":8},{\"id\":\"interpreter-calc\",\"title\":\"Interpreter: a calculator as a tree of rules\",\"prompt\":\"$6a\",\"api\":\"$undefined\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"$6b\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$6c\"}],\"hints\":[\"One class per rule, all deriving from `Expr`. `Num` and `Var` are leaves; the four operators are nodes owning two `ExprPtr` children. A shared `BinaryExpr` base can hold the children and the evaluate-both-sides logic so each operator only supplies how to combine two numbers.\",\"Evaluate both children first. If either is `nullopt`, return `nullopt`; do not use `value_or(0)`, because that turns a missing variable into a wrong answer. `Var::eval` is just `context.lookup(name_)`, and it must not cache, because the same tree is evaluated under several contexts.\",\"`divide` returns `nullopt` when the right value is 0 and `l / r` otherwise. `show()` is `\\\"(\\\" + left-\u003eshow() + \\\" \\\" + symbol + \\\" \\\" + right-\u003eshow() + \\\")\\\"`. The factory functions `num`, `var`, `add`, `sub`, `mul`, `divide` just `make_unique` the right node.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":10}],\"concurrency-docks\":[{\"id\":\"locked-stats\",\"title\":\"Guarded statistics: RAII locking you can test without threads\",\"prompt\":\"$6d\",\"api\":\"#pragma once\\n#include \u003cmutex\u003e\\n\\n// The seam between your class and the operating system's lock.\\n// Production code passes a `StdLock`; the tests pass a spy that records every call.\\n// It satisfies the standard Lockable requirements, so `std::lock_guard\u003cLock\u003e` and\\n// `std::unique_lock\u003cLock\u003e` work on it directly.\\nclass Lock {\\n public:\\n  virtual ~Lock() = default;\\n  virtual void lock() = 0;\\n  virtual void unlock() = 0;\\n  virtual bool try_lock() = 0;\\n};\\n\\nclass StdLock final : public Lock {\\n public:\\n  void lock() override { m_.lock(); }\\n  void unlock() override { m_.unlock(); }\\n  bool try_lock() override { return m_.try_lock(); }\\n\\n private:\\n  std::mutex m_;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cvector\u003e\\n#include \\\"api.h\\\"\\n\\nstruct Stats {\\n  long long count = 0;\\n  long long sum = 0;\\n  int max = 0;\\n};\\n\\n// TODO: guard every access to the three numbers with `lock_`, using an RAII guard.\\n// record() rejects negative values without leaving the lock held; recordAll() takes the lock once.\\nclass SafeStats {\\n public:\\n  explicit SafeStats(Lock\u0026 lock) : lock_(lock) {}\\n  bool record(int) { return false; }\\n  std::size_t recordAll(const std::vector\u003cint\u003e\u0026) { return 0; }\\n  Stats snapshot() const { return Stats(); }\\n  void reset() {}\\n\\n private:\\n  Lock\u0026 lock_;\\n  Stats stats_;\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$6e\"}],\"hints\":[\"Three numbers must change together, so the lock must cover all three. Which methods read them? Which write them? All of them need the lock.\",\"Declare a `std::lock_guard\u003cLock\u003e guard(lock_);` at the top of the critical section. Its destructor unlocks on every path, including an early `return`, so you never write `unlock()` yourself.\",\"`recordAll` takes the lock once, then loops calling a private helper that assumes the lock is already held (calling the public `record` would try to lock again). Reject negatives in `record` before locking, or inside the guarded scope, but never between a manual `lock()` and `unlock()`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":11},{\"id\":\"ordered-transfer\",\"title\":\"Transfer between accounts without deadlock: lock ordering\",\"prompt\":\"$6f\",\"api\":\"#pragma once\\n#include \u003cmutex\u003e\\n\\n// The seam between your code and the operating system's lock (production passes a std::mutex wrapper;\\n// the tests pass a spy that records the order locks are taken). Works with std::lock_guard / std::scoped_lock.\\nclass Lock {\\n public:\\n  virtual ~Lock() = default;\\n  virtual void lock() = 0;\\n  virtual void unlock() = 0;\\n  virtual bool try_lock() = 0;\\n};\\n\\n// An account is identified by a unique, never-changing id and guarded by its own lock.\\nstruct Account {\\n  Account(int accountId, long long openingBalance, Lock\u0026 accountLock) : id(accountId), balance(openingBalance), lock(accountLock) {}\\n  const int id;\\n  long long balance;  // guarded by `lock`\\n  Lock\u0026 lock;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cmutex\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: lock the two accounts in ascending id order (never twice for the same account),\\n// check the amount and the funds while holding both, and release both on every path.\\ninline bool transfer(Account\u0026 from, Account\u0026 to, long long amount) {\\n  (void)from;\\n  (void)to;\\n  (void)amount;\\n  return false;\\n}\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$70\"}],\"hints\":[\"Deadlock needs a cycle: A waits for B while B waits for A. If every thread takes the locks in the same order, no cycle can form. Pick an order that does not depend on which way the money flows.\",\"Compare the two ids. Name the account with the smaller id `first` and the other `second`, then lock `first` before `second`, whichever is `from` and whichever is `to`. Do the amount check *after* locking.\",\"Handle `amount \u003c= 0` and `\u0026from == \u0026to` before locking anything (a non-recursive lock taken twice by the same thread deadlocks against itself). Use two `std::lock_guard\u003cLock\u003e` so every return path unlocks both.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":12},{\"id\":\"blocking-queue\",\"title\":\"Bounded blocking queue: wait in a loop, notify the right side\",\"prompt\":\"$71\",\"api\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cmutex\u003e\\n\\n// The seam between your code and the operating system's lock (production wraps a std::mutex; the tests pass a spy).\\n// It satisfies the standard Lockable requirements, so std::lock_guard\u003cLock\u003e works on it directly.\\nclass Lock {\\n public:\\n  virtual ~Lock() = default;\\n  virtual void lock() = 0;\\n  virtual void unlock() = 0;\\n  virtual bool try_lock() = 0;\\n};\\n\\n// The seam for a condition variable. wait() atomically releases `lock`, sleeps, and takes `lock` again before\\n// it returns. It may return spuriously (nothing changed), so callers must re-check their predicate.\\nclass Condition {\\n public:\\n  virtual ~Condition() = default;\\n  virtual void wait(Lock\u0026 lock) = 0;\\n  virtual void notifyOne() = 0;\\n  virtual void notifyAll() = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cmutex\u003e\\n#include \u003cvector\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: guard the state with the lock, make push wait while full and pop wait while empty\\n// (each in a loop on its predicate, on the right condition), and wake the other side after a change.\\nclass BoundedQueue {\\n public:\\n  BoundedQueue(std::size_t capacity, Lock\u0026 lock, Condition\u0026 notFull, Condition\u0026 notEmpty)\\n      : slots_(capacity), lock_(lock), notFull_(notFull), notEmpty_(notEmpty) {}\\n\\n  void push(int value) { (void)value; }\\n  int pop() { return 0; }\\n  std::size_t size() const { return 0; }\\n\\n private:\\n  std::vector\u003cint\u003e slots_;\\n  Lock\u0026 lock_;\\n  Condition\u0026 notFull_;\\n  Condition\u0026 notEmpty_;\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$72\"}],\"hints\":[\"The queue needs a lock for every method and two waiting rooms: producers wait for space, consumers wait for items. Which condition does `push` sleep on? Which one does it wake after storing?\",\"Take `std::lock_guard\u003cLock\u003e guard(lock_);`, then `while (count_ == capacity) notFull_.wait(lock_);`. The loop matters: after a wake-up the queue may be full again, and a spurious wake-up changes nothing.\",\"Store in a ring buffer: `slots_[(head_ + count_) % size] = v; ++count_;` and read `slots_[head_]`, then `head_ = (head_ + 1) % size; --count_;`. End `push` with `notEmpty_.notifyOne()` and `pop` with `notFull_.notifyOne()`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":8},{\"id\":\"lazy-once\",\"title\":\"Lazy initialisation under contention: double-checked locking\",\"prompt\":\"$73\",\"api\":\"#pragma once\\n#include \u003catomic\u003e\\n#include \u003cmutex\u003e\\n\\n// The seam between your code and the operating system's lock (production wraps a std::mutex; the tests pass a spy).\\n// It satisfies the standard Lockable requirements, so std::lock_guard\u003cLock\u003e works on it directly.\\nclass Lock {\\n public:\\n  virtual ~Lock() = default;\\n  virtual void lock() = 0;\\n  virtual void unlock() = 0;\\n  virtual bool try_lock() = 0;\\n};\\n\\n// Something slow and fallible, such as reading a config file. Returns false (and leaves `out` alone) on failure.\\nclass Loader {\\n public:\\n  virtual ~Loader() = default;\\n  virtual bool load(int\u0026 out) = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003catomic\u003e\\n#include \u003cmutex\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: check `ready_` without the lock, then take the lock and check again before loading.\\n// A failed load must not set `ready_`. Set it (release) only after `value_` is written.\\nclass LazyValue {\\n public:\\n  LazyValue(Lock\u0026 lock, Loader\u0026 loader) : lock_(lock), loader_(loader) {}\\n\\n  bool get(int\u0026 out) {\\n    (void)out;\\n    return false;\\n  }\\n\\n private:\\n  Lock\u0026 lock_;\\n  Loader\u0026 loader_;\\n  int value_ = 0;\\n  std::atomic\u003cbool\u003e ready_{false};\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$74\"}],\"hints\":[\"Two checks, one lock. First check an atomic flag with no lock (the fast path). Only if it is not set, take the lock and check again, because someone else may have finished while you waited.\",\"Inside the lock: if the flag is still false, call `loader_.load(loaded)` ue is empty.\\nclass TaskQueue {\\n public:\\n  TaskQueue(Lock\u0026 lock, Condition\u0026 wakeup) : lock_(lock), wakeup_(wakeup) {}\\n\\n  bool submit(Task task) {\\n    (void)task;\\n    return false;\\n  }\\n  void shutdown() {}\\n  void runWorker() {}\\n\\n private:\\n  Lock\u0026 lock_;\\n  Condition\u0026 wakeup_;\\n  std::queue\u003cTask\u003e tasks_;\\n  bool stopping_ = false;\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$76\"}],\"hints\":[\"Two flags decide when a worker may stop: the queue is empty AND shutdown was requested. A worker sleeps while the queue is empty and shutdown has not been requested.\",\"In `runWorker`: loop forever; inside a braced scope take `std::lock_guard\u003cLock\u003e`, `while (tasks_.empty() \u0026\u0026 !stopping_) wakeup_.wait(lock_);`, return if `tasks_.empty()`, otherwise move the front task into a local and pop. After the closing brace the lock is released: call the task there.\",\"`submit`: lock, return false if `stopping_`, push, `wakeup_.notifyOne()`, return true. `shutdown`: lock, set `stopping_ = true`, then `wakeup_.notifyAll()` so every sleeping worker re-checks and exits.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":10}]}}]\n"])</script></body></html>
