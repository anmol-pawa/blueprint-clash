e]` using each child's `describe()`, e.g. `panel(form)[label(Name),badge(new)]`; with no children `panel(form)[]`. `setText` changes the title.\n- `Palette`: a registry of prototypes. `bool add(const std::string\u0026 name, const Widget\u0026 prototype)` stores a **private copy** and returns `true`; it returns `false` and changes nothing for an empty or duplicate name. `std::unique_ptr\u003cWidget\u003e spawn(const std::string\u0026 name) const` returns a new independent copy, or `nullptr` for an unknown name.\n\n`clone()` must return an object of the **same dynamic type** (a cloned `Badge` is still a `Badge`) and a **deep** copy: editing a clone, or any child of a cloned panel, must never change the original, and the other way round. For `Label::setText` replace its text.\n39:T5e6,#pragma once\n#include \u003ccstddef\u003e\n#include \u003cmap\u003e\n#include \u003cmemory\u003e\n#include \u003cstring\u003e\n#include \u003cutility\u003e\n#include \u003cvector\u003e\n#include \"api.h\"\n\n// TODO: implement Label, Badge, Panel and Palette. Every concrete widget overrides clone() and\n// returns a deep copy of the SAME dynamic type.\nclass Label : public Widget {\n public:\n  explicit Label(std::string text) : text_(std::move(text)) {}\n  std::unique_ptr\u003cWidget\u003e clone() const override { return nullptr; }\n  std::string describe() const override { return \"\"; }\n  void setText(const std::string\u0026 text) override { text_ = text; }\n\n protected:\n  std::string text_;\n};\n\nclass Badge : public Label {\n public:\n  explicit Badge(std::string text) : Label(std::move(text)) {}\n};\n\nclass Panel : public Widget {\n public:\n  explicit Panel(std::string title) : title_(std::move(title)) {}\n  Panel\u0026 add(std::unique_ptr\u003cWidget\u003e child) {\n    (void)child;\n    return *this;\n  }\n  std::size_t size() const { return 0; }\n  Widget* child(std::size_t i) const {\n    (void)i;\n    return nullptr;\n  }\n  std::unique_ptr\u003cWidget\u003e clone() const override { return nullptr; }\n  std::string describe() const override { return \"\"; }\n  void setText(const std::string\u0026 text) override { title_ = text; }\n\n private:\n  std::string title_;\n};\n\nclass Palette {\n public:\n  bool add(const std::string\u0026 name, const Widget\u0026 prototype) {\n    (void)name;\n    (void)prototype;\n    return false;\n  }\n  std::unique_ptr\u003cWidget\u003e spawn(const std::string\u0026 name) const {\n    (void)name;\n    return nullptr;\n  }\n};\n3a:Te95,#include \u003cmemory\u003e\n#include \u003cstring\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nTEST(Describe, WidgetsDescribeThemselves) {\n  EXPECT_EQ(Label(\"Name\").describe(), std::string(\"label(Name)\"));\n  EXPECT_EQ(Badge(\"new\").describe(), std::string(\"badge(new)\"));\n  Panel p(\"form\");\n  EXPECT_EQ(p.describe(), std::string(\"panel(form)[]\"));\n  p.add(std::make_unique\u003cLabel\u003e(\"Name\")).add(std::make_unique\u003cBadge\u003e(\"new\"));\n  EXPECT_EQ(p.describe(), std::string(\"panel(form)[label(Name),badge(new)]\"));\n  EXPECT_EQ(p.size(), static_cast\u003cstd::size_t\u003e(2));\n  EXPECT_TRUE(p.child(2) == nullptr);\n}\n\nTEST(Clone, KeepsTheDynamicType) {\n  const Badge b(\"new\");\n  const std::unique_ptr\u003cWidget\u003e c = b.clone();\n  ASSERT_TRUE(c != nullptr);\n  EXPECT_EQ(c-\u003edescribe(), std::string(\"badge(new)\"));\n  const Label l(\"hi\");\n  EXPECT_EQ(l.clone()-\u003edescribe(), std::string(\"label(hi)\"));\n}\n\nTEST(Clone, ThroughTheBaseInterface) {\n  std::unique_ptr\u003cWidget\u003e w = std::make_unique\u003cBadge\u003e(\"beta\");\n  std::unique_ptr\u003cWidget\u003e copy = w-\u003eclone();\n  EXPECT_TRUE(copy.get() != w.get());\n  EXPECT_EQ(copy-\u003edescribe(), std::string(\"badge(beta)\"));\n}\n\nTEST(Clone, EditingACopyLeavesTheOriginalAlone) {\n  Label original(\"a\");\n  auto copy = original.clone();\n  copy-\u003esetText(\"b\");\n  EXPECT_EQ(original.describe(), std::string(\"label(a)\"));\n  EXPECT_EQ(copy-\u003edescribe(), std::string(\"label(b)\"));\n  original.setText(\"c\");\n  EXPECT_EQ(copy-\u003edescribe(), std::string(\"label(b)\"));\n}\n\nTEST(Clone, PanelCopiesAreDeep) {\n  Panel original(\"form\");\n  original.add(std::make_unique\u003cLabel\u003e(\"Name\")).add(std::make_unique\u003cBadge\u003e(\"new\"));\n  auto copy = original.clone();\n  ASSERT_TRUE(copy != nullptr);\n  EXPECT_EQ(copy-\u003edescribe(), original.describe());\n  auto\u0026 copyPanel = static_cast\u003cPanel\u0026\u003e(*copy);\n  ASSERT_TRUE(copyPanel.child(0) != nullptr);\n  copyPanel.child(0)-\u003esetText(\"Email\");\n  copy-\u003esetText(\"signup\");\n  EXPECT_EQ(original.describe(), std::string(\"panel(form)[label(Name),badge(new)]\"));\n  EXPECT_EQ(copy-\u003edescribe(), std::string(\"panel(signup)[label(Email),badge(new)]\"));\n  EXPECT_TRUE(copyPanel.child(0) != original.child(0));\n  original.child(1)-\u003esetText(\"old\");\n  EXPECT_EQ(copy-\u003edescribe(), std::string(\"panel(signup)[label(Email),badge(new)]\"));\n}\n\nTEST(Clone, NestedPanelsAreDeep) {\n  Panel outer(\"outer\");\n  auto inner = std::make_unique\u003cPanel\u003e(\"inner\");\n  inner-\u003eadd(std::make_unique\u003cBadge\u003e(\"x\"));\n  outer.add(std::move(inner));\n  auto copy = outer.clone();\n  static_cast\u003cPanel*\u003e(static_cast\u003cPanel\u0026\u003e(*copy).child(0))-\u003echild(0)-\u003esetText(\"y\");\n  EXPECT_EQ(outer.describe(), std::string(\"panel(outer)[panel(inner)[badge(x)]]\"));\n  EXPECT_EQ(copy-\u003edescribe(), std::string(\"panel(outer)[panel(inner)[badge(y)]]\"));\n}\n\nTEST(Palette, SpawnsIndependentCopies) {\n  Panel proto(\"card\");\n  proto.add(std::make_unique\u003cBadge\u003e(\"hot\"));\n  Palette palette;\n  EXPECT_TRUE(palette.add(\"card\", proto));\n  auto a = palette.spawn(\"card\");\n  auto b = palette.spawn(\"card\");\n  ASSERT_TRUE(a != nullptr \u0026\u0026 b != nullptr);\n  EXPECT_TRUE(a.get() != b.get());\n  a-\u003esetText(\"changed\");\n  EXPECT_EQ(b-\u003edescribe(), std::string(\"panel(card)[badge(hot)]\"));\n  EXPECT_EQ(palette.spawn(\"card\")-\u003edescribe(), std::string(\"panel(card)[badge(hot)]\"));\n}\n\nTEST(Palette, KeepsItsOwnSnapshot) {\n  Label source(\"v1\");\n  Palette palette;\n  EXPECT_TRUE(palette.add(\"title\", source));\n  source.setText(\"v2\");\n  EXPECT_EQ(palette.spawn(\"title\")-\u003edescribe(), std::string(\"label(v1)\"));\n}\n\nTEST(Palette, RejectsBadNamesAndUnknownSpawn) {\n  Label a(\"a\");\n  Label b(\"b\");\n  Palette palette;\n  EXPECT_FALSE(palette.add(\"\", a));\n  EXPECT_TRUE(palette.add(\"x\", a));\n  EXPECT_FALSE(palette.add(\"x\", b));\n  EXPECT_EQ(palette.spawn(\"x\")-\u003edescribe(), std::string(\"label(a)\"));\n  EXPECT_TRUE(palette.spawn(\"nope\") == nullptr);\n}\n3b:T44e,An order service needs unique, increasing order numbers. Today it reaches for a global counter, so nothing can test it with known numbers and nothing stops two counters from existing. Do both halves in `solution.h`; `api.h` gives the `IdSource` interface.\n\n**1. `IdGenerator`**: the one real counter, as a *Meyers singleton* implementing `IdSource`.\n- `static IdGenerator\u0026 instance()`: always the same object (a function-local `static`, so construction is thread-safe).\n- `long next() override`: returns 1, 2, 3, ... across **all** callers of `instance()`.\n- Nobody else can create one: private constructor, and no copy or move (a stray `auto g = IdGenerator::instance();` must not compile).\n\n**2. `OrderService`**: takes an `IdSource\u0026` in its constructor and never names `IdGenerator`. `std::string place(const std::string\u0026 item)` returns `\"ORD-\u003cid\u003e:\u003citem\u003e\"`, for example `\"ORD-7:tea\"`.\n\nThe tests build `OrderService` with a fake `IdSource` that returns known numbers, and with the real singleton. The singleton exists once, at the edge; the logic that needs numbers does not know it is a singleton.\n3c:T79f,#include \u003cstring\u003e\n#include \u003ctype_traits\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\nstruct FakeIds : IdSource {  // known numbers, no singleton involved\n  long value;\n  explicit FakeIds(long start) : value(start) {}\n  long next() override { return value++; }\n};\n}  // namespace\n\nTEST(Singleton, SameObjectEveryTime) {\n  IdGenerator\u0026 a = IdGenerator::instance();\n  IdGenerator\u0026 b = IdGenerator::instance();\n  EXPECT_TRUE(\u0026a == \u0026b);\n}\n\nTEST(Singleton, CountsAcrossAllCallers) {\n  IdGenerator\u0026 a = IdGenerator::instance();\n  IdGenerator\u0026 b = IdGenerator::instance();\n  const long first = a.next();\n  EXPECT_EQ(b.next(), first + 1);\n  EXPECT_EQ(IdGenerator::instance().next(), first + 2);\n}\n\nTEST(Singleton, CannotBeCopiedOrCreated) {\n  EXPECT_FALSE(std::is_copy_constructible\u003cIdGenerator\u003e::value);\n  EXPECT_FALSE(std::is_copy_assignable\u003cIdGenerator\u003e::value);\n  EXPECT_FALSE(std::is_move_constructible\u003cIdGenerator\u003e::value);\n  EXPECT_FALSE(std::is_move_assignable\u003cIdGenerator\u003e::value);\n  EXPECT_FALSE(std::is_default_constructible\u003cIdGenerator\u003e::value);\n}\n\nTEST(OrderService, UsesTheInjectedSource) {\n  FakeIds ids(100);\n  OrderService service(ids);\n  EXPECT_EQ(service.place(\"tea\"), std::string(\"ORD-100:tea\"));\n  EXPECT_EQ(service.place(\"cake\"), std::string(\"ORD-101:cake\"));\n  EXPECT_EQ(ids.value, 102L);\n}\n\nTEST(OrderService, TwoServicesShareOneSourceWhenGivenOne) {\n  FakeIds ids(1);\n  OrderService a(ids);\n  OrderService b(ids);\n  EXPECT_EQ(a.place(\"x\"), std::string(\"ORD-1:x\"));\n  EXPECT_EQ(b.place(\"y\"), std::string(\"ORD-2:y\"));\n}\n\nTEST(OrderService, WorksWithTheRealSingleton) {\n  OrderService service(IdGenerator::instance());\n  const std::string first = service.place(\"a\");\n  const std::string second = service.place(\"b\");\n  EXPECT_TRUE(first.rfind(\"ORD-\", 0) == 0);\n  EXPECT_TRUE(first.size() \u003e 6 \u0026\u0026 first.substr(first.size() - 2) == \":a\");\n  EXPECT_TRUE(second.substr(second.size() - 2) == \":b\");\n  EXPECT_TRUE(first != second);\n}\n3d:T4bb,A server builds a response in a scratch `Buffer` (`api.h`: an alias for `std::string`) for every request, and allocating a big one each time is slow. Write `BufferPool` in `solution.h`: it owns a fixed number of buffers and **leases** them out.\n\n- `explicit BufferPool(std::size_t capacity)` creates `capacity` buffers up front. `capacity()` and `available()` (idle buffers right now) report counts.\n- `Lease acquire()` hands out an idle buffer. When none is idle it returns an **empty** lease (`explicit operator bool` is `false`); it never allocates a new one and never throws.\n- `BufferPool::Lease` is the RAII handle: `*lease` / `lease-\u003e` reach the buffer. It is **move-only**. When a lease is destroyed, or overwritten by a move-assignment, its buffer goes back to the pool, **cleared**, so the next user never sees the previous request's data. A moved-from lease is empty and gives nothing back.\n\nPitfalls the tests probe: a returned buffer must be reset; a move must hand over ownership exactly once (no double release); move-assigning onto a live lease must first release what it held; and a pooled buffer is *reused* (same object), not recreated. The pool must outlive its leases; say so in a comment.\n3e:Td24,#include \u003cstring\u003e\n#include \u003ctype_traits\u003e\n#include \u003cutility\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nTEST(Pool, StartsFullAndExhaustsAtCapacity) {\n  BufferPool pool(2);\n  EXPECT_EQ(pool.capacity(), static_cast\u003cstd::size_t\u003e(2));\n  EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(2));\n  auto a = pool.acquire();\n  auto b = pool.acquire();\n  EXPECT_TRUE(static_cast\u003cbool\u003e(a));\n  EXPECT_TRUE(static_cast\u003cbool\u003e(b));\n  EXPECT_TRUE(\u0026*a != \u0026*b);\n  EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(0));\n}\n\nTEST(Pool, ExhaustedGivesAnEmptyLease) {\n  BufferPool pool(1);\n  auto a = pool.acquire();\n  auto b = pool.acquire();\n  EXPECT_TRUE(static_cast\u003cbool\u003e(a));\n  EXPECT_FALSE(static_cast\u003cbool\u003e(b));\n  EXPECT_EQ(pool.capacity(), static_cast\u003cstd::size_t\u003e(1));\n  EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(0));\n}\n\nTEST(Pool, LeaseReturnsOnScopeExit) {\n  BufferPool pool(2);\n  {\n    auto a = pool.acquire();\n    EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(1));\n  }\n  EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(2));\n}\n\nTEST(Pool, ReturnedBufferIsClearedAndReused) {\n  BufferPool pool(1);\n  const Buffer* first = nullptr;\n  {\n    auto a = pool.acquire();\n    ASSERT_TRUE(static_cast\u003cbool\u003e(a));\n    *a += \"secret of request 1\";\n    first = \u0026*a;\n  }\n  auto b = pool.acquire();\n  ASSERT_TRUE(static_cast\u003cbool\u003e(b));\n  EXPECT_TRUE(b-\u003eempty());\n  EXPECT_TRUE(\u0026*b == first);  // reused, not recreated\n}\n\nTEST(Pool, EmptyLeaseGivesNothingBack) {\n  BufferPool pool(1);\n  auto a = pool.acquire();\n  {\n    auto none = pool.acquire();\n    EXPECT_FALSE(static_cast\u003cbool\u003e(none));\n  }\n  EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(0));\n}\n\nTEST(Lease, IsMoveOnly) {\n  EXPECT_FALSE(std::is_copy_constructible\u003cBufferPool::Lease\u003e::value);\n  EXPECT_FALSE(std::is_copy_assignable\u003cBufferPool::Lease\u003e::value);\n  EXPECT_TRUE(std::is_move_constructible\u003cBufferPool::Lease\u003e::value);\n  EXPECT_TRUE(std::is_move_assignable\u003cBufferPool::Lease\u003e::value);\n}\n\nTEST(Lease, MoveTransfersOwnershipOnce) {\n  BufferPool pool(2);\n  {\n    auto a = pool.acquire();\n    *a = \"hello\";\n    BufferPool::Lease b = std::move(a);\n    EXPECT_FALSE(static_cast\u003cbool\u003e(a));\n    ASSERT_TRUE(static_cast\u003cbool\u003e(b));\n    EXPECT_EQ(*b, std::string(\"hello\"));\n    EXPECT_EQ(pool.available(), static_cast\u003cstd::size_t\u003e(1));\n  }\n  EXPEC );\n}\n\nTEST(Truncate, KeepsAtMostMaxChars) {\n  Sink s;\n  TruncateWriter w(std::move(s.owned), 3);\n  w.write(\"abcdef\");\n  w.write(\"xy\");\n  w.write(\"\");\n  EXPECT_EQ(s.view-\u003etext(), std::string(\"abcxy\"));\n  EXPECT_EQ(s.view-\u003ewrites(), static_cast\u003cstd::size_t\u003e(3));\n}\n\nTEST(Bracket, WrapsEmptyTextToo) {\n  Sink s;\n  BracketWriter w(std::move(s.owned));\n  w.write(\"hi\");\n  w.write(\"\");\n  EXPECT_EQ(s.view-\u003etext(), std::string(\"[hi][]\"));\n  EXPECT_EQ(s.view-\u003ewrites(), static_cast\u003cstd::size_t\u003e(2));\n}\n\nTEST(Decorator, StacksInTheOrderTheCallerChooses) {\n  Sink a;\n  BracketWriter bracketOuter(std::make_unique\u003cTruncateWriter\u003e(std::move(a.owned), 3));\n  bracketOuter.write(\"abcdef\");\n  EXPECT_EQ(a.view-\u003etext(), std::string(\"[ab\"));\n\n  Sink b;\n  TruncateWriter truncateOuter(std::make_unique\u003cBracketWriter\u003e(std::move(b.owned)), 3);\n  truncateOuter.write(\"abcdef\");\n  EXPECT_EQ(b.view-\u003etext(), std::string(\"[abc]\"));\n}\n\nTEST(Decorator, ThreeLayersCompose) {\n  Sink s;\n  UpperWriter w(std::make_unique\u003cBracketWriter\u003e(std::make_unique\u003cTruncateWriter\u003e(std::move(s.owned), 4)));\n  w.write(\"hello\");\n  EXPECT_EQ(s.view-\u003etext(), std::string(\"[HEL\"));\n}\n\nTEST(Counting, CountsWhatItReceivesNotWhatLeaves) {\n  Sink s;\n  auto counting = std::make_unique\u003cCountingWriter\u003e(std::make_unique\u003cTruncateWriter\u003e(std::move(s.owned), 2));\n  CountingWriter* raw = counting.get();\n  counting-\u003ewrite(\"abcdef\");\n  counting-\u003ewrite(\"xyz\");\n  EXPECT_EQ(raw-\u003ewrites(), static_cast\u003cstd::size_t\u003e(2));\n  EXPECT_EQ(raw-\u003echars(), static_cast\u003cstd::size_t\u003e(9));\n  EXPECT_EQ(s.view-\u003etext(), std::string(\"abxy\"));\n}\n\nTEST(Decorator, FlushReachesTheInnermostWriter) {\n  Sink s;\n  UpperWriter w(std::make_unique\u003cCountingWriter\u003e(std::make_unique\u003cBracketWriter\u003e(std::move(s.owned))));\n  w.flush();\n  w.flush();\n  EXPECT_EQ(s.view-\u003eflushes(), static_cast\u003cstd::size_t\u003e(2));\n}\n\nTEST(Decorator, OwnsAndDestroysTheWrappedWriter) {\n  g_destroyed = 0;\n  {\n    UpperWriter w(std::make_unique\u003cCountingWriter\u003e(std::make_unique\u003cProbe\u003e()));\n    EXPECT_EQ(g_destroyed, 0);\n  }\n  EXPECT_EQ(g_destroyed, 1);\n}\n49:T483,Placing an order touches four subsystems (`Inventory`, `Payments`, `Shipping`, `Mailer`) that must be called in the right order, with the right clean-up when something fails. Callers should not have to know that script. Write a **Facade** `Checkout` in `solution.h` with one entry point; `api.h` gives the subsystem interfaces, `Order` and `CheckoutResult`.\n\n- `Checkout(Inventory\u0026, Payments\u0026, Shipping\u0026, Mailer\u0026)` keeps references to the subsystems (it does not own or copy them).\n- `CheckoutResult place(const Order\u0026)`:\n  1. **Invalid** orders (empty customer or sku, `quantity \u003c= 0`, `unitCents \u003c= 0`) return `InvalidOrder` without calling any subsystem.\n  2. `reserve(sku, quantity)`; if it fails return `OutOfStock` and call nothing else.\n  3. `charge(customer, quantity * unitCents)`; if it is declined, `release(sku, quantity)` and return `PaymentDeclined` (no shipping, no email).\n  4. `schedule(customer, sku, quantity)`, then `sendConfirmation(customer, trackingId)`, then return `Ok` with the tracking id and the cents charged.\n\nThe facade only orchestrates. It adds no pricing rules and hides nothing: the subsystems stay usable on their own.\n4a:T537,#pragma once\n#include \u003cstring\u003e\n\n// Four independent subsystems. Each has its own small vocabulary and none knows about the others.\nclass Inventory {\n public:\n  virtual ~Inventory() = default;\n  // Holds stock for an order. Returns false when there is not enough.\n  virtual bool reserve(const std::string\u0026 sku, int quantity) = 0;\n  // Gives a held reservation back.\n  virtual void release(const std::string\u0026 sku, int quantity) = 0;\n};\n\nclass Payments {\n public:\n  virtual ~Payments() = default;\n  virtual bool charge(const std::string\u0026 customer, long long cents) = 0;\n};\n\nclass Shipping {\n public:\n  virtual ~Shipping() = default;\n  // Schedules a parcel and returns its tracking id.\n  virtual std::string schedule(const std::string\u0026 customer, const std::string\u0026 sku, int quantity) = 0;\n};\n\nclass Mailer {\n public:\n  virtual ~Mailer() = default;\n  virtual void sendConfirmation(const std::string\u0026 customer, const std::string\u0026 trackingId) = 0;\n};\n\nstruct Order {\n  std::string customer;\n  std::string sku;\n  int quantity = 0;\n  long long unitCents = 0;\n};\n\nenum class CheckoutStatus { Ok, InvalidOrder, OutOfStock, PaymentDeclined };\n\nstruct CheckoutResult {\n  CheckoutStatus status = CheckoutStatus::InvalidOrder;\n  std::string trackingId;   // set only when status is Ok\n  long long chargedCents = 0;  // set only when status is Ok\n};\n4b:Te47,#include \u003cstring\u003e\n#include \u003cvector\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\nusing Log = std::vector\u003cstd::string\u003e;\n\nstruct FakeInventory final : Inventory {\n  explicit FakeInventory(Log\u0026 l) : log(l) {}\n  bool reserve(const std::string\u0026 sku, int q) override {\n    log.push_back(\"reserve:\" + sku + \":\" + std::to_string(q));\n    return inStock;\n  }\n  void release(const std::string\u0026 sku, int q) override { log.push_back(\"release:\" + sku + \":\" + std::to_string(q)); }\n  Log\u0026 log;\n  bool inStock = true;\n};\nstruct FakePayments final : Payments {\n  explicit FakePayments(Log\u0026 l) : log(l) {}\n  bool charge(const std::string\u0026 c, long long cents) override {\n    log.push_back(\"charge:\" + c + \":\" + std::to_string(cents));\n    return approve;\n  }\n  Log\u0026 log;\n  bool approve = true;\n};\nstruct FakeShipping final : Shipping {\n  explicit FakeShipping(Log\u0026 l) : log(l) {}\n  std::string schedule(const std::string\u0026 c, const std::string\u0026 sku, int q) override {\n    log.push_back(\"ship:\" + c + \":\" + sku + \":\" + std::to_string(q));\n    return \"TRK-1\";\n  }\n  Log\u0026 log;\n};\nstruct FakeMailer final : Mailer {\n  explicit FakeMailer(Log\u0026 l) : log(l) {}\n  void sendConfirmation(const std::string\u0026 c, const std::string\u0026 t) override { log.push_back(\"mail:\" + c + \":\" + t); }\n  Log\u0026 log;\n};\n\nstruct Rig {\n  Log log;\n  FakeInventory inv{log};\n  FakePayments pay{log};\n  FakeShipping ship{log};\n  FakeMailer mail{log};\n  Checkout checkout{inv, pay, ship, mail};\n};\n\nOrder good() { return Order{\"ana\", \"pen\", 3, 250}; }\n}  // namespace\n\nTEST(Checkout, HappyPathRunsTheSubsystemsInOrder) {\n  Rig r;\n  const CheckoutResult res = r.checkout.place(good());\n  EXPECT_TRUE(res.status == CheckoutStatus::Ok);\n  EXPECT_EQ(res.trackingId, std::string(\"TRK-1\"));\n  EXPECT_EQ(res.chargedCents, 750LL);\n  const Log expected{\"reserve:pen:3\", \"charge:ana:750\", \"ship:ana:pen:3\", \"mail:ana:TRK-1\"};\n  EXPECT_TRUE(r.log == expected);\n}\n\nTEST(Checkout, ChargesQuantityTimesUnitPrice) {\n  Rig r;\n  const CheckoutResult res = r.checkout.place(Order{\"bo\", \"ink\", 4, 1999});\n  EXPECT_EQ(res.chargedCents, 7996LL);\n  EXPECT_EQ(r.log[1], std::string(\"charge:bo:7996\"));\n}\n\nTEST(Checkout, OutOfStockNeverChargesOrShips) {\n  Rig r;\n  r.inv.inStock = false;\n  const CheckoutResult res = r.checkout.place(good());\n  EXPECT_TRUE(res.status == CheckoutStatus::OutOfStock);\n  const Log expected{\"reserve:pen:3\"};\n  EXPECT_TRUE(r.log == expected);\n  EXPECT_EQ(res.chargedCents, 0LL);\n}\n\nTEST(Checkout, DeclinedPaymentReleasesTheReservation) {\n  Rig r;\n  r.pay.approve = false;\n  const CheckoutResult res = r.checkout.place(good());\n  EXPECT_TRUE(res.status == CheckoutStatus::PaymentDeclined);\n  const Log expected{\"reserve:pen:3\", \"charge:ana:750\", \"release:pen:3\"};\n  EXPECT_TRUE(r.log h one to the right of the previous one. A glyph's position is **extrinsic** state: it lives in the line, not in the shared glyph.\n- `length()` is the number of placed glyphs. `at(i)` returns a `Placed` with the shared `glyph` and its `x` (the first one is at `x = 0`; the next starts at the previous `x` plus the previous glyph's `advance()`). `width()` is the total width of the line: the sum of the advances of **every placed glyph**, not of the distinct ones.\n- Two lines built from the same factory share glyphs with each other too.\n\nThe flyweight must stay immutable: the factory hands out `shared_ptr\u003cconst Glyph\u003e`, so no caller can change a glyph everyone else is using.\n4d:T410,#pragma once\n#include \u003ccstddef\u003e\n#include \u003cmemory\u003e\n#include \u003cstring\u003e\n#include \u003cvector\u003e\n#include \"api.h\"\n\n// TODO: GlyphFactory::get must return the SAME shared_ptr\u003cconst Glyph\u003e for the same (ch, font, size).\n// Hint: a std::map keyed by a std::tuple\u003cchar, std::string, int\u003e is enough.\nclass GlyphFactory {\n public:\n  std::shared_ptr\u003cconst Glyph\u003e get(char ch, const std::string\u0026 font, int size) {\n    return std::make_shared\u003cconst Glyph\u003e(ch, font, size);\n  }\n  std::size_t cachedCount() const { return 0; }\n};\n\nstruct Placed {\n  std::shared_ptr\u003cconst Glyph\u003e glyph;\n  int x = 0;\n};\n\n// TODO: a line of placed glyphs. The x position is extrinsic: store it here, not in Glyph.\nclass TextLine {\n public:\n  explicit TextLine(GlyphFactory\u0026 factory) : factory_(factory) {}\n  void append(const std::string\u0026, const std::string\u0026, int) {}\n  std::size_t length() const { return 0; }\n  const Placed\u0026 at(std::size_t i) const { return placed_.at(i); }\n  int width() const { return 0; }\n\n private:\n  GlyphFactory\u0026 factory_;\n  std::vector\u003cPlaced\u003e placed_;\n};\n4e:Tcb8,#include \u003cmemory\u003e\n#include \u003cstring\u003e\n#include \u003ctype_traits\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\nint built() { return Glyph::constructed(); }\n}  // namespace\n\nTEST(Flyweight, SameKeyReturnsTheSameObject) {\n  GlyphFactory f;\n  const int before = built();\n  auto a = f.get('a', \"Mono\", 12);\n  auto b = f.get('a', \"Mono\", 12);\n  EXPECT_TRUE(a.get() == b.get());\n  EXPECT_EQ(built() - before, 1);\n  EXPECT_EQ(f.cachedCount(), static_cast\u003cstd::size_t\u003e(1));\n}\n\nTEST(Flyweight, AnyDifferenceInTheKeyGivesADifferentGlyph) {\n  GlyphFactory f;\n  auto base = f.get('a', \"Mono\", 12);\n  EXPECT_TRUE(base.get() != f.get('b', \"Mono\", 12).get());\n  EXPECT_TRUE(base.get() != f.get('a', \"Serif\", 12).get());\n  EXPECT_TRUE(base.get() != f.get('a', \"Mono\", 14).get());\n  EXPECT_EQ(f.cachedCount(), static_cast\u003cstd::size_t\u003e(4));\n  EXPECT_EQ(f.get('a', \"Serif\", 12)-\u003efont(), std::string(\"Serif\"));\n  EXPECT_EQ(f.get('a', \"Mono\", 14)-\u003esize(), 14);\n}\n\nTEST(Flyweight, TheSharedGlyphIsImmutable) {\n  GlyphFactory f;\n  static_assert(std::is_same\u003cdecltype(f.get('a', \"Mono\", 12)), std::shared_ptr\u003cconst Glyph\u003e\u003e::value,\n                \"the factory must hand out shared_ptr\u003cconst Glyph\u003e\");\n  EXPECT_EQ(f.get('z', \"Mono\", 10)-\u003ech(), 'z');\n}\n\nTEST(TextLine, LongTextBuildsOnlyTheDistinctGlyphs) {\n  GlyphFactory f;\n  TextLine line(f);\n  const int before = built();\n  std::string text;\n  for (int i = 0; i \u003c 100; ++i) text += \"hello world \";\n  line.append(text, \"Mono\", 10);\n  EXPECT_EQ(line.length(), static_cast\u003cstd::size_t\u003e(1200));\n  EXPECT_EQ(f.cachedCount(), static_cast\u003cstd::size_t\u003e(8));  // h e l o ' ' w r d\n  EXPECT_EQ(built() - before, 8);\n  EXPECT_TRUE(line.at(0).glyph.get() == line.at(12).glyph.get());\n}\n\nTEST(TextLine, PositionIsExtrinsicState) {\n  GlyphFactory f;\n  TextLine line(f);\n  line.append(\"aab\", \"Mono\", 10);  // advance 6 each\n  EXPECT_EQ(line.at(0).x, 0);\n  EXPECT_EQ(line.at(1).x, 6);\n  EXPECT_EQ(line.at(2).x, 12);\n  EXPECT_TRUE(line.at(0).glyph.get() == line.at(1).glyph.get());  // shared glyph, different positions\n}\n\nTEST(TextLine, WidthCountsEveryPlacementNotEveryDistinctGlyph) {\n  GlyphFactory f;\n  TextLine line(f);\n  line.append(\"aaaa\", \"Mono\", 10);\n  EXPECT_EQ(line.width(), 24);\n  EXPECT_EQ(f.cachedCount(), static_cast\u003cstd::size_t\u003e(1));\n}\n\nTEST(TextLine, MixedStylesKeepTheRunningPosition) {\n  GlyphFactory f;\n  TextLine line(f);\n  line.append(\"ab\", \"Mono\", 10);   // advance 6 -\u003e x 0, 6\n  line.append(\"ab\", \"Mono\", 20);   // advance 12 -\u003e x 12, 24\n  line.append(\"a\", \"Serif\", 10);   // x 36\n  EXPECT_EQ(line.at(2).x, 12);\n  EXPECT_EQ(line.at(3).x, 24);\n  EXPECT_EQ(line.at(4).x, 36);\n  EXPECT_EQ(line.width(), 42);\n  EXPECT_EQ(f.cachedCount(), static_cast\u003cstd::size_t\u003e(5));\n}\n\nTEST(TextLine, LinesFromTheSameFactoryShareGlyphs) {\n  GlyphFactory f;\n  TextLine first(f);\n  TextLine second(f);\n  first.append(\"abc\", \"Mono\", 10);\n  const int before = built();\n  second.append(\"cba\", \"Mono\", 10);\n  EXPECT_EQ(built() - before, 0);\n  EXPECT_TRUE(first.at(0).glyph.get() == second.at(2).glyph.get());\n  EXPECT_EQ(second.at(1).x, 6);\n}\n\nTEST(TextLine, EmptyTextAddsNothing) {\n  GlyphFactory f;\n  TextLine line(f);\n  line.append(\"\", \"Mono\", 10);\n  EXPECT_EQ(line.length(), static_cast\u003cstd::size_t\u003e(0));\n  EXPECT_EQ(line.width(), 0);\n}\n4f:T538,A `Store` is expensive to reach, so callers should not pay for it more than needed. A **Proxy** has the same interface as the real object and controls access to it. `api.h` gives the `Store` interface and a counting `MemoryStore`. Write two proxies in `solution.h`; both are themselves `Store`s, so clients cannot tell them apart from the real thing and they can be stacked.\n\n- `CachingStore(Store\u0026 real)`: remembers values it has read.\n  - `get(key)` returns `std::optional\u003cstd::string\u003e`: a cached key is answered without touching the real store. A miss reads the real store once and remembers the answer.\n  - `put(key, value)` writes through to the real store and must never leave a stale value behind: the next `get` of that key returns the new value.\n  - A missing key (`std::nullopt` from the real store) is returned as `std::nullopt` and **not cached**: a later `get`, after the key appears behind the proxy's back, must find it.\n- `LazyStore(std::function\u003cstd::unique_ptr\u003cStore\u003e()\u003e make)`: a virtual proxy. Nothing is created until the first `get` or `put`; the real store is then built exactly once with `make`, owned by the proxy, and every call is forwarded to it. A `LazyStore` that is never used never calls `make`.\n\nThe caching proxy holds a reference (it does not own the real store); the lazy proxy owns what it creates.\n50:T43f,#pragma once\n#include \u003ccstddef\u003e\n#include \u003cmap\u003e\n#include \u003coptional\u003e\n#include \u003cstring\u003e\n\n// The subject interface. Real stores, proxies and test fakes are all interchangeable behind it.\nclass Store {\n public:\n  virtual ~Store() = default;\n  // An empty optional means the key does not exist.\n  virtual std::optional\u003cstd::string\u003e get(const std::string\u0026 key) = 0;\n  virtual void put(const std::string\u0026 key, const std::string\u0026 value) = 0;\n};\n\n// The \"real\" store for tests and demos: pretend each access is expensive and count them.\nclass MemoryStore final : public Store {\n public:\n  std::optional\u003cstd::string\u003e get(const std::string\u0026 key) override {\n    ++reads_;\n    auto it = data_.find(key);\n    if (it == data_.end()) return std::nullopt;\n    return it-\u003esecond;\n  }\n  void put(const std::string\u0026 key, const std::string\u0026 value) override {\n    ++writes_;\n    data_[key] = value;\n  }\n  std::size_t reads() const { return reads_; }\n  std::size_t writes() const { return writes_; }\n\n private:\n  std::map\u003cstd::string, std::string\u003e data_;\n  std::size_t reads_ = 0;\n  std::size_t writes_ = 0;\n};\n51:T44c,#pragma once\n#include \u003cfunctional\u003e\n#include \u003cmap\u003e\n#include \u003cmemory\u003e\n#include \u003coptional\u003e\n#include \u003cstring\u003e\n#include \u003cutility\u003e\n#include \"api.h\"\n\n// TODO: CachingStore answers repeated get()s from memory, writes through on put() without leaving\n// stale data, and never caches a missing key.\nclass CachingStore final : public Store {\n public:\n  explicit CachingStore(Store\u0026 real) : real_(real) {}\n  std::optional\u003cstd::string\u003e get(const std::string\u0026 key) override { return real_.get(key); }\n  void put(const std::string\u0026 key, const std::string\u0026 value) override { real_.put(key, value); }\n\n private:\n  Store\u0026 real_;\n};\n\n// TODO: LazyStore builds the real store on first use, once, and then forwards everything to it.\nclass LazyStore final : public Store {\n public:\n  explicit LazyStore(std::function\u003cstd::unique_ptr\u003cStore\u003e()\u003e make) : make_(std::move(make)) {}\n  std::optional\u003cstd::string\u003e get(const std::string\u0026) override { return std::nullopt; }\n  void put(const std::string\u0026, const std::string\u0026) override {}\n\n private:\n  std::function\u003cstd::unique_ptr\u003cStore\u003e()\u003e make_;\n  std::unique_ptr\u003cStore\u003e real_;\n};\n52:T103a,#include \u003cmemory\u003e\n#include \u003coptional\u003e\n#include \u003cstring\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\n// Counts creations and destructions of the store a LazyStore builds.\nint g_made = 0;\nint g_destroyed = 0;\nclass CountedStore final : public Store {\n public:\n  CountedStore() { ++g_made; }\n  ~CountedStore() override { ++g_destroyed; }\n  std::optional\u003cstd::string\u003e get(const std::string\u0026 key) override { return \"v:\" + key; }\n  void put(const std::string\u0026, const std::string\u0026) override { ++puts_; }\n  int puts_ = 0;\n};\nvoid resetCounters() {\n  g_made = 0;\n  g_destroyed = 0;\n}\n}  // namespace\n\nTEST(Caching, SecondReadIsServedFromTheCache) {\n  MemoryStore real;\n  real.put(\"a\", \"1\");\n  CachingStore cache(real);\n  EXPECT_EQ(cache.get(\"a\"), std::optional\u003cstd::string\u003e(\"1\"));\n  EXPECT_EQ(cache.get(\"a\"), std::optional\u003cstd::string\u003e(\"1\"));\n  EXPECT_EQ(cache.get(\"a\"), std::optional\u003cstd::string\u003e(\"1\"));\n  EXPECT_EQ(real.reads(), static_cast\u003cstd::size_t\u003e(1));\n}\n\nTEST(Caching, KeysAreCachedIndependently) {\n  MemoryStore real;\n  real.put(\"a\", \"1\");\n  real.put(\"b\", \"2\");\n  CachingStore cache(real);\n  EXPECT_EQ(cache.get(\"a\"), std::optional\u003cstd::string\u003e(\"1\"));\n  EXPECT_EQ(cache.get(\"b\"), std::optional\u003cstd::string\u003e(\"2\"));\n  EXPECT_EQ(cache.get(\"a\"), std::optional\u003cstd::string\u003e(\"1\"));\n  EXPECT_EQ(cache.get(\"b\"), std::optional\u003cstd::string\u003e(\"2\"));\n  EXPECT_EQ(real.reads(), static_cast\u003cstd::size_t\u003e(2));\n}\n\nTEST(Caching, PutWritesThroughAndIsNeverStale) {\n  MemoryStore real;\n  real.put(\"a\", \"old\");\n  CachingStore cache(real);\n  EXPECT_EQ(cache.get(\"a\"), std::optional\u003cstd::string\u003e(\"old\"));\n  cache.put(\"a\", \"new\");\n  EXPECT_EQ(real.writes(), static_cast\u003cstd::size_t\u003e(2));  // the seed put plus the write-through\n  EXPECT_EQ(cache.get(\"a\"), std::optional\u003cstd::string\u003e(\"new\"));\n  EXPECT_EQ(real.get(\"a\"), std::optional\u003cstd::string\u003e(\"new\"));\n}\n\nTEST(Caching, PutOfAnUncachedKeyIsReadableThroughTheProxy) {\n  MemoryStore real;\n  CachingStore cache(real);\n  cache.put(\"k\", \"v\");\n  EXPECT_EQ(cache.get(\"k\"), std::optional\u003cstd::string\u003e(\"v\"));\n}\n\nTEST(Caching, MissingKeyIsReportedAndNotCached) {\n  MemoryStore real;\n  CachingStore cache(real);\n  EXPECT_FALSE(cache.get(\"ghost\").has_value());\n  EXPECT_FALSE(cache.get(\"ghost\").has_value());\n  EXPECT_EQ(real.reads(), static_cast\u003cstd::size_t\u003e(2));  // the miss was retried, not remembered\n  real.put(\"ghost\", \"boo\");                              // appears behind the proxy's back\n  EXPECT_EQ(cache.get(\"ghost\"), std::optional\u003cstd::string\u003e(\"boo\"));\n}\n\nTEST(Caching, IsUsableThroughTheStoreInterface) {\n  MemoryStore real;\n  CachingStore cache(real);\n  Store\u0026 asStore = cache;\n  asStore.put(\"x\", \"1\");\n  EXPECT_EQ(asStore.get(\"x\"), std::optional\u003cstd::string\u003e(\"1\"));\n}\n\nTEST(Lazy, NothingIsCreatedUntilFirstUse) {\n  resetCounters();\n  {\n    LazyStore lazy([] { return std::make_unique\u003cCountedStore\u003e(); });\n    EXPECT_EQ(g_made, 0);\n  }\n  EXPECT_EQ(g_made, 0);\n}\n\nTEST(Lazy, CreatesTheRealStoreExactlyOnce) {\n  resetCounters();\n  LazyStore lazy([] { return std::make_unique\u003cCountedStore\u003e(); });\n  EXPECT_EQ(lazy.get(\"a\"), std::optional\u003cstd::string\u003e(\"v:a\"));\n  EXPECT_EQ(lazy.get(\"b\"), std::optional\u003cstd::string\u003e(\"v:b\"));\n  lazy.put(\"c\", \"1\");\n  EXPECT_EQ(g_made, 1);\n}\n\nTEST(Lazy, ForwardsAWriteAsTheFirstUse) {\n  MemoryStore* seen = nullptr;\n  LazyStore lazy([\u0026seen] {\n    auto s = std::make_unique\u003cMemoryStore\u003e();\n    seen = s.get();\n    return s;\n  });\n  lazy.put(\"k\", \"v\");\n  EXPECT_TRUE(seen != nullptr);\n  EXPECT_EQ(lazy.get(\"k\"), std::optional\u003cstd::string\u003e(\"v\"));\n  EXPECT_EQ(seen-\u003ewrites(), static_cast\u003cstd::size_t\u003e(1));\n}\n\nTEST(Lazy, OwnsAndDestroysWhatItCreated) {\n  resetCounters();\n  {\n    LazyStore lazy([] { return std::make_unique\u003cCountedStore\u003e(); });\n    lazy.get(\"a\");\n    EXPECT_EQ(g_destroyed, 0);\n  }\n  EXPECT_EQ(g_destroyed, 1);\n}\n\nTEST(Proxies, CanBeStacked) {\n  MemoryStore real;\n  real.put(\"a\", \"1\");\n  CachingStore cache(real);\n  LazyStore lazy([\u0026cache] { return std::make_unique\u003cCachingStore\u003e(cache); });\n  EXPECT_EQ(lazy.get(\"a\"), std::optional\u003cstd::string\u003e(\"1\"));\n  EXPECT_EQ(lazy.get(\"a\"), std::optional\u003cstd::string\u003e(\"1\"));\n  EXPECT_EQ(real.reads(), static_cast\u003cstd::size_t\u003e(1));\n}\n53:T52b,A leaderboard must be re-sortable by different rules (highest score, alphabetical, fewest games played) without the leaderboard knowing any of them. That is the **Strategy** pattern: the varying algorithm lives behind `RankingPolicy` (see `api.h`) and the context holds one and delegates to it.\n\nWrite in `solution.h`:\n\n- `HighestScore`: a `RankingPolicy` where a higher `score` comes first.\n- `Alphabetical`: a `RankingPolicy` where the lexicographically smaller `name` comes first.\n- `Leaderboard`:\n  - `explicit Leaderboard(std::unique_ptr\u003cRankingPolicy\u003e policy)` takes ownership. A null policy falls back to `HighestScore` (the judge builds without exceptions, so there is nothing to throw; a context should never hold a null strategy).\n  - `void add(Player p)` records a player (names are unique; you do not need to check).\n  - `void setPolicy(std::unique_ptr\u003cRankingPolicy\u003e policy)` swaps the rule at runtime (a null policy is ignored and the old policy stays in place).\n  - `std::vector\u003cstd::string\u003e top(std::size_t n) const` returns the names of the first `n` players under the current policy, or all of them if there are fewer. **Tied players keep the order in which they were added.**\n\n`Leaderboard` must not contain any `if`/`switch` on which rule is active, and adding a new policy must not require editing it.\n54:Tc24,#include \u003cmemory\u003e\n#include \u003cstring\u003e\n#include \u003cvector\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\nusing Names = std::vector\u003cstd::string\u003e;\n\nLeaderboard sample(std::unique_ptr\u003cRankingPolicy\u003e policy) {\n  Leaderboard board(std::move(policy));\n  board.add({\"mira\", 50, 4});\n  board.add({\"ode\", 90, 9});\n  board.add({\"bryn\", 70, 2});\n  return board;\n}\n\n// A rule defined by the test only: proves the leaderboard needs no edit for a new policy.\nclass FewestGames final : public RankingPolicy {\n public:\n  bool before(const Player\u0026 a, const Player\u0026 b) const override { return a.games \u003c b.games; }\n};\n}  // namespace\n\nTEST(Leaderboard, HighestScoreComesFirst) {\n  Leaderboard board = sample(std::make_unique\u003cHighestScore\u003e());\n  EXPECT_TRUE(board.top(3) == (Names{\"ode\", \"bryn\", \"mira\"}));\n}\n\nTEST(Leaderboard, AlphabeticalPolicyOrdersByName) {\n  Leaderboard board = sample(std::make_unique\u003cAlphabetical\u003e());\n  EXPECT_TRUE(board.top(3) == (Names{\"bryn\", \"mira\", \"ode\"}));\n}\n\nTEST(Leaderboard, SwappingThePolicyReordersTheSameData) {\n  Leaderboard board = sample(std::make_unique\u003cHighestScore\u003e());\n  EXPECT_TRUE(board.top(1) == (Names{\"ode\"}));\n  board.setPolicy(std::make_unique\u003cAlphabetical\u003e());\n  EXPECT_TRUE(board.top(1) == (Names{\"bryn\"}));\n  board.setPolicy(std::make_unique\u003cHighestScore\u003e());\n  EXPECT_TRUE(board.top(2) == (Names{\"ode\", \"bryn\"}));\n}\n\nTEST(Leaderboard, ANewPolicyNeedsNoChangeToTheLeaderboard) {\n  Leaderboard board = sample(std::make_unique\u003cFewestGames\u003e());\n  EXPECT_TRUE(board.top(3) == (Names{\"bryn\", \"mira\", \"ode\"}));\n}\n\nTEST(Leaderboard, TiedPlayersKeepInsertionOrder) {\n  Leaderboard board(std::make_unique\u003cHighestScore\u003e());\n  Names expected;\n  for (int i = 0; i \u003c 60; ++i) {\n    const std::string name = \"p\" + std::to_string(i);\n    board.add({name, 10, 0});\n    expected.push_back(name);\n  }\n  EXPECT_TRUE(board.top(60) == expected);\n}\n\nTEST(Leaderboard, TopLimitsTheResult) {\n  Leaderboard board = sample(std::make_unique\u003cHighestScore\u003e());\n  EXPECT_EQ(board.top(0).size(), static_cast\u003cstd::size_t\u003e(0));\n  EXPECT_TRUE(board.top(2) == (Names{\"ode\", \"bryn\"}));\n}\n\nTEST(Leaderboard, TopMoreThanSizeReturnsEveryone) {\n  Leaderboard board = sample(std::make_unique\u003cHighestScore\u003e());\n  EXPECT_EQ(board.top(100).size(), static_cast\u003cstd::size_t\u003e(3));\n  Leaderboard empty(std::make_unique\u003cHighestScore\u003e());\n  EXPECT_EQ(empty.top(5).size(), static_cast\u003cstd::size_t\u003e(0));\n}\n\nTEST(Leaderboard, TopDoesNotReorderTheStoredPlayers) {\n  Leaderboard board = sample(std::make_unique\u003cHighestScore\u003e());\n  board.top(3);\n  board.setPolicy(std::make_unique\u003cFewestGames\u003e());\n  // If top() had sorted in place, insertion order (the tie-breaker) would be lost.\n  board.add({\"zed\", 0, 2});\n  EXPECT_TRUE(board.top(4) == (Names{\"bryn\", \"zed\", \"mira\", \"ode\"}));\n}\n\nTEST(Leaderboard, NullPolicyFallsBackToHighestScore) {\n  Leaderboard board = sample(nullptr);\n  EXPECT_TRUE(board.top(2) == (Names{\"ode\", \"bryn\"}));\n}\n\nTEST(Leaderboard, NullSwapKeepsTheOldPolicy) {\n  Leaderboard board = sample(std::make_unique\u003cAlphabetical\u003e());\n  board.setPolicy(nullptr);\n  EXPECT_TRUE(board.top(1) == (Names{\"bryn\"}));\n}\n55:T4e8,A `Topic` tells its subscribers about messages without knowing what they do with them: the **Observer** pattern. The classic C++ trap is ownership. A topic that keeps raw pointers dangles when a listener dies; a topic that keeps `shared_ptr`s silently keeps every listener alive forever (the \"lapsed listener\" leak). The topic should *observe* its listeners, not *own* them.\n\nWrite `Topic` in `solution.h` (the `Listener` interface is in `api.h`):\n\n- `void subscribe(const std::shared_ptr\u003cListener\u003e\u0026 listener)` registers a listener **without extending its lifetime**. Subscribing the same listener twice has no extra effect.\n- `void unsubscribe(const Listener\u0026 listener)` removes it (nothing happens if it is not subscribed).\n- `std::size_t publish(const std::string\u0026 message)` calls `onMessage` on every live subscriber, in subscription order, and returns how many were called. Listeners that have been destroyed are skipped and forgotten.\n- `std::size_t subscriberCount() const` is the number of listeners that are currently alive and subscribed.\n\nA listener may call `unsubscribe` (even on itself) or `subscribe` another listener from inside `onMessage`. That must be safe: listeners added during a publish hear the *next* message, not the current one.\n56:T1484,#include \u003cmemory\u003e\n#include \u003cstring\u003e\n#include \u003cvector\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\nclass Recorder final : public Listener {\n public:\n  explicit Recorder(std::vector\u003cstd::string\u003e* log = nullptr, std::string id = \"\") : log_(log), id_(std::move(id)) {}\n  void onMessage(const std::string\u0026 message) override {\n    heard.push_back(message);\n    if (log_) log_-\u003epush_back(id_);\n  }\n  std::vector\u003cstd::string\u003e heard;\n\n private:\n  std::vector\u003cstd::string\u003e* log_;\n  std::string id_;\n};\n\n// Unsubscribes itself the first time it hears anything.\nclass OneShot final : public Listener {\n public:\n  explicit OneShot(Topic\u0026 topic) : topic_(topic) {}\n  void onMessage(const std::string\u0026) override {\n    ++calls;\n    topic_.unsubscribe(*this);\n  }\n  int calls = 0;\n\n private:\n  Topic\u0026 topic_;\n};\n\n// Subscribes a newcomer while it is being notified.\nclass Recruiter final : public Listener {\n public:\n  Recruiter(Topic\u0026 topic, std::shared_ptr\u003cListener\u003e recruit) : topic_(topic), recruit_(std::move(recruit)) {}\n  void onMessage(const std::string\u0026) override { topic_.subscribe(recruit_); }\n\n private:\n  Topic\u0026 topic_;\n  std::shared_ptr\u003cListener\u003e recruit_;\n};\n\nint g_alive = 0;\nclass Tracked final : public Listener {\n public:\n  Tracked() { ++g_alive; }\n  ~Tracked() override { --g_alive; }\n  void onMessage(const std::string\u0026) override { ++calls; }\n  int calls = 0;\n};\n}  // namespace\n\nTEST(Topic, DeliversToEverySubscriber) {\n  Topic topic;\n  auto a = std::make_shared\u003cRecorder\u003e();\n  auto b = std::make_shared\u003cRecorder\u003e();\n  topic.subscribe(a);\n  topic.subscribe(b);\n  EXPECT_EQ(topic.publish(\"hello\"), static_cast\u003cstd::size_t\u003e(2));\n  EXPECT_EQ(a-\u003eheard.size(), static_cast\u003cstd::size_t\u003e(1));\n  EXPECT_EQ(b-\u003eheard.size(), static_cast\u003cstd::size_t\u003e(1));\n  EXPECT_EQ(b-\u003eheard[0], std::string(\"hello\"));\n}\n\nTEST(Topic, DeliversInSubscriptionOrder) {\n  Topic topic;\n  std::vector\u003cstd::string\u003e log;\n  auto a = std::make_shared\u003cRecorder\u003e(\u0026log, \"a\");\n  auto b = std::make_shared\u003cRecorder\u003e(\u0026log, \"b\");\n  auto c = std::make_shared\u003cRecorder\u003e(\u0026log, \"c\");\n  topic.subscribe(a);\n  topic.subscribe(b);\n  topic.subscribe(c);\n  topic.publish(\"x\");\n  EXPECT_TRUE(log == (std::vector\u003cstd::string\u003e{\"a\", \"b\", \"c\"}));\n}\n\nTEST(Topic, PublishWithNoSubscribersIsHarmless) {\n  Topic topic;\n  EXPECT_EQ(topic.publish(\"anyone?\"), static_cast\u003cstd::size_t\u003e(0));\n  EXPECT_EQ(topic.subscriberCount(), static_cast\u003cstd::size_t\u003e(0));\n}\n\nTEST(Topic, SubscribingTwiceDeliversOnce) {\n  Topic topic;\n  auto a = std::make_shared\u003cRecorder\u003e();\n  topic.subscribe(a);\n  topic.subscribe(a);\n  EXPECT_EQ(topic.publish(\"m\"), static_cast\u003cstd::size_t\u003e(1));\n  EXPECT_EQ(a-\u003eheard.size(), static_cast\u003cstd::size_t\u003e(1));\n  EXPECT_EQ(topic.subscriberCount(), static_cast\u003cstd::size_t\u003e(1));\n}\n\nTEST(Topic, UnsubscribeStopsDelivery) {\n  Topic topic;\n  auto a = std::make_shared\u003cRecorder\u003e();\n  auto b = std::make_shared\u003cRecorder\u003e();\n  topic.subscribe(a);\n  topic.subscribe(b);\n  topic.unsubscribe(*a);\n  topic.unsubscribe(*a);  // not subscribed any more: harmless\n  EXPECT_EQ(topic.publish(\"m\"), static_cast\u003cstd::size_t\u003e(1));\n  EXPECT_EQ(a-\u003eheard.size(), static_cast\u003cstd::size_t\u003e(0));\n  EXPECT_EQ(b-\u003eheard.size(), static_cast\u003cstd::size_t\u003e(1));\n}\n\nTEST(Topic, DoesNotKeepListenersAlive) {\n  g_alive = 0;\n  Topic topic;\n  {\n    auto t = std::make_shared\u003cTracked\u003e();\n    topic.subscribe(t);\n    EXPECT_EQ(g_alive, 1);\n  }\n  EXPECT_EQ(g_alive, 0);  // the topic must not be a co-owner\n}\n\nTEST(Topic, DeadListenersAreSkippedAndNotCounted) {\n  Topic topic;\n  auto keep = std::make_shared\u003cRecorder\u003e();\n  topic.subscribe(keep);\n  {\n    auto gone = std::make_shared\u003cRecorder\u003e();\n    topic.subscribe(gone);\n  }\n  EXPECT_EQ(topic.publish(\"m\"), static_cast\u003cstd::size_t\u003e(1));\n  EXPECT_EQ(keep-\u003eheard.size(), static_cast\u003cstd::size_t\u003e(1));\n}\n\nTEST(Topic, SubscriberCountIgnoresDeadListeners) {\n  Topic topic;\n  auto a = std::make_shared\u003cRecorder\u003e();\n  topic.subscribe(a);\n  for (int i = 0; i \u003c 5; ++i) {\n    auto temp = std::make_shared\u003cRecorder\u003e();\n    topic.subscribe(temp);\n  }\n  EXPECT_EQ(topic.subscriberCount(), static_cast\u003cstd::size_t\u003e(1));\n  a.reset();\n  EXPECT_EQ(topic.subscriberCount(), static_cast\u003cstd::size_t\u003e(0));\n}\n\nTEST(Topic, ListenerMayUnsubscribeItselfDuringPublish) {\n  Topic topic;\n  auto first = std::make_shared\u003cRecorder\u003e();\n  auto shy = std::make_shared\u003cOneShot\u003e(topic);\n  auto last = std::make_shared\u003cRecorder\u003e();\n  topic.subscribe(first);\n  topic.subscribe(shy);\n  topic.subscribe(last);\n  EXPECT_EQ(topic.publish(\"one\"), static_cast\u003cstd::size_t\u003e(3));  // all three heard it\n  EXPECT_EQ(topic.publish(\"two\"), static_cast\u003cstd::size_t\u003e(2));  // shy left\n  EXPECT_EQ(shy-\u003ecalls, 1);\n  EXPECT_EQ(last-\u003eheard.size(), static_cast\u003cstd::size_t\u003e(2));\n  EXPECT_EQ(first-\u003eheard.size(), static_cast\u003cstd::size_t\u003e(2));\n}\n\nTEST(Topic, ListenerAddedDuringPublishHearsTheNextMessage) {\n  Topic topic;\n  auto newcomer = std::make_shared\u003cRecorder\u003e();\n  auto recruiter = std::make_shared\u003cRecruiter\u003e(topic, newcomer);\n  topic.subscribe(recruiter);\n  EXPECT_EQ(topic.publish(\"one\"), static_cast\u003cstd::size_t\u003e(1));\n  EXPECT_EQ(newcomer-\u003eheard.size(), static_cast\u003cstd::size_t\u003e(0));\n  EXPECT_EQ(topic.publish(\"two\"), static_cast\u003cstd::size_t\u003e(2));\n  EXPECT_EQ(newcomer-\u003eheard.size(), static_cast\u003cstd::size_t\u003e(1));\n}\n57:T49f,An editor turns each user action into a **Command** object so that actions can be queued, logged and undone. `api.h` gives you the receiver (`TextBuffer`) and the `Command` interface. Write in `solution.h`:\n\n- `AppendCommand(TextBuffer\u0026 buffer, std::string text)`: `execute` appends the text; `undo` removes exactly what it appended.\n- `EraseCommand(TextBuffer\u0026 buffer, std::size_t count)`: `execute` removes up to `count` characters from the end and **remembers what was actually removed**; `undo` puts exactly those characters back. (Erasing 5 from a 3-character buffer removes 3, and undo restores 3.)\n- `History`: owns executed commands.\n  - `void run(std::unique_ptr\u003cCommand\u003e command)` executes the command and records it. Running a new command **discards the redo stack**: after an undo, a fresh action ends the old future.\n  - `bool undo()` / `bool redo()` return `false` (and do nothing) when there is nothing to undo / redo, otherwise move one command between the stacks and return `true`.\n  - `bool canUndo() const` / `bool canRedo() const`.\n\nA command is executed exactly once per `run`; `redo` re-executes the same object, so commands must be repeatable after an `undo`.\n58:T43d,#pragma once\n#include \u003ccstddef\u003e\n#include \u003cmemory\u003e\n#include \u003cstring\u003e\n#include \u003cutility\u003e\n#include \u003cvector\u003e\n#include \"api.h\"\n\n// TODO: append text; undo removes exactly that text.\nclass AppendCommand final : public Command {\n public:\n  AppendCommand(TextBuffer\u0026 buffer, std::string text) : buffer_(buffer), text_(std::move(text)) {}\n  void execute() override {}\n  void undo() override {}\n\n private:\n  TextBuffer\u0026 buffer_;\n  std::string text_;\n};\n\n// TODO: erase up to count characters, remember exactly what was removed, restore it on undo.\nclass EraseCommand final : public Command {\n public:\n  EraseCommand(TextBuffer\u0026 buffer, std::size_t count) : buffer_(buffer), count_(count) {}\n  void execute() override {}\n  void undo() override {}\n\n private:\n  TextBuffer\u0026 buffer_;\n  std::size_t count_;\n};\n\n// TODO: run/undo/redo with two stacks; a new run() clears the redo stack.\nclass History {\n public:\n  void run(std::unique_ptr\u003cCommand\u003e) {}\n  bool undo() { return false; }\n  bool redo() { return false; }\n  bool canUndo() const { return false; }\n  bool canRedo() const { return false; }\n};\n59:Tb45,#include \u003cmemory\u003e\n#include \u003cstring\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\nvoid type(History\u0026 h, TextBuffer\u0026 b, const std::string\u0026 s) { h.run(std::make_unique\u003cAppendCommand\u003e(b, s)); }\nvoid erase(History\u0026 h, TextBuffer\u0026 b, std::size_t n) { h.run(std::make_unique\u003cEraseCommand\u003e(b, n)); }\n}  // namespace\n\nTEST(Append, ExecuteAppendsText) {\n  TextBuffer b;\n  History h;\n  type(h, b, \"hello\");\n  type(h, b, \" world\");\n  EXPECT_EQ(b.text(), std::string(\"hello world\"));\n}\n\nTEST(Append, UndoRemovesExactlyWhatWasAppended) {\n  TextBuffer b;\n  History h;\n  type(h, b, \"ab\");\n  type(h, b, \"cdef\");\n  EXPECT_TRUE(h.undo());\n  EXPECT_EQ(b.text(), std::string(\"ab\"));\n}\n\n\nTEST(Erase, RemovesFromTheEnd) {\n  TextBuffer b;\n  History h;\n  type(h, b, \"abcdef\");\n  erase(h, b, 2);\n  EXPECT_EQ(b.text(), std::string(\"abcd\"));\n}\n\nTEST(Erase, UndoRestoresTheRemovedCharacters) {\n  TextBuffer b;\n  History h;\n  type(h, b, \"abcdef\");\n  erase(h, b, 3);\n  EXPECT_TRUE(h.undo());\n  EXPECT_EQ(b.text(), std::string(\"abcdef\"));\n}\n\nTEST(Erase, UndoRestoresOnlyWhatWasRemoved) {\n  TextBuffer b;\n  History h;\n  type(h, b, \"abc\");\n  erase(h, b, 5);  // only 3 characters exist\n  EXPECT_EQ(b.text(), std::string(\"\"));\n  EXPECT_TRUE(h.undo());\n  EXPECT_EQ(b.text(), std::string(\"abc\"));\n}\n\nTEST(History, UndoThenRedoRestoresTheState) {\n  TextBuffer b;\n  History h;\n  type(h, b, \"one\");\n  type(h, b, \"two\");\n  EXPECT_TRUE(h.undo());\n  EXPECT_EQ(b.text(), std::string(\"one\"));\n  EXPECT_TRUE(h.redo());\n  EXPECT_EQ(b.text(), std::string(\"onetwo\"));\n}\n\nTEST(History, UndoWalksBackThroughEveryAction) {\n  TextBuffer b;\n  History h;\n  type(h, b, \"ab\");\n  erase(h, b, 1);\n  type(h, b, \"XY\");\n  EXPECT_EQ(b.text(), std::string(\"aXY\"));\n  h.undo();\n  EXPECT_EQ(b.text(), std::string(\"a\"));\n  h.undo();\n  EXPECT_EQ(b.text(), std::string(\"ab\"));\n  h.undo();\n  EXPECT_EQ(b.text(), std::string(\"\"));\n  EXPECT_FALSE(h.canUndo());\n  EXPECT_TRUE(h.canRedo());\n}\n\nTEST(History, RedoAfterEraseReplaysTheErase) {\n  TextBuffer b;\n  History h;\n  type(h, b, \"hello\");\n  erase(h, b, 2);\n  h.undo();\n  EXPECT_EQ(b.text(), std::string(\"hello\"));\n  h.redo();\n  EXPECT_EQ(b.text(), std::string(\"hel\"));\n}\n\nTEST(History, NewActionDiscardsTheRedoStack) {\n  TextBuffer b;\n  History h;\n  type(h, b, \"a\");\n  type(h, b, \"b\");\n  h.undo();\n  EXPECT_TRUE(h.canRedo());\n  type(h, b, \"c\");\n  EXPECT_FALSE(h.canRedo());\n  EXPECT_FALSE(h.redo());\n  EXPECT_EQ(b.text(), std::string(\"ac\"));\n}\n\nTEST(History, UndoAndRedoOnEmptyHistoryReturnFalse) {\n  TextBuffer b;\n  History h;\n  EXPECT_FALSE(h.canUndo());\n  EXPECT_FALSE(h.canRedo());\n  EXPECT_FALSE(h.undo());\n  EXPECT_FALSE(h.redo());\n  EXPECT_EQ(b.text(), std::string(\"\"));\n}\n\nTEST(History, FlagsTrackTheStacks) {\n  TextBuffer b;\n  History h;\n  type(h, b, \"x\");\n  EXPECT_TRUE(h.canUndo());\n  EXPECT_FALSE(h.canRedo());\n  h.undo();\n  EXPECT_FALSE(h.canUndo());\n  EXPECT_TRUE(h.canRedo());\n}\n5a:T511,A `Document` moves through a workflow, and what each action does depends on where it is. The tempting implementation is one class full of `if (state == ...)` checks repeated in every method. The **State** pattern moves each state's behaviour into its own class, and the document delegates.\n\nRules, for a `Document` that starts in **draft** with revision 0:\n\n| State | `edit()` | `submit()` | `approve()` | `reject()` |\n|---|---|---|---|---|\n| draft | allowed: revision +1, stays draft | moves to **review** | not allowed | not allowed |\n| review | not allowed | not allowed | moves to **published** | moves back to **draft** |\n| published | not allowed | not allowed | not allowed | not allowed |\n\nWrite `Document` in `solution.h` with:\n\n- `bool edit()`, `bool submit()`, `bool approve()`, `bool reject()`: return `true` if the action was allowed and happened, `false` if it is not allowed in the current state (and then **nothing** changes).\n- `std::string stateName() const`: `\"draft\"`, `\"review\"` or `\"published\"`.\n- `int revision() const`: the number of allowed `edit()` calls so far (a rejected document keeps its revision).\n\nUse one class per state behind a private interface, and have each state hand back the next one. `Document` must not contain a `switch` or an `if` chain on the state.\n5b:T8d9,#include \u003cstring\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nTEST(Workflow, StartsAsAnEmptyDraft) {\n  Document d;\n  EXPECT_EQ(d.stateName(), std::string(\"draft\"));\n  EXPECT_EQ(d.revision(), 0);\n}\n\nTEST(Workflow, DraftsCanBeEditedAndCountRevisions) {\n  Document d;\n  EXPECT_TRUE(d.edit());\n  EXPECT_TRUE(d.edit());\n  EXPECT_EQ(d.revision(), 2);\n  EXPECT_EQ(d.stateName(), std::string(\"draft\"));\n}\n\nTEST(Workflow, SubmitMovesDraftToReview) {\n  Document d;\n  EXPECT_TRUE(d.submit());\n  EXPECT_EQ(d.stateName(), std::string(\"review\"));\n}\n\nTEST(Workflow, EditIsRefusedInReview) {\n  Document d;\n  d.edit();\n  d.submit();\n  EXPECT_FALSE(d.edit());\n  EXPECT_EQ(d.revision(), 1);\n  EXPECT_EQ(d.stateName(), std::string(\"review\"));\n}\n\nTEST(Workflow, ApproveMovesReviewToPublished) {\n  Document d;\n  d.submit();\n  EXPECT_TRUE(d.approve());\n  EXPECT_EQ(d.stateName(), std::string(\"published\"));\n}\n\nTEST(Workflow, RejectSendsReviewBackToDraft) {\n  Document d;\n  d.edit();\n  d.submit();\n  EXPECT_TRUE(d.reject());\n  EXPECT_EQ(d.stateName(), std::string(\"draft\"));\n  EXPECT_EQ(d.revision(), 1);  // the work is kept\n  EXPECT_TRUE(d.edit());       // and the author can fix it\n  EXPECT_EQ(d.revision(), 2);\n}\n\nTEST(Workflow, PublishedIsFinal) {\n  Document d;\n  d.submit();\n  d.approve();\n  EXPECT_FALSE(d.edit());\n  EXPECT_FALSE(d.submit());\n  EXPECT_FALSE(d.approve());\n  EXPECT_FALSE(d.reject());\n  EXPECT_EQ(d.stateName(), std::string(\"published\"));\n  EXPECT_EQ(d.revision(), 0);\n}\n\nTEST(Workflow, ApproveFromDraftIsRefusedAndChangesNothing) {\n  Document d;\n  EXPECT_FALSE(d.approve());\n  EXPECT_EQ(d.stateName(), std::string(\"draft\"));\n  EXPECT_FALSE(d.reject());\n  EXPECT_EQ(d.stateName(), std::string(\"draft\"));\n}\n\nTEST(Workflow, SubmitTwiceIsRefused) {\n  Document d;\n  EXPECT_TRUE(d.submit());\n  EXPECT_FALSE(d.submit());\n  EXPECT_EQ(d.stateName(), std::string(\"review\"));\n}\n\nTEST(Workflow, RefusedEditsDoNotChangeTheRevision) {\n  Document d;\n  d.edit();\n  d.submit();\n  d.edit();\n  d.edit();\n  EXPECT_EQ(d.revision(), 1);\n}\n\nTEST(Workflow, ARejectedDocumentCanGoAroundAgain) {\n  Document d;\n  d.submit();\n  d.reject();\n  d.edit();\n  EXPECT_TRUE(d.submit());\n  EXPECT_TRUE(d.approve());\n  EXPECT_EQ(d.stateName(), std::string(\"published\"));\n  EXPECT_EQ(d.revision(), 1);\n}\n5c:T52d,Every report your service prints has the same skeleton (a heading, the rows, an optional footer), but each report fills in the middle differently. Copy-pasting the skeleton into every report class is how one of them ends up without its footer. The **Template Method** pattern fixes the skeleton once in a base class and lets subclasses fill in only the steps.\n\nWrite `ReportGenerator` in `solution.h` with this shape:\n\n- `virtual ~ReportGenerator()`.\n- A **public, non-virtual, const** `std::string generate() const`. This is the template method: subclasses must not be able to change the order of the steps.\n- Three **private virtual** steps (non-virtual interface idiom). Subclasses override them; callers never call them directly:\n  - `virtual std::string title() const = 0;` (required)\n  - `virtual std::vector\u003cstd::string\u003e rows() const = 0;` (required)\n  - `virtual std::string footer() const` : an optional **hook** with a default that returns `\"\"`.\n\n`generate()` returns, in this order:\n\n1. `\"== \" + title() + \" ==\\n\"`\n2. one line `\"- \" + row + \"\\n\"` per row, or `\"(no rows)\\n\"` when there are none\n3. `footer()` exactly as returned\n\n`rows()` is a step that may be expensive (it could query a database), so call it **exactly once** per `generate()`. A subclass that only overrides `title()` and `rows()` must compile.\n5d:T909,#include \u003cmemory\u003e\n#include \u003cstring\u003e\n#include \u003cvector\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\n// Overrides only the required steps: proves the footer hook really is optional.\nclass Plain : public ReportGenerator {\n public:\n  Plain(std::string title, std::vector\u003cstd::string\u003e rows) : title_(std::move(title)), rows_(std::move(rows)) {}\n\n private:\n  std::string title() const override { return title_; }\n  std::vector\u003cstd::string\u003e rows() const override { return rows_; }\n  std::string title_;\n  std::vector\u003cstd::string\u003e rows_;\n};\n\nclass WithFooter : public ReportGenerator {\n private:\n  std::string title() const override { return \"Sales\"; }\n  std::vector\u003cstd::string\u003e rows() const override { return {\"north: 4\", \"south: 9\"}; }\n  std::string footer() const override { return \"total: 13\\n\"; }\n};\n\n// Records the order in which the template calls its steps and how often.\nclass Recording : public ReportGenerator {\n public:\n  mutable std::vector\u003cstd::string\u003e log;\n\n private:\n  std::string title() const override { log.push_back(\"title\"); return \"R\"; }\n  std::vector\u003cstd::string\u003e rows() const override { log.push_back(\"rows\"); return {\"x\"}; }\n  std::string footer() const override { log.push_back(\"footer\"); return \"end\\n\"; }\n};\n}  // namespace\n\nTEST(Report, RequiredStepsOnlyProduceHeadingAndRows) {\n  Plain r(\"Users\", {\"ann\", \"bob\"});\n  EXPECT_EQ(r.generate(), std::string(\"== Users ==\\n- ann\\n- bob\\n\"));\n}\n\nTEST(Report, FooterHookIsAppendedAfterTheRows) {\n  WithFooter r;\n  EXPECT_EQ(r.generate(), std::string(\"== Sales ==\\n- north: 4\\n- south: 9\\ntotal: 13\\n\"));\n}\n\nTEST(Report, NoRowsPrintsAPlaceholder) {\n  Plain r(\"Empty\", {});\n  EXPECT_EQ(r.generate(), std::string(\"== Empty ==\\n(no rows)\\n\"));\n}\n\nTEST(Report, StepsRunInOrderAndRowsOnlyOnce) {\n  Recording r;\n  EXPECT_EQ(r.generate(), std::string(\"== R ==\\n- x\\nend\\n\"));\n  const std::vector\u003cstd::string\u003e expected = {\"title\", \"rows\", \"footer\"};\n  EXPECT_TRUE(r.log == expected);\n}\n\nTEST(Report, GenerateIsCallableOnAConstObjectThroughTheBase) {\n  const std::unique_ptr\u003cconst ReportGenerator\u003e r = std::make_unique\u003cWithFooter\u003e();\n  EXPECT_EQ(r-\u003egenerate(), std::string(\"== Sales ==\\n- north: 4\\n- south: 9\\ntotal: 13\\n\"));\n}\n\nTEST(Report, GeneratingTwiceGivesTheSameText) {\n  Plain r(\"Again\", {\"a\"});\n  EXPECT_EQ(r.generate(), r.generate());\n}\n5e:T663,A `Roster` keeps names in the order they joined. Removing someone must not shuffle the others, so a removed entry is only **marked dead** and stays in storage (a tombstone). Callers must never see it. The tempting API hands out the internal `vector` and makes every caller remember to skip dead entries; the **Iterator** pattern hides the storage and the skipping behind `begin()` and `end()`.\n\nWrite `Roster` in `solution.h`:\n\n- `void add(std::string name)` appends a live entry. `bool remove(const std::string\u0026 name)` marks the **first live** entry with that name dead and returns `true`, or returns `false` if there is none. `std::size_t size() const` is the number of **live** entries.\n- A nested forward iterator type `Roster::const_iterator`, returned by `begin() const` and `end() const`. It visits live entries only, in the order they were added.\n  - `operator*` returns `const std::string\u0026` (callers may not modify names through it) and `operator-\u003e` returns `const std::string*`.\n  - Pre-increment and post-increment (post-increment returns the iterator as it was before moving). `==` and `!=`.\n  - Must skip dead entries **at the start** (`begin()` when the first entries are dead), **in the middle** (several dead in a row) and **at the end** (trailing dead entries must not appear before `end()`).\n  - Must work with standard algorithms such as `std::count_if`, `std::find` and `std::distance`, so give it the five iterator typedefs (`iterator_category`, `value_type`, `difference_type`, `pointer`, `reference`).\n- A default-constructed `const_iterator` must be valid to create (it is what generic code value-initialises).\n5f:T56c,#pragma once\n#include \u003ccstddef\u003e\n#include \u003citerator\u003e\n#include \u003cstring\u003e\n#include \u003cutility\u003e\n#include \u003cvector\u003e\n\nclass Roster {\n public:\n  // TODO: a forward iterator over the LIVE names only. Store what it needs (the slots and an index)\n  // and skip dead slots in the constructor and in operator++.\n  class const_iterator {\n   public:\n    using iterator_category = std::forward_iterator_tag;\n    using value_type = std::string;\n    using difference_type = std::ptrdiff_t;\n    using pointer = const std::string*;\n    using reference = const std::string\u0026;\n\n    const_iterator() = default;\n    reference operator*() const { return empty_; }\n    pointer operator-\u003e() const { return \u0026empty_; }\n    const_iterator\u0026 operator++() { return *this; }\n    const_iterator operator++(int) { return *this; }\n    friend bool operator==(const const_iterator\u0026, const const_iterator\u0026) { return true; }\n    friend bool operator!=(const const_iterator\u0026, const const_iterator\u0026) { return false; }\n\n   private:\n    std::string empty_;\n  };\n\n  // TODO: keep removed entries as tombstones (so order never changes) and count only live ones.\n  void add(std::string name) { (void)name; }\n  bool remove(const std::string\u0026 name) { (void)name; return false; }\n  std::size_t size() const { return 0; }\n\n  const_iterator begin() const { return const_iterator(); }\n  const_iterator end() const { return const_iterator(); }\n};\n60:Td5f,#include \u003calgorithm\u003e\n#include \u003citerator\u003e\n#include \u003cstring\u003e\n#include \u003ctype_traits\u003e\n#include \u003cutility\u003e\n#include \u003cvector\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\n// Callers get read-only access: dereferencing yields a const reference, not a copy and not a mutable one.\nstatic_assert(std::is_same_v\u003cdecltype(*std::declval\u003cRoster::const_iterator\u003e()), const std::string\u0026\u003e,\n              \"operator* must return const std::string\u0026\");\n\nnamespace {\nRoster make(std::initializer_list\u003cconst char*\u003e names) {\n  Roster r;\n  for (const char* n : names) r.add(n);\n  return r;\n}\n\nstd::string join(const Roster\u0026 r) {\n  std::string out;\n  for (const std::string\u0026 name : r) {\n    if (!out.empty()) out += \",\";\n    out += name;\n  }\n  return out;\n}\n}  // namespace\n\nTEST(Roster, IteratesInJoinOrder) {\n  Roster r = make({\"ann\", \"bob\", \"cy\"});\n  EXPECT_EQ(join(r), std::string(\"ann,bob,cy\"));\n}\n\nTEST(Roster, SkipsDeadEntriesAtTheStart) {\n  Roster r = make({\"ann\", \"bob\", \"cy\"});\n  EXPECT_TRUE(r.remove(\"ann\"));\n  EXPECT_EQ(join(r), std::string(\"bob,cy\"));\n}\n\nTEST(Roster, SkipsSeveralDeadEntriesInARow) {\n  Roster r = make({\"a\", \"b\", \"c\", \"d\", \"e\"});\n  r.remove(\"b\");\n  r.remove(\"c\");\n  r.remove(\"d\");\n  EXPECT_EQ(join(r), std::string(\"a,e\"));\n}\n\nTEST(Roster, TrailingDeadEntriesAreNotVisited) {\n  Roster r = make({\"a\", \"b\", \"c\", \"d\"});\n  r.remove(\"c\");\n  r.remove(\"d\");\n  EXPECT_EQ(join(r), std::string(\"a,b\"));\n}\n\nTEST(Roster, EmptyAndFullyRemovedRostersHaveBeginEqualEnd) {\n  Roster empty;\n  EXPECT_TRUE(empty.begin() == empty.end());\n  Roster r = make({\"x\", \"y\"});\n  r.remove(\"x\");\n  r.remove(\"y\");\n  EXPECT_TRUE(r.begin() == r.end());\n  EXPECT_EQ(r.size(), static_cast\u003cstd::size_t\u003e(0));\n}\n\nTEST(Roster, SizeCountsOnlyLiveEntries) {\n  Roster r = make({\"a\", \"b\", \"c\"});\n  EXPECT_EQ(r.size(), static_cast\u003cstd::size_t\u003e(3));\n  EXPECT_TRUE(r.remove(\"b\"));\n  EXPECT_FALSE(r.remove(\"b\"));      // already gone\n  EXPECT_FALSE(r.remove(\"nobody\"));\n  EXPECT_EQ(r.size(), static_cast\u003cstd::size_t\u003e(2));\n}\n\nTEST(Roster, RemoveMarksOnlyTheFirstLiveDuplicate) {\n  Roster r = make({\"sam\", \"kim\", \"sam\"});\n  EXPECT_TRUE(r.remove(\"sam\"));\n  EXPECT_EQ(join(r), std::string(\"kim,sam\"));\n}\n\nTEST(Roster, WorksWithStandardAlgorithms) {\n  Roster r = make({\"ann\", \"bob\", \"al\", \"cy\"});\n  r.remove(\"bob\");\n  const auto startsWithA = [](const std::string\u0026 s) { return !s.empty() \u0026\u0026 s[0] == 'a'; };\n  EXPECT_EQ(std::count_if(r.begin(), r.end(), startsWithA), 2);\n  EXPECT_EQ(std::distance(r.begin(), r.end()), 3);\n  const auto it = std::find(r.begin(), r.end(), std::string(\"cy\"));\n  EXPECT_TRUE(it != r.end());\n  EXPECT_TRUE(std::find(r.begin(), r.end(), std::string(\"bob\")) == r.end());\n}\n\nTEST(Roster, PostIncrementReturnsThePreviousPosition) {\n  Roster r = make({\"a\", \"b\"});\n  auto it = r.begin();\n  const auto before = it++;\n  EXPECT_EQ(*before, std::string(\"a\"));\n  EXPECT_EQ(*it, std::string(\"b\"));\n}\n\nTEST(Roster, IteratorsAreIndependentAndArrowWorks) {\n  Roster r = make({\"ann\", \"bob\"});\n  auto first = r.begin();\n  auto second = r.begin();\n  ++second;\n  EXPECT_EQ(*first, std::string(\"ann\"));\n  EXPECT_EQ(second-\u003esize(), static_cast\u003cstd::size_t\u003e(3));\n  EXPECT_TRUE(first != second);\n  ++first;\n  EXPECT_TRUE(first == second);\n}\n\nTEST(Roster, ConstRosterCanBeIteratedAndDefaultIteratorsCompare) {\n  const Roster r = make({\"a\", \"b\"});\n  EXPECT_EQ(join(r), std::string(\"a,b\"));\n  Roster::const_iterator a;\n  Roster::const_iterator b;\n  EXPECT_TRUE(a == b);\n}\n61:T692,An expense must be approved by someone whose limit covers it: a manager for small amounts, a director for bigger ones, a VP above that. Putting every `if (cents \u003c= ...)` rule into one function means each new approver edits it. In the **Chain of Responsibility** pattern each approver decides whether the request is theirs and otherwise passes it along, so the chain can be rebuilt (or extended with a new kind of approver) without touching existing code.\n\n`api.h` gives you `Expense { employee, cents }`. Write in `solution.h`:\n\n- `class Approver`, the chain link and base class:\n  - `virtual ~Approver()`.\n  - `Approver\u0026 then(std::unique_ptr\u003cApprover\u003e next)` stores `next` as this link's successor (the link owns it) and **returns a reference to `next`**, so chains read left to right: `a-\u003ethen(std::move(b)).then(std::move(c))` builds `a -\u003e b -\u003e c`.\n  - `std::string handle(const Expense\u0026) const` (public, non-virtual). If this link can approve, it returns `role()`. Otherwise it forwards to the next link. If there is no next link it returns `\"rejected\"`. **Stop at the first link that can approve**: later links are never consulted.\n  - Two **protected pure virtuals** that subclasses override: `bool canApprove(const Expense\u0026) const` and `std::string role() const`.\n- `class LimitApprover final : public Approver`, constructed as `LimitApprover(std::string role, long long limitCents)`. It approves an expense when `0 \u003c cents \u003c= limitCents` (the limit is inclusive; zero or negative amounts are nobody's to approve).\n\nHidden tests also define their own `Approver` subclasses (for example one that blocks certain employees), so nothing in `Approver` may assume `LimitApprover`.\n62:Tf5a,#include \u003cmemory\u003e\n#include \u003cset\u003e\n#include \u003cstring\u003e\n#include \u003cutility\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\nstd::unique_ptr\u003cApprover\u003e limit(const char* role, long long cents) {\n  return std::make_unique\u003cLimitApprover\u003e(role, cents);\n}\n\n// manager (1,000.00) -\u003e director (5,000.00) -\u003e vp (20,000.00)\nstd::unique_ptr\u003cApprover\u003e standardChain() {\n  auto head = limit(\"manager\", 100000);\n  head-\u003ethen(limit(\"director\", 500000)).then(limit(\"vp\", 2000000));\n  return head;\n}\n\n// A new kind of approver, written without touching Approver or LimitApprover.\nclass BlocklistApprover final : public Approver {\n public:\n  explicit BlocklistApprover(std::set\u003cstd::string\u003e blocked) : blocked_(std::move(blocked)) {}\n\n protected:\n  bool canApprove(const Expense\u0026 e) const override { return blocked_.count(e.employee) \u003e 0; }\n  std::string role() const override { return \"compliance-block\"; }\n\n private:\n  std::set\u003cstd::string\u003e blocked_;\n};\n\n// Counts how many times it is consulted.\nclass Spy final : public Approver {\n public:\n  Spy(bool answer, int* calls) : answer_(answer), calls_(calls) {}\n\n protected:\n  bool canApprove(const Expense\u0026) const override {\n    ++*calls_;\n    return answer_;\n  }\n  std::string role() const override { return answer_ ? \"spy-yes\" : \"spy-no\"; }\n\n private:\n  bool answer_;\n  int* calls_;\n};\n}  // namespace\n\nTEST(Chain, SmallExpenseIsApprovedByTheFirstLink) {\n  auto chain = standardChain();\n  EXPECT_EQ(chain-\u003ehandle({\"ann\", 25000}), std::string(\"manager\"));\n}\n\nTEST(Chain, LargerExpensesMoveUpTheChain) {\n  auto chain = standardChain();\n  EXPECT_EQ(chain-\u003ehandle({\"ann\", 300000}), std::string(\"director\"));\n  EXPECT_EQ(chain-\u003ehandle({\"ann\", 1500000}), std::string(\"vp\"));\n}\n\nTEST(Chain, LimitsAreInclusive) {\n  auto chain = standardChain();\n  EXPECT_EQ(chain-\u003ehandle({\"ann\", 100000}), std::string(\"manager\"));\n  EXPECT_EQ(chain-\u003ehandle({\"ann\", 100001}), std::string(\"director\"));\n  EXPECT_EQ(chain-\u003ehandle({\"ann\", 2000000}), std::string(\"vp\"));\n}\n\nTEST(Chain, FallingOffTheEndIsRejected) {\n  auto chain = standardChain();\n  EXPECT_EQ(chain-\u003ehandle({\"ann\", 2000001}), std::string(\"rejected\"));\n}\n\nTEST(Chain, NonPositiveAmountsAreNobodysToApprove) {\n  auto chain = standardChain();\n  EXPECT_EQ(chain-\u003ehandle({\"ann\", 0}), std::string(\"rejected\"));\n  EXPECT_EQ(chain-\u003ehandle({\"ann\", -500}), std::string(\"rejected\"));\n}\n\nTEST(Chain, ASingleLinkWithNoSuccessorRejectsWhatItCannotApprove) {\n  LimitApprover only(\"manager\", 1000);\n  EXPECT_EQ(only.handle({\"ann\", 1000}), std::string(\"manager\"));\n  EXPECT_EQ(only.handle({\"ann\", 1001}), std::string(\"rejected\"));\n}\n\nTEST(Chain, StopsAtTheFirstLinkThatApproves) {\n  int first = 0, second = 0, third = 0;\n  auto head = std::make_unique\u003cSpy\u003e(false, \u0026first);\n  head-\u003ethen(std::make_unique\u003cSpy\u003e(true, \u0026second)).then(std::make_unique\u003cSpy\u003e(true, \u0026third));\n  EXPECT_EQ(head-\u003ehandle({\"ann\", 1}), std::string(\"spy-yes\"));\n  EXPECT_EQ(first, 1);\n  EXPECT_EQ(second, 1);\n  EXPECT_EQ(third, 0);  // never consulted\n}\n\nTEST(Chain, ThenReturnsTheAppendedLinkSoChains oved player never hears from the lobby again.\n- `void setReady(const std::string\u0026 name, bool ready)`: marks the player ready or not; unknown names are ignored.\n- `void say(const std::string\u0026 from, const std::string\u0026 text)`: delivers `from + \": \" + text` to **every other** player, in join order. Not to the sender. Unknown senders are ignored (no one hears anything).\n- `bool matchStarted() const`.\n\n**Start rule** (checked after every `setReady` and every `leave`): the match starts when there are **at least two** players and **all** of them are ready. Starting calls `notify(\"match started\")` on every player, in join order, **exactly once**; after it has started, later changes never start it again.\n\nNote that `leave` can complete the condition: if the only player who was not ready walks out, the remaining ready players start the match.\n64:Te6e,#include \u003cstring\u003e\n#include \u003cvector\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\nclass Spy final : public Participant {\n public:\n  void notify(const std::string\u0026 message) override { heard.push_back(message); }\n  std::vector\u003cstd::string\u003e heard;\n};\n\nstd::vector\u003cstd::string\u003e v(std::initializer_list\u003cconst char*\u003e items) { return {items.begin(), items.end()}; }\n}  // namespace\n\nTEST(Lobby, SayReachesEveryoneExceptTheSender) {\n  Lobby lobby;\n  Spy ann, bob, cy;\n  lobby.join(\"ann\", ann);\n  lobby.join(\"bob\", bob);\n  lobby.join(\"cy\", cy);\n  lobby.say(\"ann\", \"hi\");\n  EXPECT_TRUE(ann.heard.empty());\n  EXPECT_TRUE(bob.heard == v({\"ann: hi\"}));\n  EXPECT_TRUE(cy.heard == v({\"ann: hi\"}));\n}\n\nTEST(Lobby, MessagesArriveInTheOrderTheyWereSaid) {\n  Lobby lobby;\n  Spy ann, bob;\n  lobby.join(\"ann\", ann);\n  lobby.join(\"bob\", bob);\n  lobby.say(\"ann\", \"one\");\n  lobby.say(\"ann\", \"two\");\n  EXPECT_TRUE(bob.heard == v({\"ann: one\", \"ann: two\"}));\n}\n\nTEST(Lobby, DuplicateNamesAreRefusedAndDoNotDoubleDeliver) {\n  Lobby lobby;\n  Spy ann, bob, impostor;\n  EXPECT_TRUE(lobby.join(\"ann\", ann));\n  EXPECT_TRUE(lobby.join(\"bob\", bob));\n  EXPECT_FALSE(lobby.join(\"bob\", impostor));\n  lobby.say(\"ann\", \"hello\");\n  EXPECT_EQ(bob.heard.size(), static_cast\u003cstd::size_t\u003e(1));\n  EXPECT_TRUE(impostor.heard.empty());\n}\n\nTEST(Lobby, UnknownSendersAreIgnored) {\n  Lobby lobby;\n  Spy ann;\n  lobby.join(\"ann\", ann);\n  lobby.say(\"ghost\", \"boo\");\n  EXPECT_TRUE(ann.heard.empty());\n}\n\nTEST(Lobby, MatchStartsWhenEveryoneIsReadyAndEveryoneIsToldOnce) {\n  Lobby lobby;\n  Spy ann, bob;\n  lobby.join(\"ann\", ann);\n  lobby.join(\"bob\", bob);\n  lobby.setReady(\"ann\", true);\n  EXPECT_FALSE(lobby.matchStarted());\n  lobby.setReady(\"bob\", true);\n  EXPECT_TRUE(lobby.matchStarted());\n  EXPECT_TRUE(ann.heard == v({\"match started\"}));\n  EXPECT_TRUE(bob.heard == v({\"match started\"}));\n}\n\nTEST(Lobby, ALonePlayerNeverStartsAMatch) {\n  Lobby lobby;\n  Spy ann;\n  lobby.join(\"ann\", ann);\n  lobby.setReady(\"ann\", true);\n  EXPECT_FALSE(lobby.matchStarted());\n  EXPECT_TRUE(ann.heard.empty());\n}\n\nTEST(Lobby, OneNotReadyPlayerBlocksTheStart) {\n  Lobby lobby;\n  Spy ann, bob, cy;\n  lobby.join(\"ann\", ann);\n  lobby.join(\"bob\", bob);\n  lobby.join(\"cy\", cy);\n  lobby.setReady(\"ann\", true);\n  lobby.setReady(\"bob\", true);\n  EXPECT_FALSE(lobby.matchStarted());\n}\n\nTEST(Lobby, TheMatchStartsOnlyOnceEvenIfReadinessChangesAgain) {\n  Lobby lobby;\n  Spy ann, bob;\n  lobby.join(\"ann\", ann);\n  lobby.join(\"bob\", bob);\n  lobby.setReady(\"ann\", true);\n  lobby.setReady(\"bob\", true);\n  lobby.setReady(\"bob\", false);\n  lobby.setReady(\"bob\", true);\n  EXPECT_EQ(ann.heard.size(), static_cast\u003cstd::size_t\u003e(1));\n  EXPECT_EQ(bob.heard.size(), static_cast\u003cstd::size_t\u003e(1));\n}\n\nTEST(Lobby, TheLastUnreadyPlayerLeavingStartsTheMatchForTheRest) {\n  Lobby lobby;\n  Spy ann, bob, cy;\n  lobby.join(\"ann\", ann);\n  lobby.join(\"bob\", bob);\n  lobby.join(\"cy\", cy);\n  lobby.setReady(\"ann\", true);\n  lobby.setReady(\"bob\", true);\n  lobby.leave(\"cy\");\n  EXPECT_TRUE(lobby.matchStarted());\n  EXPECT_TRUE(ann.heard == v({\"match started\"}));\n  EXPECT_TRUE(cy.heard.empty());  // gone before the start\n}\n\nTEST(Lobby, ALeftPlayerHearsNothingMore) {\n  Lobby lobby;\n  Spy ann, bob;\n  lobby.join(\"ann\", ann);\n  lobby.join(\"bob\", bob);\n  lobby.leave(\"bob\");\n  lobby.say(\"ann\", \"anyone?\");\n  EXPECT_TRUE(bob.heard.empty());\n  lobby.leave(\"nobody\");  // unknown names are ignored\n  EXPECT_TRUE(lobby.join(\"bob\", bob));  // the name is free again\n}\n\nTEST(Lobby, LeavingCannotStartAMatchWithFewerThanTwoPlayers) {\n  Lobby lobby;\n  Spy ann, bob;\n  lobby.join(\"ann\", ann);\n  lobby.join(\"bob\", bob);\n  lobby.setReady(\"ann\", true);\n  lobby.leave(\"bob\");\n  EXPECT_FALSE(lobby.matchStarted());\n}\n65:T688,An editor wants undo. The lazy way is to make `text_` and `cursor_` public so a history class can copy them out and write them back, but then anyone can read or forge the editor's internals. The **Memento** pattern keeps the encapsulation: the editor (the *originator*) packs its state into a sealed `Snapshot` only it can create or open, and a *caretaker* (`History`) stores snapshots without ever looking inside.\n\nWrite in `solution.h`:\n\n- `class Editor` holding a text and a cursor (a position from `0` to `text().size()`, starting at `0`):\n  - `void type(const std::string\u0026 s)` inserts `s` **at the cursor** and moves the cursor to just after it.\n  - `void moveCursor(std::size_t pos)` sets the cursor, clamped to `text().size()`.\n  - `const std::string\u0026 text() const` and `std::size_t cursor() const`.\n  - `Snapshot save() const` captures text **and cursor**; `void restore(const Snapshot\u0026)` puts both back. Restoring must not consume the snapshot: restoring the same one twice works.\n- `Editor::Snapshot`, a nested class: **copyable, but not d
