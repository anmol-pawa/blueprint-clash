efault-constructible and not constructible from outside**. Its constructor is private and `Editor` is its friend. It exposes no getters. A snapshot is a value: it must not change when the editor is edited after `save()`.\n- `class History`, the caretaker:\n  - `void push(Editor::Snapshot s)`.\n  - `bool undo(Editor\u0026 editor)` pops the **newest** snapshot and restores it, returning `true`; with nothing stored it returns `false` and leaves the editor untouched.\n  - `std::size_t size() const`.\n\nThe hidden tests check the construction rules at compile time with type traits, so an \"easy\" public constructor will be rejected.\n66:T961,#include \u003cstring\u003e\n#include \u003ctype_traits\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nTEST(Editor, TypingInsertsAtTheCursorAndAdvancesIt) {\n  Editor e;\n  e.type(\"held\");\n  e.moveCursor(2);\n  e.type(\"l\");\n  EXPECT_EQ(e.text(), std::string(\"helld\"));\n  EXPECT_EQ(e.cursor(), static_cast\u003cstd::size_t\u003e(3));\n}\n\nTEST(Editor, CursorIsClampedToTheText) {\n  Editor e;\n  e.type(\"abc\");\n  e.moveCursor(99);\n  EXPECT_EQ(e.cursor(), static_cast\u003cstd::size_t\u003e(3));\n}\n\nTEST(Snapshot, RestoreBringsBackTextAndCursor) {\n  Editor e;\n  e.type(\"hello\");\n  e.moveCursor(2);\n  auto snap = e.save();\n  e.moveCursor(5);\n  e.type(\" world\");\n  e.restore(snap);\n  EXPECT_EQ(e.text(), std::string(\"hello\"));\n  EXPECT_EQ(e.cursor(), static_cast\u003cstd::size_t\u003e(2));\n}\n\nTEST(Snapshot, IsAValueNotAViewOfTheEditor) {\n  Editor e;\n  e.type(\"one\");\n  auto snap = e.save();\n  e.type(\" two\");\n  e.type(\" three\");\n  e.restore(snap);\n  EXPECT_EQ(e.text(), std::string(\"one\"));\n}\n\nTEST(Snapshot, CanBeRestoredMoreThanOnce) {\n  Editor e;\n  e.type(\"a\");\n  auto snap = e.save();\n  e.type(\"b\");\n  e.restore(snap);\n  e.type(\"c\");\n  e.restore(snap);\n  EXPECT_EQ(e.text(), std::string(\"a\"));\n}\n\nTEST(Snapshot, OnlyTheEditorCanMakeOne) {\n  EXPECT_FALSE((std::is_constructible\u003cEditor::Snapshot, std::string, std::size_t\u003e::value));\n  EXPECT_FALSE(std::is_default_constructible\u003cEditor::Snapshot\u003e::value);\n  EXPECT_TRUE(std::is_copy_constructible\u003cEditor::Snapshot\u003e::value);\n}\n\nTEST(History, UndoGoesBackNewestFirst) {\n  Editor e;\n  History h;\n  h.push(e.save());\n  e.type(\"a\");\n  h.push(e.save());\n  e.type(\"b\");\n  h.push(e.save());\n  e.type(\"c\");\n  EXPECT_EQ(e.text(), std::string(\"abc\"));\n  EXPECT_TRUE(h.undo(e));\n  EXPECT_EQ(e.text(), std::string(\"ab\"));\n  EXPECT_TRUE(h.undo(e));\n  EXPECT_EQ(e.text(), std::string(\"a\"));\n  EXPECT_TRUE(h.undo(e));\n  EXPECT_EQ(e.text(), std::string(\"\"));\n  EXPECT_EQ(h.size(), static_cast\u003cstd::size_t\u003e(0));\n}\n\nTEST(History, UndoOnEmptyHistoryChangesNothing) {\n  Editor e;\n  e.type(\"keep\");\n  History h;\n  EXPECT_FALSE(h.undo(e));\n  EXPECT_EQ(e.text(), std::string(\"keep\"));\n  EXPECT_EQ(e.cursor(), static_cast\u003cstd::size_t\u003e(4));\n}\n\nTEST(History, UndoRestoresTheCursorToo) {\n  Editor e;\n  e.type(\"abcdef\");\n  e.moveCursor(3);\n  History h;\n  h.push(e.save());\n  e.moveCursor(0);\n  e.type(\"XY\");\n  EXPECT_TRUE(h.undo(e));\n  EXPECT_EQ(e.cursor(), static_cast\u003cstd::size_t\u003e(3));\n  EXPECT_EQ(e.text(), std::string(\"abcdef\"));\n}\n"])</script><script>self.__next_f.push([1,"67:T802,A shop basket holds three kinds of line: **goods** (a quantity of something at a unit price), **services** (hours at an hourly rate) and **vouchers** (a fixed discount). Totals, receipts and tax summaries are all different operations over the same three kinds. Adding a method per operation to every item class means editing three classes each time; a `dynamic_cast` ladder compiles happily and silently skips the next kind someone adds. The **Visitor** pattern fixes the family and lets you add operations from outside: each item has one tiny `accept` that calls back the overload for its own concrete type (*double dispatch*).\n\nWrite in `solution.h` (all money is in cents):\n\n- `class ItemVisitor`: an interface with a virtual destructor and three pure virtuals `visit(const Goods\u0026)`, `visit(const Service\u0026)` and `visit(const Voucher\u0026)`. Forward-declare the three item classes above it.\n- `class Item`: virtual destructor and `virtual void accept(ItemVisitor\u0026) const = 0`.\n- `class Goods final : public Item`, built as `Goods(std::string name, int quantity, long long unitCents)`, with getters `name()`, `quantity()`, `unitCents()`.\n- `class Service final : public Item`, built as `Service(std::string name, int hours, long long rateCents)`, with `name()`, `hours()`, `rateCents()`.\n- `class Voucher final : public Item`, built as `Voucher(std::string name, long long cents)`, with `name()`, `cents()`.\n- Each concrete `accept` calls `visitor.visit(*this)` and nothing else.\n- `class Basket` owns its items: `void add(std::unique_ptr\u003cItem\u003e)` (a null pointer is ignored), `std::size_t size() const`, and `void accept(ItemVisitor\u0026) const` which offers the visitor every item **in the order they were added**.\n- `class TotalVisitor final : public ItemVisitor` with `long long totalCents() const`, starting at 0: goods add `quantity * unitCents`, services add `hours * rateCents`, vouchers **subtract** `cents`.\n\nThe hidden tests write their own visitors (a receipt printer, a counter) without editing any item class: that is the point of the pattern.\n68:T8fd,#pragma once\n#include \u003ccstddef\u003e\n#include \u003cmemory\u003e\n#include \u003cstring\u003e\n#include \u003cutility\u003e\n#include \u003cvector\u003e\n\nclass Goods;\nclass Service;\nclass Voucher;\n\n// TODO: ItemVisitor has one pure virtual visit() per concrete item. Each concrete accept() calls\n// visitor.visit(*this). Basket visits in insertion order and ignores null items.\n// TotalVisitor: goods quantity*unit + services hours*rate - vouchers.\nclass ItemVisitor {\n public:\n  virtual ~ItemVisitor() = default;\n  virtual void visit(const Goods\u0026) = 0;\n  virtual void visit(const Service\u0026) = 0;\n  virtual void visit(const Voucher\u0026) = 0;\n};\n\nclass Item {\n public:\n  virtual ~Item() = default;\n  virtual void accept(ItemVisitor\u0026 visitor) const = 0;\n};\n\nclass Goods final : public Item {\n public:\n  Goods(std::string name, int quantity, long long unitCents)\n      : name_(std::move(name)), quantity_(quantity), unitCents_(unitCents) {}\n  const std::string\u0026 name() const { return name_; }\n  int quantity() const { return quantity_; }\n  long long unitCents() const { return unitCents_; }\n  void accept(ItemVisitor\u0026) const override {}\n\n private:\n  std::string name_;\n  int quantity_;\n  long long unitCents_;\n};\n\nclass Service final : public Item {\n public:\n  Service(std::string name, int hours, long long rateCents)\n      : name_(std::move(name)), hours_(hours), rateCents_(rateCents) {}\n  const std::string\u0026 name() const { return name_; }\n  int hours() const { return hours_; }\n  long long rateCents() const { return rateCents_; }\n  void accept(ItemVisitor\u0026) const override {}\n\n private:\n  std::string name_;\n  int hours_;\n  long long rateCents_;\n};\n\nclass Voucher final : public Item {\n public:\n  Voucher(std::string name, long long cents) : name_(std::move(name)), cents_(cents) {}\n  const std::string\u0026 name() const { return name_; }\n  long long cents() const { return cents_; }\n  void accept(ItemVisitor\u0026) const override {}\n\n private:\n  std::string name_;\n  long long cents_;\n};\n\nclass Basket {\n public:\n  void add(std::unique_ptr\u003cItem\u003e) {}\n  std::size_t size() const { return 0; }\n  void accept(ItemVisitor\u0026) const {}\n};\n\nclass TotalVisitor final : public ItemVisitor {\n public:\n  long long totalCents() const { return 0; }\n  void visit(const Goods\u0026) override {}\n  void visit(const Service\u0026) override {}\n  void visit(const Voucher\u0026) override {}\n};\n69:Taec,#include \u003cmemory\u003e\n#include \u003cstring\u003e\n#include \u003cvector\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\n// A brand-new operation, written without editing any item class.\nclass ReceiptVisitor final : public ItemVisitor {\n public:\n  std::vector\u003cstd::string\u003e lines;\n  void visit(const Goods\u0026 g) override { lines.push_back(\"goods:\" + g.name() + \"x\" + std::to_string(g.quantity())); }\n  void visit(const Service\u0026 s) override { lines.push_back(\"service:\" + s.name() + \"/\" + std::to_string(s.hours()) + \"h\"); }\n  void visit(const Voucher\u0026 v) override { lines.push_back(\"voucher:\" + v.name()); }\n};\n\nclass CountingVisitor final : public ItemVisitor {\n public:\n  int goods = 0, services = 0, vouchers = 0;\n  void visit(const Goods\u0026) override { ++goods; }\n  void visit(const Service\u0026) override { ++services; }\n  void visit(const Voucher\u0026) override { ++vouchers; }\n};\n\nBasket sampleBasket() {\n  Basket b;\n  b.add(std::make_unique\u003cGoods\u003e(\"pen\", 3, 250));\n  b.add(std::make_unique\u003cService\u003e(\"setup\", 2, 4000));\n  b.add(std::make_unique\u003cVoucher\u003e(\"welcome\", 500));\n  return b;\n}\n}  // namespace\n\nTEST(Basket, TotalMultipliesQuantityAndHours) {\n  Basket b;\n  b.add(std::make_unique\u003cGoods\u003e(\"pen\", 3, 250));\n  b.add(std::make_unique\u003cService\u003e(\"setup\", 2, 4000));\n  TotalVisitor t;\n  b.accept(t);\n  EXPECT_EQ(t.totalCents(), 8750LL);\n}\n\nTEST(Basket, VoucherReducesTheTotal) {\n  Basket b = sampleBasket();\n  TotalVisitor t;\n  b.accept(t);\n  EXPECT_EQ(t.totalCents(), 8250LL);\n}\n\nTEST(Basket, EmptyBasketTotalsZero) {\n  Basket b;\n  TotalVisitor t;\n  b.accept(t);\n  EXPECT_EQ(t.totalCents(), 0LL);\n}\n\nTEST(Basket, EachKindReachesItsOwnOverload) {\n  Basket b = sampleBasket();\n  b.add(std::make_unique\u003cGoods\u003e(\"cap\", 1, 900));\n  CountingVisitor c;\n  b.accept(c);\n  EXPECT_EQ(c.goods, 2);\n  EXPECT_EQ(c.services, 1);\n  EXPECT_EQ(c.vouchers, 1);\n}\n\nTEST(Basket, ItemsAreVisitedInInsertionOrder) {\n  Basket b = sampleBasket();\n  ReceiptVisitor r;\n  b.accept(r);\n  std::vector\u003cstd::string\u003e expected{\"goods:penx3\", \"service:setup/2h\", \"voucher:welcome\"};\n  EXPECT_TRUE(r.lines == expected);\n}\n\nTEST(Basket, NewOperationsNeedNoChangeToTheItems) {\n  Basket b = sampleBasket();\n  ReceiptVisitor r;\n  TotalVisitor t;\n  b.accept(r);\n  b.accept(t);\n  EXPECT_EQ(r.lines.size(), static_cast\u003cstd::size_t\u003e(3));\n  EXPECT_EQ(t.totalCents(), 8250LL);\n}\n\nTEST(Basket, AddingNullIsIgnored) {\n  Basket b;\n  b.add(nullptr);\n  b.add(std::make_unique\u003cVoucher\u003e(\"v\", 100));\n  b.add(nullptr);\n  EXPECT_EQ(b.size(), static_cast\u003cstd::size_t\u003e(1));\n  TotalVisitor t;\n  b.accept(t);\n  EXPECT_EQ(t.totalCents(), -100LL);\n}\n\nTEST(Item, AcceptWorksThroughABasePointer) {\n  std::unique_ptr\u003cItem\u003e item = std::make_unique\u003cVoucher\u003e(\"promo\", 300);\n  CountingVisitor c;\n  item-\u003eaccept(c);\n  EXPECT_EQ(c.vouchers, 1);\n  EXPECT_EQ(c.goods + c.services, 0);\n}\n6a:T7c2,A tiny calculator language has numbers, variables and the four arithmetic operators. A loop that reads tokens left to right gets `2 + 3 * 4` wrong (20, not 14) and cannot be reused with different variable values. The **Interpreter** pattern gives each grammar rule its own class and evaluates a *tree*: precedence is baked into the tree's shape, and the same tree can be evaluated under many `Context`s.\n\nThere are no exceptions in this judge, so failure is a value: evaluation returns `std::optional\u003clong long\u003e`, and `std::nullopt` means \"this expression has no value\" (unknown variable or division by zero).\n\nWrite in `solution.h`:\n\n- `class Context`: variable bindings. `Context\u0026 set(const std::string\u0026 name, long long value)` stores (or overwrites) a binding and returns `*this` so calls chain; `std::optional\u003clong long\u003e lookup(const std::string\u0026 name) const`.\n- `class Expr`: virtual destructor, `virtual std::optional\u003clong long\u003e eval(const Context\u0026) const = 0` and `virtual std::string show() const = 0`. Define `using ExprPtr = std::unique_ptr\u003cExpr\u003e;`.\n- Concrete rules, each owning its children by `ExprPtr` and built by a free function:\n  - `ExprPtr num(long long)`: evaluates to itself; `show()` is the number (`\"7\"`, `\"-2\"`).\n  - `ExprPtr var(std::string name)`: evaluates to the binding, or `nullopt` if the context has none; `show()` is the name.\n  - `ExprPtr add(ExprPtr, ExprPtr)`, `sub`, `mul` and `divide`: `divide` truncates toward zero like C++ `/` and yields `nullopt` when the right side is `0`.\n  - A binary node's value is `nullopt` whenever **either** child's value is `nullopt` (errors propagate, nothing is silently treated as 0). `show()` is fully parenthesised: `(left op right)` with `+`, `-`, `*`, `/` and single spaces.\n- Evaluating the same tree again under a different `Context` must use the new bindings.\n\nHidden tests also define their own `Expr` subclass (a `Negate` node) and nest it in your trees, so nothing may assume only your node types exist.\n6b:T634,#pragma once\n#include \u003cmemory\u003e\n#include \u003coptional\u003e\n#include \u003cstring\u003e\n#include \u003cunordered_map\u003e\n#include \u003cutility\u003e\n\n// TODO: one class per grammar rule (Num, Var, Add, Sub, Mul, Div), each owning its children.\n// eval returns nullopt for an unknown variable or division by zero, and that propagates upward.\n// show() is fully parenthesised: \"(left op right)\".\nclass Context {\n public:\n  Context\u0026 set(const std::string\u0026 name, long long value) {\n    values_[name] = value;\n    return *this;\n  }\n  std::optional\u003clong long\u003e lookup(const std::string\u0026 name) const {\n    const auto it = values_.find(name);\n    if (it == values_.end()) {\n      return std::nullopt;\n    }\n    return it-\u003esecond;\n  }\n\n private:\n  std::unordered_map\u003cstd::string, long long\u003e values_;\n};\n\nclass Expr {\n public:\n  virtual ~Expr() = default;\n  virtual std::optional\u003clong long\u003e eval(const Context\u0026 context) const = 0;\n  virtual std::string show() const = 0;\n};\n\nusing ExprPtr = std::unique_ptr\u003cExpr\u003e;\n\nclass Stub final : public Expr {\n public:\n  std::optional\u003clong long\u003e eval(const Context\u0026) const override { return std::nullopt; }\n  std::string show() const override { return \"\"; }\n};\n\ninline ExprPtr num(long long) { return std::make_unique\u003cStub\u003e(); }\ninline ExprPtr var(std::string) { return std::make_unique\u003cStub\u003e(); }\ninline ExprPtr add(ExprPtr, ExprPtr) { return std::make_unique\u003cStub\u003e(); }\ninline ExprPtr sub(ExprPtr, ExprPtr) { return std::make_unique\u003cStub\u003e(); }\ninline ExprPtr mul(ExprPtr, ExprPtr) { return std::make_unique\u003cStub\u003e(); }\ninline ExprPtr divide(ExprPtr, ExprPtr) { return std::make_unique\u003cStub\u003e(); }\n6c:Tbf3,#include \u003coptional\u003e\n#include \u003cstring\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\nconstexpr long long kNone = -999999999;\nlong long valueOr(const std::optional\u003clong long\u003e\u0026 v) { return v.value_or(kNone); }\n\n// A rule the exercise's author never saw, nested inside the candidate's trees.\nclass Negate final : public Expr {\n public:\n  explicit Negate(ExprPtr inner) : inner_(std::move(inner)) {}\n  std::optional\u003clong long\u003e eval(const Context\u0026 c) const override {\n    const auto v = inner_-\u003eeval(c);\n    if (!v) return std::nullopt;\n    return -*v;\n  }\n  std::string show() const override { return \"-\" + inner_-\u003eshow(); }\n\n private:\n  ExprPtr inner_;\n};\n}  // namespace\n\nTEST(Calc, PrecedenceLivesInTheShapeOfTheTree) {\n  Context c;\n  // 2 + 3 * 4\n  auto flat = add(num(2), mul(num(3), num(4)));\n  EXPECT_EQ(valueOr(flat-\u003eeval(c)), 14LL);\n  // (2 + 3) * 4\n  auto grouped = mul(add(num(2), num(3)), num(4));\n  EXPECT_EQ(valueOr(grouped-\u003eeval(c)), 20LL);\n}\n\nTEST(Calc, SubtractionKeepsOperandOrder) {\n  Context c;\n  EXPECT_EQ(valueOr(sub(num(10), num(3))-\u003eeval(c)), 7LL);\n  EXPECT_EQ(valueOr(sub(num(3), num(10))-\u003eeval(c)), -7LL);\n}\n\nTEST(Calc, DivisionTruncatesTowardZero) {\n  Context c;\n  EXPECT_EQ(valueOr(divide(num(7), num(2))-\u003eeval(c)), 3LL);\n  EXPECT_EQ(valueOr(divide(num(-7), num(2))-\u003eeval(c)), -3LL);\n}\n\nTEST(Calc, VariablesReadFromTheContext) {\n  Context c;\n  c.set(\"x\", 6).set(\"y\", 7);\n  EXPECT_EQ(valueOr(mul(var(\"x\"), var(\"y\"))-\u003eeval(c)), 42LL);\n}\n\nTEST(Calc, UnknownVariableHasNoValue) {\n  Context c;\n  c.set(\"x\", 1);\n  EXPECT_FALSE(var(\"nope\")-\u003eeval(c).has_value());\n  EXPECT_FALSE(add(var(\"x\"), var(\"nope\"))-\u003eeval(c).has_value());\n}\n\nTEST(Calc, DivisionByZeroHasNoValue) {\n  Context c;\n  c.set(\"z\", 0);\n  EXPECT_FALSE(divide(num(1), num(0))-\u003eeval(c).has_value());\n  EXPECT_FALSE(divide(num(1), var(\"z\"))-\u003eeval(c).has_value());\n}\n\nTEST(Calc, ErrorsPropagateThroughEveryParent) {\n  Context c;\n  // 5 + (1 / 0): the bad subtree must not be read as 0\n  auto tree = add(num(5), divide(num(1), num(0)));\n  EXPECT_FALSE(tree-\u003eeval(c).has_value());\n  auto deep = mul(num(2), sub(num(9), add(num(1), var(\"missing\"))));\n  EXPECT_FALSE(deep-\u003eeval(c).has_value());\n}\n\nTEST(Calc, SameTreeReevaluatesUnderANewContext) {\n  auto tree = add(var(\"x\"), num(1));\n  Context a;\n  a.set(\"x\", 10);\n  Context b;\n  b.set(\"x\", 20);\n  EXPECT_EQ(valueOr(tree-\u003eeval(a)), 11LL);\n  EXPECT_EQ(valueOr(tree-\u003eeval(b)), 21LL);\n  EXPECT_EQ(valueOr(tree-\u003eeval(a)), 11LL);\n}\n\nTEST(Calc, ShowParenthesisesEveryBinaryNode) {\n  auto tree = add(num(2), mul(var(\"x\"), num(-4)));\n  EXPECT_EQ(tree-\u003eshow(), std::string(\"(2 + (x * -4))\"));\n  EXPECT_EQ(divide(sub(num(9), num(1)), num(2))-\u003eshow(), std::string(\"((9 - 1) / 2)\"));\n}\n\nTEST(Calc, NewRulesPlugInWithoutEditingTheOldOnes) {\n  Context c;\n  c.set(\"x\", 5);\n  ExprPtr tree = add(std::make_unique\u003cNegate\u003e(var(\"x\")), num(8));\n  EXPECT_EQ(valueOr(tree-\u003eeval(c)), 3LL);\n  EXPECT_EQ(tree-\u003eshow(), std::string(\"(-x + 8)\"));\n  ExprPtr bad = add(std::make_unique\u003cNegate\u003e(var(\"q\")), num(8));\n  EXPECT_FALSE(bad-\u003eeval(c).has_value());\n}\n6d:T5b6,A metrics collector is shared by many request handlers. Write `SafeStats` in `solution.h`: it keeps a running **count**, **sum** and **max** of recorded latencies and must never expose a half-updated state.\n\nThe class does **not** create its own mutex. It receives a `Lock\u0026` (see `api.h`) in its constructor and uses it for every access. That seam is what lets the tests *watch* your locking deterministically, with no real threads.\n\n- `bool record(int value)`: values below zero are invalid. Return `false` and change nothing. Otherwise update count, sum and max together and return `true`.\n- `std::size_t recordAll(const std::vector\u003cint\u003e\u0026 values)`: record every valid value as **one atomic batch** and return how many were valid. No other thread may see a state that contains only part of the batch, so take the lock **once** for the whole batch.\n- `Stats snapshot() const`: return a consistent copy of `{count, sum, max}`. Reads need the lock too.\n- `void reset()`: back to zero.\n\nRules the tests probe: every method that touches the numbers takes the lock (reads included); the lock is released on **every** path, including the early `return false`; and the lock is never held when a method returns. Prefer an RAII guard (`std::lock_guard`) over calling `lock()` and `unlock()` by hand. (A `Lock\u0026` member can be locked inside a `const` method, because constness does not reach through a reference. With an owned `std::mutex` you would declare it `mutable`.)\n6e:Tc66,#include \u003cvector\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\n// Records every call. A real lock would block; this one just counts and checks for misuse.\nclass SpyLock final : public Lock {\n public:\n  void lock() override {\n    if (held_) ++misuse;  // non-recursive: locking twice would deadlock for real\n    held_ = true;\n    ++acquisitions;\n  }\n  void unlock() override {\n    if (!held_) ++misuse;\n    held_ = false;\n  }\n  bool try_lock() override {\n    if (held_) return false;\n    lock();\n    return true;\n  }\n  bool held() const { return held_; }\n  int acquisitions = 0;\n  int misuse = 0;\n\n private:\n  bool held_ = false;\n};\n}  // namespace\n\nTEST(Stats, RecordsCountSumAndMax) {\n  SpyLock lock;\n  SafeStats stats(lock);\n  EXPECT_TRUE(stats.record(30));\n  EXPECT_TRUE(stats.record(10));\n  EXPECT_TRUE(stats.record(20));\n  const Stats s = stats.snapshot();\n  EXPECT_EQ(s.count, 3LL);\n  EXPECT_EQ(s.sum, 60LL);\n  EXPECT_EQ(s.max, 30);\n}\n\nTEST(Stats, NegativeValueIsRejectedAndChangesNothing) {\n  SpyLock lock;\n  SafeStats stats(lock);\n  stats.record(5);\n  EXPECT_FALSE(stats.record(-1));\n  const Stats s = stats.snapshot();\n  EXPECT_EQ(s.count, 1LL);\n  EXPECT_EQ(s.sum, 5LL);\n}\n\nTEST(Stats, ResetClearsEverything) {\n  SpyLock lock;\n  SafeStats stats(lock);\n  stats.recordAll({4, 9});\n  stats.reset();\n  const Stats s = stats.snapshot();\n  EXPECT_EQ(s.count, 0LL);\n  EXPECT_EQ(s.sum, 0LL);\n  EXPECT_EQ(s.max, 0);\n}\n\nTEST(Stats, RecordAllCountsOnlyValidValues) {\n  SpyLock lock;\n  SafeStats stats(lock);\n  EXPECT_EQ(stats.recordAll({7, -3, 2, -1, 9}), static_cast\u003cstd::size_t\u003e(3));\n  const Stats s = stats.snapshot();\n  EXPECT_EQ(s.count, 3LL);\n  EXPECT_EQ(s.sum, 18LL);\n  EXPECT_EQ(s.max, 9);\n}\n\nTEST(Locking, RecordTakesTheLock) {\n  SpyLock lock;\n  SafeStats stats(lock);\n  stats.record(1);\n  EXPECT_EQ(lock.acquisitions, 1);\n}\n\nTEST(Locking, SnapshotTakesTheLockToo) {\n  SpyLock lock;\n  SafeStats stats(lock);\n  stats.record(1);\n  const int before = lock.acquisitions;\n  (void)stats.snapshot();\n  EXPECT_EQ(lock.acquisitions, before + 1);\n}\n\nTEST(Locking, ResetTakesTheLock) {\n  SpyLock lock;\n  SafeStats stats(lock);\n  stats.reset();\n  EXPECT_EQ(lock.acquisitions, 1);\n}\n\nTEST(Locking, LockIsReleasedAfterEveryCall) {\n  SpyLock lock;\n  SafeStats stats(lock);\n  stats.record(3);\n  EXPECT_FALSE(lock.held());\n  (void)stats.snapshot();\n  EXPECT_FALSE(lock.held());\n  stats.recordAll({1, 2});\n  EXPECT_FALSE(lock.held());\n  stats.reset();\n  EXPECT_FALSE(lock.held());\n  EXPECT_EQ(lock.misuse, 0);\n}\n\nTEST(Locking, RejectedRecordStillReleasesTheLock) {\n  SpyLock lock;\n  SafeStats stats(lock);\n  EXPECT_FALSE(stats.record(-5));\n  EXPECT_FALSE(lock.held());\n  EXPECT_TRUE(stats.record(5));  // would deadlock for real if the previous call leaked the lock\n  EXPECT_EQ(lock.misuse, 0);\n}\n\nTEST(Locking, BatchIsOneCriticalSection) {\n  SpyLock lock;\n  SafeStats stats(lock);\n  stats.recordAll({1, 2, 3, 4, 5, 6});\n  EXPECT_EQ(lock.acquisitions, 1);\n}\n\nTEST(Locking, EmptyBatchIsHarmless) {\n  SpyLock lock;\n  SafeStats stats(lock);\n  EXPECT_EQ(stats.recordAll({}), static_cast\u003cstd::size_t\u003e(0));\n  EXPECT_FALSE(lock.held());\n  EXPECT_EQ(stats.snapshot().count, 0LL);\n}\n6f:T54f,Two threads run `transfer(a, b, 10)` and `transfer(b, a, 10)` at the same moment. If each locks its *source* account first, thread 1 holds `a` and waits for `b` while thread 2 holds `b` and waits for `a`: a deadlock. Write `transfer` in `solution.h` so that cannot happen.\n\n`bool transfer(Account\u0026 from, Account\u0026 to, long long amount)` moves `amount` from one account to the other, atomically with respect to other transfers, and returns whether it did.\n\n- Fail (return `false`, change nothing, hold nothing) when `amount \u003c= 0`, when `from` and `to` are the **same** account (locking one non-recursive lock twice is itself a deadlock), or when `from` has less than `amount`.\n- Otherwise both balances change while **both** locks are held, and both are released when the function returns.\n- **Deadlock avoidance by lock ordering:** every thread must acquire the two locks in the same global order, here **ascending `id`**, whichever direction the money moves. The tests record the order in which locks are taken and check this directly. (`std::scoped_lock(first.lock, second.lock)` with the arguments already in id order is fine; so is two `lock_guard`s in id order.)\n\nThink about it while you write: why does a *consistent* order remove the cycle that deadlock needs? What would you do if accounts had no id? (Editorial: address order, or a hierarchy level.)\n70:Td67,#include \u003cvector\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\n// Shared by the spies: the order in which locks were taken, and misuse counters.\nstruct Journal {\n  std::vector\u003cint\u003e order;\n  int misuse = 0;\n};\n\nclass SpyLock final : public Lock {\n public:\n  SpyLock(Journal\u0026 journal, int tag) : journal_(journal), tag_(tag) {}\n  void lock() override {\n    if (held_) ++journal_.misuse;  // non-recursive\n    held_ = true;\n    journal_.order.push_back(tag_);\n  }\n  void unlock() override {\n    if (!held_) ++journal_.misuse;\n    held_ = false;\n  }\n  bool try_lock() override {\n    if (held_) return false;\n    lock();\n    return true;\n  }\n  bool held() const { return held_; }\n\n private:\n  Journal\u0026 journal_;\n  int tag_;\n  bool held_ = false;\n};\n\n// Two accounts with ids 1 and 2, lock tags equal to their ids.\nstruct Bank {\n  Journal journal;\n  SpyLock lockA{journal, 1};\n  SpyLock lockB{journal, 2};\n  Account a{1, 100, lockA};\n  Account b{2, 50, lockB};\n  bool anyHeld() const { return lockA.held() || lockB.held(); }\n};\n}  // namespace\n\nTEST(Transfer, MovesMoneyBetweenAccounts) {\n  Bank bank;\n  EXPECT_TRUE(transfer(bank.a, bank.b, 30));\n  EXPECT_EQ(bank.a.balance, 70LL);\n  EXPECT_EQ(bank.b.balance, 80LL);\n}\n\nTEST(Transfer, WorksInTheOtherDirectionToo) {\n  Bank bank;\n  EXPECT_TRUE(transfer(bank.b, bank.a, 20));\n  EXPECT_EQ(bank.a.balance, 120LL);\n  EXPECT_EQ(bank.b.balance, 30LL);\n}\n\nTEST(Transfer, InsufficientFundsChangesNothing) {\n  Bank bank;\n  EXPECT_FALSE(transfer(bank.b, bank.a, 51));\n  EXPECT_EQ(bank.a.balance, 100LL);\n  EXPECT_EQ(bank.b.balance, 50LL);\n}\n\nTEST(Transfer, ExactBalanceIsAllowed) {\n  Bank bank;\n  EXPECT_TRUE(transfer(bank.b, bank.a, 50));\n  EXPECT_EQ(bank.b.balance, 0LL);\n}\n\nTEST(Transfer, NonPositiveAmountIsRejected) {\n  Bank bank;\n  EXPECT_FALSE(transfer(bank.a, bank.b, 0));\n  EXPECT_FALSE(transfer(bank.a, bank.b, -5));\n  EXPECT_EQ(bank.a.balance, 100LL);\n  EXPECT_EQ(bank.b.balance, 50LL);\n}\n\nTEST(Transfer, SelfTransferIsRejectedWithoutLockingTwice) {\n  Bank bank;\n  EXPECT_FALSE(transfer(bank.a, bank.a, 10));\n  EXPECT_EQ(bank.journal.misuse, 0);\n  EXPECT_FALSE(bank.anyHeld());\n  EXPECT_EQ(bank.a.balance, 100LL);\n}\n\nTEST(Locking, BothLocksAreTakenOncePerTransfer) {\n  Bank bank;\n  transfer(bank.a, bank.b, 10);\n  EXPECT_EQ(bank.journal.order.size(), static_cast\u003cstd::size_t\u003e(2));\n  EXPECT_EQ(bank.journal.misuse, 0);\n}\n\nTEST(Locking, LowerIdIsAlwaysLockedFirstWhenMovingUp) {\n  Bank bank;\n  transfer(bank.a, bank.b, 10);  // from id 1 to id 2\n  EXPECT_TRUE(bank.journal.order == (std::vector\u003cint\u003e{1, 2}));\n}\n\nTEST(Locking, LowerIdIsAlwaysLockedFirstWhenMovingDown) {\n  Bank bank;\n  transfer(bank.b, bank.a, 10);  // from id 2 to id 1: this is the AB-BA trap\n  EXPECT_TRUE(bank.journal.order == (std::vector\u003cint\u003e{1, 2}));\n}\n\nTEST(Locking, OrderHoldsEvenWhenTheTransferFails) {\n  Bank bank;\n  transfer(bank.b, bank.a, 9999);  // insufficient funds\n  EXPECT_TRUE(bank.journal.order == (std::vector\u003cint\u003e{1, 2}));\n}\n\nTEST(Locking, EveryPathReleasesBothLocks) {\n  Bank bank;\n  transfer(bank.a, bank.b, 10);\n  EXPECT_FALSE(bank.anyHeld());\n  transfer(bank.a, bank.b, 9999);\n  EXPECT_FALSE(bank.anyHeld());\n  transfer(bank.a, bank.b, -1);\n  EXPECT_FALSE(bank.anyHeld());\n  EXPECT_EQ(bank.journal.misuse, 0);\n}\n\nTEST(Locking, RejectedAmountDoesNotNeedToLockAnything) {\n  Bank bank;\n  transfer(bank.a, bank.b, 0);\n  EXPECT_FALSE(bank.anyHeld());\n  EXPECT_EQ(bank.journal.misuse, 0);\n}\n71:T680,A producer thread pushes jobs and a consumer thread pops them. Write `BoundedQueue` in `solution.h`: a fixed-capacity FIFO of `int` whose `push` **blocks while the queue is full** and whose `pop` **blocks while it is empty**.\n\n```cpp\nBoundedQueue(std::size_t capacity, Lock\u0026 lock, Condition\u0026 notFull, Condition\u0026 notEmpty);  // capacity \u003e= 1\nvoid push(int value);        // waits while full\nint pop();                   // waits while empty\nstd::size_t size() const;\n```\n\n- One lock guards all the state. Hold it (with a `std::lock_guard\u003cLock\u003e`) for the whole operation, and let `Condition::wait(lock)` release it while sleeping.\n- `push` waits on `notFull`; `pop` waits on `notEmpty`. Two conditions, not one: each side only wants the wake-ups meant for it.\n- A wake-up does not mean the predicate is true. Another thread may have taken the item first, and `wait` may return spuriously. Re-check after every wake-up.\n- After a successful `push`, wake a consumer; after a successful `pop`, wake a producer. Waking one waiter is enough here, because each operation frees exactly one slot or one item.\n\nThe tests are deterministic. They give you a spy `Condition` whose `wait` releases the lock, plays a script (first wake-up spurious, second one a real producer or consumer step) and takes the lock again. A solution that does not loop, waits on the wrong condition, forgets to notify or skips the lock fails.\n\nThink about it while you write: what goes wrong with `if (full) wait();` when two producers wake up for one free slot? Why is `notify_one` safe on two condition variables, yet lossy on one shared by both sides? (Race Hunter has the bounded-queue puzzle.)\n72:Tef9,#include \u003ccstddef\u003e\n#include \u003cfunctional\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\nclass SpyLock final : public Lock {\n public:\n  void lock() override {\n    if (held_) ++misuse;  // non-recursive\n    held_ = true;\n    ++acquisitions;\n  }\n  void unlock() override {\n    if (!held_) ++misuse;\n    held_ = false;\n  }\n  bool try_lock() override {\n    if (held_) return false;\n    lock();\n    return true;\n  }\n  bool held() const { return held_; }\n  int misuse = 0;\n  int acquisitions = 0;\n\n private:\n  bool held_ = false;\n};\n\n// wait() checks the caller owns the lock, releases it, lets \"another thread\" run a script step, and re-takes it.\nclass SpyCondition final : public Condition {\n public:\n  explicit SpyCondition(SpyLock\u0026 lock) : lock_(lock) {}\n  void wait(Lock\u0026 lock) override {\n    ++waits;\n    if (!lock_.held()) ++lock_.misuse;\n    lock.unlock();\n    if (onWake) onWake(waits);\n    lock.lock();\n  }\n  void notifyOne() override { ++notifies; }\n  void notifyAll() override { ++notifies; }\n  int waits = 0;\n  int notifies = 0;\n  std::function\u003cvoid(int)\u003e onWake;\n\n private:\n  SpyLock\u0026 lock_;\n};\n\nstruct Bench {\n  explicit Bench(std::size_t capacity) : queue(capacity, lock, notFull, notEmpty) {}\n  // Both conditions get the same script, so waiting on the wrong one is caught by the wait counts, not by a hang.\n  void script(const std::function\u003cvoid(int)\u003e\u0026 step) {\n    notFull.onWake = step;\n    notEmpty.onWake = step;\n  }\n  SpyLock lock;\n  SpyCondition notFull{lock};\n  SpyCondition notEmpty{lock};\n  BoundedQueue queue;\n};\n}  // namespace\n\nTEST(Queue, KeepsFirstInFirstOut) {\n  Bench b(3);\n  b.queue.push(1);\n  b.queue.push(2);\n  b.queue.push(3);\n  EXPECT_EQ(b.queue.size(), static_cast\u003cstd::size_t\u003e(3));\n  EXPECT_EQ(b.queue.pop(), 1);\n  EXPECT_EQ(b.queue.pop(), 2);\n  EXPECT_EQ(b.queue.pop(), 3);\n  EXPECT_EQ(b.queue.size(), static_cast\u003cstd::size_t\u003e(0));\n}\n\nTEST(Queue, ReusesSlotsAfterWrappingAround) {\n  Bench b(2);\n  b.queue.push(1);\n  b.queue.push(2);\n  EXPECT_EQ(b.queue.pop(), 1);\n  b.queue.push(3);\n  EXPECT_EQ(b.queue.pop(), 2);\n  EXPECT_EQ(b.queue.pop(), 3);\n}\n\nTEST(Queue, DoesNotWaitWhenThereIsRoomOrAnItem) {\n  Bench b(2);\n  b.queue.push(1);\n  b.queue.pop();\n  EXPECT_EQ(b.notFull.waits, 0);\n  EXPECT_EQ(b.notEmpty.waits, 0);\n}\n\nTEST(Blocking, PopWaitsUntilAnItemArrives) {\n  Bench b(2);\n  // Wake-up 1 is spurious (nothing changed); wake-up 2 is a producer delivering 7.\n  b.script([\u0026](int n) {\n    if (n == 2) b.queue.push(7);\n  });\n  EXPECT_EQ(b.queue.pop(), 7);\n  EXPECT_EQ(b.notEmpty.waits, 2);\n  EXPECT_EQ(b.notFull.waits, 0);\n  EXPECT_EQ(b.queue.size(), static_cast\u003cstd::size_t\u003e(0));\n}\n\nTEST(Blocking, PushWaitsUntilSpaceAppears) {\n  Bench b(1);\n  b.queue.push(1);\n  // Wake-up 1 is spurious; wake-up 2 is a consumer taking the only item.\n  b.script([\u0026](int n) {\n    if (n == 2) b.queue.pop();\n  });\n  b.queue.push(2);\n  EXPECT_EQ(b.notFull.waits, 2);\n  EXPECT_EQ(b.notEmpty.waits, 0);\n  EXPECT_EQ(b.queue.size(), static_cast\u003cstd::size_t\u003e(1));\n  EXPECT_EQ(b.queue.pop(), 2);\n}\n\nTEST(Signalling, PushWakesAConsumerAndPopWakesAProducer) {\n  Bench b(2);\n  b.queue.push(1);\n  EXPECT_TRUE(b.notEmpty.notifies \u003e= 1);\n  EXPECT_EQ(b.notFull.notifies, 0);\n  b.queue.pop();\n  EXPECT_TRUE(b.notFull.notifies \u003e= 1);\n}\n\nTEST(Locking, PushAndPopTakeTheLock) {\n  Bench b(2);\n  b.queue.push(1);\n  EXPECT_TRUE(b.lock.acquisitions \u003e= 1);\n  const int afterPush = b.lock.acquisitions;\n  b.queue.pop();\n  EXPECT_TRUE(b.lock.acquisitions \u003e afterPush);\n}\n\nTEST(Locking, WaitingHoldsTheLockAndReleasesItAfter) {\n  Bench b(1);\n  b.script([\u0026](int n) {\n    if (n == 1) b.queue.push(5);\n  });\n  EXPECT_EQ(b.queue.pop(), 5);  // wait() flags a call made without owning the lock\n  EXPECT_EQ(b.lock.misuse, 0);\n  EXPECT_FALSE(b.lock.held());\n  b.queue.push(6);\n  EXPECT_FALSE(b.lock.held());\n  EXPECT_EQ(b.lock.misuse, 0);\n}\n73:T4ba,A service needs a setting that is expensive to load, so it loads it on first use. Many threads may ask at the same moment. Write `LazyValue` in `solution.h`:\n\n```cpp\nLazyValue(Lock\u0026 lock, Loader\u0026 loader);\nbool get(int\u0026 out);   // true and `out` filled; false if loading failed\n```\n\n- **Load at most once**, even if several threads arrive together. The tests simulate \"another thread finished loading while I was waiting for the lock\".\n- **Failure is not cached.** If `load` returns `false`, `get` returns `false` and the next call tries again. A half-initialised value must never be handed out.\n- **Warm reads must not take the lock.** Once the value is loaded, `get` should read it without touching `lock` (that is the whole point of double-checked locking). Use a `std::atomic\u003cbool\u003e` with `memory_order_acquire` to read it and `memory_order_release` to publish it.\n- Take the lock with a `std::lock_guard\u003cLock\u003e` so every path, including a failed load, unlocks.\n\nThink about it while you write: why is a plain `bool` flag a data race even though it only goes `false -\u003e true`? When is `std::call_once` (or a function-local static) the better answer, and why does it not fit when a failed load must be retried?\n74:Ta83,#include \u003cfunctional\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\nclass SpyLock final : public Lock {\n public:\n  void lock() override {\n    if (beforeAcquire) {  // \"another thread got in first\": runs once, before this caller owns the lock\n      std::function\u003cvoid()\u003e hook = beforeAcquire;\n      beforeAcquire = nullptr;\n      hook();\n    }\n    if (held_) ++misuse;\n    held_ = true;\n    ++acquisitions;\n  }\n  void unlock() override {\n    if (!held_) ++misuse;\n    held_ = false;\n  }\n  bool try_lock() override {\n    if (held_) return false;\n    lock();\n    return true;\n  }\n  bool held() const { return held_; }\n  int misuse = 0;\n  int acquisitions = 0;\n  std::function\u003cvoid()\u003e beforeAcquire;\n\n private:\n  bool held_ = false;\n};\n\nclass FakeLoader final : public Loader {\n public:\n  bool load(int\u0026 out) override {\n    ++calls;\n    if (failuresLeft \u003e 0) {\n      --failuresLeft;\n      return false;\n    }\n    out = 42;\n    return true;\n  }\n  int calls = 0;\n  int failuresLeft = 0;\n};\n\nstruct Bench {\n  SpyLock lock;\n  FakeLoader loader;\n  LazyValue lazy{lock, loader};\n};\n}  // namespace\n\nTEST(Once, FirstGetLoadsTheValue) {\n  Bench b;\n  int v = 0;\n  EXPECT_TRUE(b.lazy.get(v));\n  EXPECT_EQ(v, 42);\n  EXPECT_EQ(b.loader.calls, 1);\n  EXPECT_EQ(b.lock.acquisitions, 1);\n}\n\nTEST(Once, LoadsOnlyOnceAcrossManyCalls) {\n  Bench b;\n  int v = 0;\n  for (int i = 0; i \u003c 5; ++i) {\n    v = 0;\n    EXPECT_TRUE(b.lazy.get(v));\n    EXPECT_EQ(v, 42);\n  }\n  EXPECT_EQ(b.loader.calls, 1);\n}\n\nTEST(Once, TheLoserOfTheRaceDoesNotLoadAgain) {\n  Bench b;\n  // While this caller waits for the lock, another caller runs get() to completion.\n  b.lock.beforeAcquire = [\u0026] {\n    int other = 0;\n    b.lazy.get(other);\n  };\n  int v = 0;\n  EXPECT_TRUE(b.lazy.get(v));\n  EXPECT_EQ(v, 42);\n  EXPECT_EQ(b.loader.calls, 1);\n  EXPECT_FALSE(b.lock.held());\n  EXPECT_EQ(b.lock.misuse, 0);\n}\n\nTEST(Once, AFailedLoadIsNotCached) {\n  Bench b;\n  b.loader.failuresLeft = 1;\n  int v = -1;\n  EXPECT_FALSE(b.lazy.get(v));\n  EXPECT_EQ(v, -1);  // nothing handed out for a failed load\n  EXPECT_TRUE(b.lazy.get(v));\n  EXPECT_EQ(v, 42);\n  EXPECT_EQ(b.loader.calls, 2);\n}\n\nTEST(Locking, WarmReadsDoNotTakeTheLock) {\n  Bench b;\n  int v = 0;\n  b.lazy.get(v);\n  const int afterFirst = b.lock.acquisitions;\n  for (int i = 0; i \u003c 100; ++i) b.lazy.get(v);\n  EXPECT_EQ(b.lock.acquisitions, afterFirst);\n}\n\nTEST(Locking, AFailedLoadReleasesTheLock) {\n  Bench b;\n  b.loader.failuresLeft = 1;\n  int v = 0;\n  b.lazy.get(v);\n  EXPECT_FALSE(b.lock.held());\n  EXPECT_EQ(b.lock.misuse, 0);\n}\n\nTEST(Locking, ASuccessfulLoadReleasesTheLock) {\n  Bench b;\n  int v = 0;\n  b.lazy.get(v);\n  EXPECT_FALSE(b.lock.held());\n  EXPECT_EQ(b.lock.misuse, 0);\n}\n75:T5e5,Worker threads pull jobs off a shared queue. Write `TaskQueue` in `solution.h`, including the worker loop and a clean shutdown:\n\n```cpp\nTaskQueue(Lock\u0026 lock, Condition\u0026 wakeup);\nbool submit(Task task);   // false (and the task is dropped) once shutdown has begun\nvoid shutdown();          // stop accepting work, wake every worker\nvoid runWorker();         // the loop a worker thread runs; returns when shut down AND drained\n```\n\n- `runWorker` sleeps on `wakeup` while there is nothing to do and no shutdown (in a loop: wake-ups can be spurious). It runs tasks in submission order.\n- **Run each task with the lock released.** A task may call `submit` (it needs the lock), and a slow task must not block every other worker. Copy or move the task out inside the critical section, leave it, then call it.\n- **Drain on shutdown.** Tasks already queued when `shutdown()` is called still run; the worker returns only when the queue is empty *and* shutdown was requested.\n- `submit` wakes one worker; `shutdown` wakes **all** of them (each must notice the flag and exit). `submit` after `shutdown` returns `false`.\n\nTests drive `runWorker` on the test thread: the spy `Condition::wait` releases the lock, plays a script (a spurious wake-up, then a `submit`, then a `shutdown`) and takes the lock again.\n\nThink about it while you write: what happens if a task holding the queue lock calls `submit`? What does `notify_one` on shutdown strand? How would you add a way to wait for tasks to *finish*, not just to start?\n76:Td27,#include \u003cfunctional\u003e\n#include \u003cstring\u003e\n#include \"bp_test.h\"\n#include \"solution.h\"\n\nnamespace {\nclass SpyLock final : public Lock {\n public:\n  void lock() override {\n    if (held_) ++misuse;  // non-recursive\n    held_ = true;\n  }\n  void unlock() override {\n    if (!held_) ++misuse;\n    held_ = false;\n  }\n  bool try_lock() override {\n    if (held_) return false;\n    lock();\n    return true;\n  }\n  bool held() const { return held_; }\n  int misuse = 0;\n\n private:\n  bool held_ = false;\n};\n\nclass SpyCondition final : public Condition {\n public:\n  explicit SpyCondition(SpyLock\u0026 lock) : lock_(lock) {}\n  void wait(Lock\u0026 lock) override {\n    ++waits;\n    if (!lock_.held()) ++lock_.misuse;\n    lock.unlock();\n    if (onWake) onWake(waits);\n    lock.lock();\n  }\n  void notifyOne() override { ++ones; }\n  void notifyAll() override { ++alls; }\n  int waits = 0;\n  int ones = 0;\n  int alls = 0;\n  std::function\u003cvoid(int)\u003e onWake;\n\n private:\n  SpyLock\u0026 lock_;\n};\n\nstruct Bench {\n  SpyLock lock;\n  SpyCondition wakeup{lock};\n  TaskQueue queue{lock, wakeup};\n  std::string ran;\n  Task note(char c) {\n    return [this, c] { ran.push_back(c); };\n  }\n};\n}  // namespace\n\nTEST(Queue, RunsTasksInSubmissionOrder) {\n  Bench b;\n  EXPECT_TRUE(b.queue.submit(b.note('a')));\n  EXPECT_TRUE(b.queue.submit(b.note('b')));\n  EXPECT_TRUE(b.queue.submit(b.note('c')));\n  b.queue.shutdown();\n  b.queue.runWorker();\n  EXPECT_EQ(b.ran, std::string(\"abc\"));\n}\n\nTEST(Queue, SleepsUntilWorkArrivesIgnoringSpuriousWakeups) {\n  Bench b;\n  // Wake-up 1 is spurious, 2 delivers a task, 3 requests shutdown.\n  b.wakeup.onWake = [\u0026](int n) {\n    if (n == 2) b.queue.submit(b.note('x'));\n    if (n == 3) b.queue.shutdown();\n  };\n  b.queue.runWorker();\n  EXPECT_EQ(b.ran, std::string(\"x\"));\n  EXPECT_EQ(b.wakeup.waits, 3);\n}\n\nTEST(Queue, DoesNotWaitWhenTasksAreAlreadyQueued) {\n  Bench b;\n  b.queue.submit(b.note('a'));\n  b.queue.shutdown();\n  b.queue.runWorker();\n  EXPECT_EQ(b.wakeup.waits, 0);\n}\n\nTEST(Signalling, SubmitWakesAWorker) {\n  Bench b;\n  b.queue.submit(b.note('a'));\n  EXPECT_TRUE(b.wakeup.ones + b.wakeup.alls \u003e= 1);\n}\n\nTEST(Shutdown, WakesEveryWorker) {\n  Bench b;\n  b.queue.shutdown();\n  EXPECT_TRUE(b.wakeup.alls \u003e= 1);\n}\n\nTEST(Shutdown, DrainsQueuedTasksBeforeExiting) {\n  Bench b;\n  b.queue.submit(b.note('a'));\n  b.queue.submit(b.note('b'));\n  b.queue.shutdown();\n  b.queue.runWorker();\n  EXPECT_EQ(b.ran, std::string(\"ab\"));\n}\n\nTEST(Shutdown, SubmitAfterShutdownIsRejected) {\n  Bench b;\n  b.queue.shutdown();\n  EXPECT_FALSE(b.queue.submit(b.note('z')));\n  b.queue.runWorker();\n  EXPECT_EQ(b.ran, std::string(\"\"));\n}\n\nTEST(Locking, TasksRunWithoutTheLockHeld) {\n  Bench b;\n  bool heldDuringTask = true;\n  b.queue.submit([\u0026] { heldDuringTask = b.lock.held(); });\n  b.queue.shutdown();\n  b.queue.runWorker();\n  EXPECT_FALSE(heldDuringTask);\n}\n\nTEST(Locking, ATaskMayEnqueueFollowUpWork) {\n  Bench b;\n  b.queue.submit([\u0026] {\n    b.ran.push_back('A');\n    b.queue.submit(b.note('B'));  // needs the lock: deadlocks if the task ran under it\n    b.queue.shutdown();\n  });\n  b.queue.runWorker();\n  EXPECT_EQ(b.lock.misuse, 0);\n  EXPECT_EQ(b.ran, std::string(\"AB\"));\n}\n\nTEST(Locking, EveryPathReleasesTheLock) {\n  Bench b;\n  b.queue.submit(b.note('a'));\n  b.queue.shutdown();\n  b.queue.submit(b.note('b'));\n  b.queue.runWorker();\n  EXPECT_FALSE(b.lock.held());\n  EXPECT_EQ(b.lock.misuse, 0);\n}\nc:[\"$\",\"$L25\",null,{\"exercises\":{\"old-town\":[{\"id\":\"file-handle\",\"title\":\"FileHandle: RAII and move-only ownership\",\"prompt\":\"The `os` namespace in `api.h` hands out numeric ids you must give back with `os::close`. Forgetting leaks an id; closing twice is an error.\\n\\nWrite `FileHandle` in `solution.h` so that nobody ever has to remember:\\n\\n- `explicit FileHandle(const std::string\u0026 path)` opens the file; the destructor closes it.\\n- `int id() const` returns the id, or `0` for a moved-from handle.\\n- It **cannot be copied** (two owners would close twice) but it **can be moved**: a move transfers the id and leaves the source empty (`id() == 0`), and the empty source closes nothing.\\n- Move assignment closes whatever the target already held before taking the new id. Self-move-assignment must not close anything.\\n\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n\\n// A tiny pretend operating system. open() hands out ids, close() takes them back.\\nnamespace os {\\nint open(const std::string\u0026 path);   // returns a fresh id (\u003e 0)\\nvoid close(int id);                  // closing an id that is not open counts as an error\\nint openCount();                     // how many ids are open right now\\nint closeErrors();                   // how many bad closes (double close, unknown id) happened\\nvoid reset();\\n}  // namespace os\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: own the id, release it in the destructor, forbid copying, allow moving.\\nclass FileHandle {\\n public:\\n  explicit FileHandle(const std::string\u0026 path) : id_(os::open(path)) {}\\n  int id() const { return id_; }\\n\\n private:\\n  int id_;\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$26\"}],\"hints\":[\"Who is responsible for calling `os::close`? Make that the destructor's job, never the caller's.\",\"If two objects could hold the same id, both destructors would close it. Delete the copy operations and write the moves.\",\"A move must leave the source owning nothing. `std::exchange(other.id_, 0)` takes the id and empties the source in one expression. Close the old id before overwriting it in move assignment.\"],\"driver\":{\"path\":\"driver.cpp\",\"content\":\"#define BP_TEST_MAIN\\n#include \\\"bp_test.h\\\"\\n\",\"readOnly\":true},\"testCount\":7}],\"solid-square\":[{\"id\":\"srp-invoice\",\"title\":\"Invoice: one class, one reason to change\",\"prompt\":\"A single `Invoice` class used to hold line items, add up the total, format the text *and* save it. Four reasons to change in one class. Split it so each class has one job. In `solution.h` write:\\n\\n- `Invoice`: holds data and the arithmetic of its own data only. `void add(const LineItem\u0026)`, `long long totalCents() const` (sum of `unitCents * quantity`), `const std::vector\u003cLineItem\u003e\u0026 items() const`. It must **not** know how to render or store itself.\\n- `InvoiceFormatter` with `std::string render(const Invoice\u0026) const`. One line per item in the form `\\\"\u003cname\u003e x\u003cquantity\u003e = \u003cmoney\u003e\\\\n\\\"`, then `\\\"TOTAL \u003cmoney\u003e\\\\n\\\"`. `\u003cmoney\u003e` is cents as dollars with two digits: `1250` is `12.50`, `5` is `0.05`, `0` is `0.00`.\\n- `InvoiceArchiver` constructed with an `InvoiceSink\u0026`, with `void archive(const Invoice\u0026)` that renders the invoice (using `InvoiceFormatter`) and passes the text to the sink's `store` exactly once.\\n\\nA test checks with a compile-time trait that `Invoice` has no `render` or `store` member.\\n\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n\\nstruct LineItem {\\n  std::string name;\\n  long long unitCents;\\n  int quantity;\\n};\\n\\n// Where finished invoice text goes (a file, a database, a test double).\\nclass InvoiceSink {\\n public:\\n  virtual ~InvoiceSink() = default;\\n  virtual void store(const std::string\u0026 text) = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n#include \u003cvector\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: one class per reason to change. Invoice holds data and its total only.\\nclass Invoice {\\n public:\\n  void add(const LineItem\u0026 item) { items_.push_back(item); }\\n  long long totalCents() const { return 0; }\\n  const std::vector\u003cLineItem\u003e\u0026 items() const { return items_; }\\n\\n private:\\n  std::vector\u003cLineItem\u003e items_;\\n};\\n\\nclass InvoiceFormatter {\\n public:\\n  std::string render(const Invoice\u0026) const { return \\\"\\\"; }\\n};\\n\\nclass InvoiceArchiver {\\n public:\\n  explicit InvoiceArchiver(InvoiceSink\u0026 sink) { (void)sink; }\\n  void archive(const Invoice\u0026) {}\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$27\"}],\"hints\":[\"List who would ask for a change: finance (how totals work), design (how text looks), operations (where it is saved). Each is a different reason to change.\",\"`Invoice` keeps items and sums them. `InvoiceFormatter` only turns an `Invoice` into text. `InvoiceArchiver` only hands text to an `InvoiceSink`.\",\"`money(cents)`: dollars are `cents / 100`; the remainder `cents % 100` needs a leading `0` when below 10. `archive` is `sink_.store(formatter_.render(invoice))`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":9},{\"id\":\"ocp-shipping\",\"title\":\"Shipping quotes: add a carrier without editing the calculator\",\"prompt\":\"A shop prices shipping with rules. Today it has a big `if (country == ...) ... else if (grams \u003e ...)` ladder, and every new carrier means editing it. Make the calculator **closed for modification, open for extension**. `api.h` gives `Parcel` and the `ShippingRule` interface. Write `ShippingCalculator` in `solution.h`:\\n\\n- `void add(std::unique_ptr\u003cShippingRule\u003e rule)`: the calculator takes ownership of the rule. A null rule is ignored.\\n- `long long quote(const Parcel\u0026 parcel) const`: the **cheapest** price among the rules that `matches` the parcel; `-1` when no rule matches.\\n- `std::size_t ruleCount() const`.\\n\\nThe calculator must not know any concrete rule: the tests register rules you have never seen, and destroying the calculator must destroy every rule it owns.\\n\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n\\nstruct Parcel {\\n  int grams;\\n  std::string country;\\n};\\n\\n// One way of pricing a parcel. New carriers and promotions are new subclasses.\\nclass ShippingRule {\\n public:\\n  virtual ~ShippingRule() = default;\\n  // Does this rule apply to the parcel?\\n  virtual bool matches(const Parcel\u0026 parcel) const = 0;\\n  // Price in cents (only meaningful when matches() is true).\\n  virtual long long cents(const Parcel\u0026 parcel) const = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cmemory\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: the price must come from registered ShippingRule objects, not from an if-ladder here.\\nclass ShippingCalculator {\\n public:\\n  void add(std::unique_ptr\u003cShippingRule\u003e rule) { (void)rule; }\\n  long long quote(const Parcel\u0026 parcel) const {\\n    if (parcel.country == \\\"US\\\") return 500;\\n    return -1;\\n  }\\n  std::size_t ruleCount() const { return 0; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$28\"}],\"hints\":[\"Which part changes every time marketing invents a carrier, and which part (pick the cheapest, handle none) never does? Put only the stable part in the calculator.\",\"Keep a `std::vector\u003cstd::unique_ptr\u003cShippingRule\u003e\u003e`. `add` moves the rule in; `quote` loops over the rules and never names a concrete class.\",\"`quote`: `long long best = -1; for (const auto\u0026 r : rules_) { if (!r-\u003ematches(p)) continue; const long long c = r-\u003ecents(p); if (best \u003c 0 || c \u003c best) best = c; } return best;`\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":6},{\"id\":\"lsp-account\",\"title\":\"Accounts: subtypes that keep the base's promises\",\"prompt\":\"$29\",\"api\":\"#pragma once\\n\\n// The contract every Account must honour (callers rely on it, so subtypes must not break it):\\n//   deposit(x):  ignored when x \u003c= 0, otherwise balance() grows by exactly x.\\n//   withdraw(x): when it returns true, balance() fell by exactly x;\\n//                when it returns false, balance() is unchanged.\\n//   A subtype may accept MORE withdrawals than the base promises, never fewer.\\n//   Base promise: withdraw(x) succeeds whenever 0 \u003c x \u003c= balance().\\nclass Account {\\n public:\\n  virtual ~Account() = default;\\n  virtual void deposit(long long cents) = 0;\\n  virtual bool withdraw(long long cents) = 0;\\n  virtual long long balance() const = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"$2a\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$2b\"}],\"hints\":[\"Read the contract in `api.h`: after a failed withdraw nothing may change, and after a successful one the balance falls by exactly the amount. Which kind of subclass would break that?\",\"`CheckingAccount` may accept more (overdraft) but must never refuse something the base promises. `FixedDeposit` cannot promise anything about `withdraw`, so it should not claim to be an `Account` at all.\",\"Both accounts: ignore non-positive amounts, check the limit (`balance_` for savings, `balance_ + overdraft_` for checking), then `balance_ -= cents`. `FixedDeposit::redeem` deposits the principal into `into` only when matured, then zeroes it.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":11},{\"id\":\"isp-machine\",\"title\":\"Office machines: no client forced to depend on what it does not use\",\"prompt\":\"An office once had a fat `Machine` interface with `print`, `scan` and `fax`, so the cheap `BasicPrinter` had to implement `scan` and `fax` as stubs that did nothing. `api.h` already splits the roles into `Printer` and `Scanner`. Write in `solution.h`:\\n\\n- `class BasicPrinter : public Printer`: **only** a printer. One page holds 10 characters, so `print` returns `ceil(text.size() / 10)` pages (`0` for an empty text).\\n- `class AllInOne : public Printer, public Scanner`: prints like `BasicPrinter`; `scan` returns `\\\"scan#1\\\"`, then `\\\"scan#2\\\"`, and so on.\\n- `int copyDocument(Scanner\u0026 from, Printer\u0026 to)`: scan one document, print it, return the pages printed. It must work with *any* scanner and *any* printer, including two different objects.\\n\\n`BasicPrinter` must not be a `Scanner`.\\n\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n\\n// Narrow roles. A client depends only on the role it uses.\\nclass Printer {\\n public:\\n  virtual ~Printer() = default;\\n  // Prints the text and returns the number of pages used.\\n  virtual int print(const std::string\u0026 text) = 0;\\n};\\n\\nclass Scanner {\\n public:\\n  virtual ~Scanner() = default;\\n  // Returns the text of the next scanned document.\\n  virtual std::string scan() = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: split the roles. BasicPrinter must not be a Scanner; copyDocument takes the narrow roles.\\nclass BasicPrinter : public Printer {\\n public:\\n  int print(const std::string\u0026 text) override {\\n    (void)text;\\n    return 0;\\n  }\\n};\\n\\nclass AllInOne : public Printer {\\n public:\\n  int print(const std::string\u0026 text) override {\\n    (void)text;\\n    return 0;\\n  }\\n};\\n\\ninline int copyDocument(Printer\u0026 to, Printer\u0026 from) {\\n  (void)to;\\n  (void)from;\\n  return 0;\\n}\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$2c\"}],\"hints\":[\"Who is forced to carry a `scan` they cannot do? Let each class implement exactly the roles it really has.\",\"`BasicPrinter : Printer`; `AllInOne : Printer, Scanner`. Share the page maths in one small helper instead of copying it. `copyDocument` takes the two roles, not a machine.\",\"Pages: `static_cast\u003cint\u003e((text.size() + 9) / 10)`. `copyDocument(Scanner\u0026 from, Printer\u0026 to) { return to.print(from.scan()); }`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":8},{\"id\":\"dip-notifier\",\"title\":\"Order service: depend on an abstraction, not on email\",\"prompt\":\"An order service must tell customers their order is confirmed, but it must not know *how*. `api.h` gives the abstraction `MessageSender`. Write `OrderService` in `solution.h`:\\n\\n- `explicit OrderService(MessageSender\u0026 sender)`: the service uses the sender it is given. It does not create one, and it does not use a global.\\n- `bool placeOrder(const std::string\u0026 customer, int quantity)`:\\n  - `quantity \u003c= 0` is rejected: return `false` and send nothing.\\n  - otherwise send one message to `customer` with the body `\\\"Order confirmed: \u003cquantity\u003e item(s)\\\"` (for example `\\\"Order confirmed: 3 item(s)\\\"`).\\n  - return `true` only when the sender reports delivery; if `send` returns `false`, the order is not confirmed and `placeOrder` returns `false`.\\n- `int confirmedCount() const`: how many orders were confirmed (delivered) so far.\\n\\nThe tests pass in senders of their own: one that records messages and one that always fails.\\n\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n\\n// The abstraction the order service depends on. Real senders (email, SMS, a test double) implement it.\\nclass MessageSender {\\n public:\\n  virtual ~MessageSender() = default;\\n  // Returns true when the message was delivered.\\n  virtual bool send(const std::string\u0026 to, const std::string\u0026 body) = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: depend on the MessageSender abstraction. Do not create a sender yourself.\\nclass OrderService {\\n public:\\n  explicit OrderService(MessageSender\u0026 sender) { (void)sender; }\\n  bool placeOrder(const std::string\u0026 customer, int quantity) {\\n    (void)customer;\\n    (void)quantity;\\n    return false;\\n  }\\n  int confirmedCount() const { return 0; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$2d\"}],\"hints\":[\"The tests give you a sender you have never seen. Where can the service get it from, if it must not create one or reach for a global?\",\"Take `MessageSender\u0026` in the constructor and keep it in a member. The service decides *when* to notify; the sender decides *how*.\",\"`placeOrder`: reject `quantity \u003c= 0` first; build the body with `std::to_string`; `if (!sender_.send(customer, body)) return false;` then `++confirmed_` and return true.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":6},{\"id\":\"dip-clock\",\"title\":\"Sessions: inject the clock and own it\",\"prompt\":\"Code that calls the system clock directly cannot be tested: you would have to sleep. Make time an injected dependency. `api.h` gives the `Clock` abstraction. Write `SessionStore` in `solution.h`:\\n\\n- `SessionStore(std::unique_ptr\u003cClock\u003e clock, long long ttlSeconds)`: the store **owns** its clock (the caller hands it over with `std::move`). It never reads the system clock itself.\\n- `std::string open(const std::string\u0026 user)`: creates a session at the current time and returns its token: `\\\"s1\\\"`, `\\\"s2\\\"`, ...\\n- `bool isValid(const std::string\u0026 token) const`: true when the token exists and `now - createdAt \u003c ttlSeconds` (a session created exactly `ttl` seconds ago has expired).\\n- `std::size_t activeCount() const`: how many sessions are valid right now.\\n\\nThe tests give you a clock they can move, and check that destroying the store destroys the clock it owns.\\n\",\"api\":\"#pragma once\\n\\n// Where \\\"now\\\" comes from. Production uses the system clock; tests use a clock they can move.\\nclass Clock {\\n public:\\n  virtual ~Clock() = default;\\n  virtual long long nowSeconds() const = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: use the injected Clock (and own it); never read the system clock here.\\nclass SessionStore {\\n public:\\n  SessionStore(std::unique_ptr\u003cClock\u003e clock, long long ttlSeconds) {\\n    (void)clock;\\n    (void)ttlSeconds;\\n  }\\n  std::string open(const std::string\u0026 user) {\\n    (void)user;\\n    return \\\"\\\";\\n  }\\n  bool isValid(const std::string\u0026 token) const {\\n    (void)token;\\n    return false;\\n  }\\n  std::size_t activeCount() const { return 0; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$2e\"}],\"hints\":[\"How would a test ever make a session expire without waiting? The store needs a time source it does not create itself.\",\"Take `std::unique_ptr\u003cClock\u003e` by value in the constructor and `std::move` it into a member: that says \\\"the store owns this clock\\\". Keep a `std::map\u003cstd::string, long long\u003e` of token to creation time.\",\"`isValid`: find the token; `return it != end \u0026\u0026 clock_-\u003enowSeconds() - it-\u003esecond \u003c ttl_;`. `activeCount` counts the valid ones. Tokens: `\\\"s\\\" + std::to_string(++counter_)`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":6},{\"id\":\"demeter-wallet\",\"title\":\"Shop and customer: tell, don't ask\",\"prompt\":\"A shop sells to customers who have money. The tempting code is `customer.getWallet().getBalance() \u003e= price` followed by `customer.getWallet().setBalance(...)`: the shop reaches through the customer into its wallet, so every caller depends on the customer's internals. Follow the Law of Demeter and *tell, don't ask*. Write in `solution.h`:\\n\\n- `class Wallet`: `explicit Wallet(long long cents = 0)`; `bool charge(long long cents)` (false and no change unless `0 \u003c cents \u003c= balance`); `void deposit(long long cents)` (ignores `cents \u003c= 0`); `long long balance() const`.\\n- `class Customer`: `Customer(std::string name, long long openingCents)`; `const std::string\u0026 name() const`; `bool pay(long long cents)`; `void topUp(long long cents)`; `long long funds() const`. A `Customer` must **not** hand out its wallet: no `wallet()` accessor.\\n- `class Shop`: `bool sell(Customer\u0026 buyer, long long priceCents)` asks the customer to pay and counts the price as revenue only when the payment succeeded; `long long revenue() const`.\\n\",\"api\":\"$undefined\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n\\n// TODO: Customer must not expose its Wallet; Shop only calls customer.pay(...).\\nclass Wallet {\\n public:\\n  explicit Wallet(long long cents = 0) : balance_(cents) {}\\n  bool charge(long long cents) {\\n    (void)cents;\\n    return false;\\n  }\\n  void deposit(long long cents) { (void)cents; }\\n  long long balance() const { return balance_; }\\n\\n private:\\n  long long balance_;\\n};\\n\\nclass Customer {\\n public:\\n  Customer(std::string name, long long openingCents) : name_(name), wallet_(openingCents) {}\\n  const std::string\u0026 name() const { return name_; }\\n  Wallet\u0026 wallet() { return wallet_; }\\n\\n private:\\n  std::string name_;\\n  Wallet wallet_;\\n};\\n\\nclass Shop {\\n public:\\n  bool sell(Customer\u0026 buyer, long long priceCents) {\\n    (void)buyer;\\n    (void)priceCents;\\n    return false;\\n  }\\n  long long revenue() const { return 0; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$2f\"}],\"hints\":[\"Who knows whether a payment is allowed? The object that holds the money. The shop should not need to know a wallet exists.\",\"`Customer` owns a `Wallet` member and forwards `pay`, `topUp` and `funds` to it. The rule (positive amount, enough money) lives in `Wallet::charge`. `Shop::sell` only calls `buyer.pay(price)`.\",\"`Shop::sell`: `if (!buyer.pay(priceCents)) return false; revenue_ += priceCents; return true;`. `Wallet::charge`: `if (cents \u003c= 0 || cents \u003e balance_) return false; balance_ -= cents; return true;`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":8},{\"id\":\"composition-history\",\"title\":\"Command history: has-a container, not is-a container\",\"prompt\":\"A text editor keeps the last few commands. The quick way is `class History : public std::vector\u003cstd::string\u003e`, and it works until someone calls `push_back` in a loop, `insert` in the middle or `clear` and the \\\"at most N entries\\\" rule is gone. Inheritance gave away the whole `vector` interface; you only wanted storage. Use **composition**. Write `BoundedHistory` in `solution.h`:\\n\\n- `explicit BoundedHistory(std::size_t capacity)`.\\n- `void add(const std::string\u0026 entry)`: appends; when the history is already at capacity the **oldest** entry is dropped first. A capacity of `0` keeps nothing.\\n- `std::size_t size() const`.\\n- `const std::string\u0026 at(std::size_t index) const`: index `0` is the oldest kept entry (the caller passes `index \u003c size()`).\\n- `std::string latest() const`: the newest entry, or `\\\"\\\"` when empty.\\n\\n`BoundedHistory` must not derive from `std::vector` and must not offer `push_back`.\\n\",\"api\":\"$undefined\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cstring\u003e\\n#include \u003cvector\u003e\\n\\n// TODO: do not inherit std::vector. Hold the storage as a private member and enforce the capacity.\\nclass BoundedHistory : public std::vector\u003cstd::string\u003e {\\n public:\\n  explicit BoundedHistory(std::size_t capacity) : capacity_(capacity) {}\\n  void add(const std::string\u0026 entry) { (void)entry; }\\n  std::string latest() const { return \\\"\\\"; }\\n\\n private:\\n  std::size_t capacity_;\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$30\"}],\"hints\":[\"Does a history *behave like* a vector everywhere a vector is used? What would `history.insert(history.begin(), x)` do to the capacity rule?\",\"Hold a `std::deque\u003cstd::string\u003e` as a private member and expose only the five operations in the prompt. The invariant `size() \u003c= capacity` can then only be broken inside the class.\",\"`add`: `if (capacity_ == 0) return; if (items_.size() == capacity_) items_.pop_front(); items_.push_back(entry);`. `latest`: `items_.empty() ? std::string() : items_.back()`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":7}],\"creational-foundry\":[{\"id\":\"factory-registry\",\"title\":\"Codec factory: new codecs without editing the creator\",\"prompt\":\"$31\",\"api\":\"#pragma once\\n#include \u003cfunctional\u003e\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n\\n// A product that callers want by name, without knowing its concrete class.\\nclass Codec {\\n public:\\n  virtual ~Codec() = default;\\n  virtual std::string name() const = 0;\\n  virtual std::string encode(const std::string\u0026 text) const = 0;\\n};\\n\\n// How to make one Codec. New codecs ship a new factory, nothing else.\\nusing CodecFactory = std::function\u003cstd::unique_ptr\u003cCodec\u003e()\u003e;\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n#include \u003cvector\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: look the factory up in a registry instead of hard-coding names here.\\nclass CodecRegistry {\\n public:\\n  bool registerCodec(const std::string\u0026 name, CodecFactory factory) {\\n    (void)name;\\n    (void)factory;\\n    return false;\\n  }\\n  std::unique_ptr\u003cCodec\u003e create(const std::string\u0026 name) const {\\n    (void)name;\\n    return nullptr;\\n  }\\n  std::vector\u003cstd::string\u003e names() const { return {}; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$32\"}],\"hints\":[\"What changes when someone invents a codec, and what never does? The registry should only know how to look a name up and call what it finds.\",\"Store `std::map\u003cstd::string, CodecFactory\u003e`. `registerCodec` inserts; `create` finds the entry and calls the stored function. Nothing is built at registration.\",\"`return factories_.emplace(name, std::move(factory)).second;` rejects duplicates and keeps the first. `std::map` iterates in key order, so `names()` is already sorted.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":8},{\"id\":\"builder-request\",\"title\":\"HTTP request builder: only valid requests can exist\",\"prompt\":\"$33\",\"api\":\"$undefined\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"$34\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$35\"}],\"hints\":[\"Who may create an `HttpRequest`? If only the builder can, then every request that exists was validated. Make the constructor private and befriend the builder.\",\"The builder keeps defaults in its own members. Each setter returns `*this`. `build()` checks all the rules, then copies the fields into a new `HttpRequest` (build is const, so the builder stays reusable).\",\"For headers, scan for a case-insensitive match before appending: `std::tolower(static_cast\u003cunsigned char\u003e(c))` on both sides. Replace the value in place if found.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":10},{\"id\":\"abstract-factory-family\",\"title\":\"Widget families: products that must match\",\"prompt\":\"$36\",\"api\":\"#pragma once\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n\\n// Two kinds of widget. Every widget belongs to one visual family (\\\"light\\\", \\\"dark\\\", ...).\\nclass Button {\\n public:\\n  virtual ~Button() = default;\\n  virtual std::string family() const = 0;\\n  virtual std::string render(const std::string\u0026 label) const = 0;\\n};\\n\\nclass Checkbox {\\n public:\\n  virtual ~Checkbox() = default;\\n  virtual std::string family() const = 0;\\n  virtual std::string render(const std::string\u0026 label, bool checked) const = 0;\\n};\\n\\n// Makes a matching set of widgets. A screen is built from ONE factory, so it can never mix families.\\nclass WidgetFactory {\\n public:\\n  virtual ~WidgetFactory() = default;\\n  virtual std::unique_ptr\u003cButton\u003e createButton() const = 0;\\n  virtual std::unique_ptr\u003cCheckbox\u003e createCheckbox() const = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: one concrete factory per family (LightFactory, DarkFactory) that makes MATCHING products,\\n// a makeFactory(name) lookup, and a renderLogin(factory) that only talks to the WidgetFactory interface.\\ninline std::unique_ptr\u003cWidgetFactory\u003e makeFactory(const std::string\u0026 family) {\\n  (void)family;\\n  return nullptr;\\n}\\n\\ninline std::string renderLogin(const WidgetFactory\u0026 factory) {\\n  (void)factory;\\n  return \\\"\\\";\\n}\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$37\"}],\"hints\":[\"Which two decisions must always agree? The button and the checkbox come from the same family. Put that choice in one object, so call sites cannot disagree.\",\"`LightFactory` and `DarkFactory` each return their own button and checkbox. `renderLogin` takes a `const WidgetFactory\u0026` and calls `createCheckbox()` and `createButton()` on it, nothing else.\",\"Do not look at the concrete factory type inside `renderLogin` (no `dynamic_cast`, no family name compare). The test hands in a family you have never seen.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":7},{\"id\":\"prototype-clone\",\"title\":\"Prototype: copy a widget tree without knowing its types\",\"prompt\":\"$38\",\"api\":\"#pragma once\\n#include \u003cmemory\u003e\\n#include \u003cstring\u003e\\n\\n// A UI element that can copy itself without the caller knowing its concrete type.\\nclass Widget {\\n public:\\n  virtual ~Widget() = default;\\n  // The prototype operation. C++ cannot make `unique_ptr\u003cDerived\u003e` covariant with `unique_ptr\u003cWidget\u003e`,\\n  // so every class returns `unique_ptr\u003cWidget\u003e` and must override this itself.\\n  virtual std::unique_ptr\u003cWidget\u003e clone() const = 0;\\n  virtual std::string describe() const = 0;\\n  virtual void setText(const std::string\u0026 text) = 0;  // a Panel's text is its title\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"$39\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$3a\"}],\"hints\":[\"A copy constructor on the base class cannot know the derived type. Put the copy behind a virtual `clone()`; each concrete class creates its own type with `std::make_unique\u003cSelf\u003e(*this)`.\",\"`Badge` inherits from `Label`, so it inherits `Label::clone()` too, and that would return a `Label`. Override `clone()` in `Badge`.\",\"A `Panel` owns `unique_ptr` children, so the compiler cannot copy it for you. Its `clone()` makes a new `Panel` and adds `child-\u003eclone()` for each child. `Palette::add` must store `prototype.clone()`, not the address you were handed.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":9},{\"id\":\"singleton-meyers\",\"title\":\"Meyers singleton, injected where it is used\",\"prompt\":\"$3b\",\"api\":\"#pragma once\\n\\n// Anything that hands out unique, increasing order numbers.\\nclass IdSource {\\n public:\\n  virtual ~IdSource() = default;\\n  virtual long next() = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: make IdGenerator a Meyers singleton (private constructor, deleted copy and move,\\n// instance() returning a reference), and give OrderService an IdSource\u0026 instead of a global.\\nclass IdGenerator : public IdSource {\\n public:\\n  static IdGenerator\u0026 instance() {\\n    static IdGenerator generator;\\n    return generator;\\n  }\\n  long next() override { return 0; }\\n\\n private:\\n  IdGenerator() = default;\\n};\\n\\nclass OrderService {\\n public:\\n  std::string place(const std::string\u0026 item) { return item; }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$3c\"}],\"hints\":[\"Two jobs: make exactly one `IdGenerator` possible, and keep `OrderService` from depending on that fact. The second job is just a constructor parameter of type `IdSource\u0026`.\",\"`static IdGenerator\u0026 instance() { static IdGenerator g; return g; }` with a private default constructor and `= delete` for copy and move. Return a reference, never a value.\",\"`OrderService` stores `IdSource\u0026 ids_` and builds `\\\"ORD-\\\" + std::to_string(ids_.next()) + \\\":\\\" + item`. Only the code that wires the app calls `IdGenerator::instance()`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":6},{\"id\":\"pool-lease\",\"title\":\"Object pool with RAII leases\",\"prompt\":\"$3d\",\"api\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \u003cstring\u003e\\n\\n// What a caller sees of a pooled resource: a scratch buffer it may fill and read.\\nusing Buffer = std::string;\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003ccstddef\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: own `capacity` buffers; make Lease a move-only RAII handle that returns its buffer\\n// (cleared) to the pool when destroyed or overwritten.\\nclass BufferPool {\\n public:\\n  class Lease {\\n   public:\\n    explicit operator bool() const { return false; }\\n    Buffer\u0026 operator*() const { return *buffer_; }\\n    Buffer* operator-\u003e() const { return buffer_; }\\n\\n   private:\\n    Buffer* buffer_ = nullptr;\\n  };\\n\\n  explicit BufferPool(std::size_t capacity) : capacity_(capacity) {}\\n  Lease acquire() { return Lease(); }\\n  std::size_t capacity() const { return capacity_; }\\n  std::size_t available() const { return 0; }\\n\\n private:\\n  std::size_t capacity_;\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$3e\"}],\"hints\":[\"Callers must never have to remember to give the buffer back. Return a small handle object whose destructor does it.\",\"The pool holds `std::vector\u003cstd::unique_ptr\u003cBuffer\u003e\u003e` for stable addresses and a `std::vector\u003cBuffer*\u003e` of idle ones. `acquire` pops from the idle list; `giveBack` clears the buffer and pushes it.\",\"Lease: delete copy; move constructor steals the pointers and nulls the source; move assignment does `release()` first, then steals (guard self-assignment); the destructor calls `release()`.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":9}],\"structural-bridges\":[{\"id\":\"adapter-payments\",\"title\":\"Adapter: put a legacy bank behind your gateway\",\"prompt\":\"Checkout talks to a `PaymentGateway` (see `api.h`), but the company's bank connection is the vendor's `LegacyBank`, which you cannot edit and which speaks another language: dollars as a `double`, a C-string currency, and integer result codes. Write in `solution.h` a `LegacyBankAdapter` so checkout can use the bank without changing:\\n\\n- `explicit LegacyBankAdapter(LegacyBank\u0026 bank)` adapts the bank it is given. It **refers to** that bank (several adapters and the vendor's own diagnostics must see the same call count), it does not copy it.\\n- `charge(cents, currency)` is a `PaymentGateway`. It converts `cents` to dollars (`cents / 100.0`), passes the currency through, and calls `bank.submit` exactly once.\\n- Result codes: `0` is `Approved`; `91` (issuer unavailable) is `Unavailable`, which callers may retry; every other code is `Declined`.\\n- Requests that can never succeed are answered `Declined` **without calling the bank at all**: `cents \u003c= 0` and an empty currency.\\n\",\"api\":\"$3f\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"#pragma once\\n#include \u003cstring\u003e\\n#include \\\"api.h\\\"\\n\\n// TODO: implement LegacyBankAdapter so checkout can use LegacyBank through PaymentGateway.\\n// Hold the bank by reference, convert cents to dollars, and map result codes to ChargeStatus.\\nclass LegacyBankAdapter : public PaymentGateway {\\n public:\\n  explicit LegacyBankAdapter(LegacyBank\u0026 bank) { (void)bank; }\\n  ChargeStatus charge(long long cents, const std::string\u0026 currency) override {\\n    (void)cents;\\n    (void)currency;\\n    return ChargeStatus::Declined;\\n  }\\n};\\n\"}],\"tests\":[{\"path\":\"tests.cpp\",\"content\":\"$40\"}],\"hints\":[\"Checkout already speaks `PaymentGateway`. Write a class that implements it and translates each call into what `LegacyBank` expects: dollars, a C-string, integer codes. Do not touch `LegacyBank`.\",\"Cents become dollars with a floating-point division (`cents / 100.0`); an integer division loses the cents. Keep the translation of result codes in one small function so the mapping is easy to read.\",\"Store `LegacyBank\u0026`, not a `LegacyBank` value: the vendor object has state (its call count) that other code reads. Reject `cents \u003c= 0` and an empty currency before calling the bank at all.\"],\"driver\":\"$c:props:exercises:old-town:0:driver\",\"testCount\":7},{\"id\":\"bridge-renderer\",\"title\":\"Bridge: shapes and renderers vary independently\",\"prompt\":\"$41\",\"api\":\"#pragma once\\n#include \u003cstring\u003e\\n\\n// The \\\"implementor\\\" side of the bridge: how pixels, text or markup actually get produced.\\nclass Renderer {\\n public:\\n  virtual ~Renderer() = default;\\n  virtual void line(int x1, int y1, int x2, int y2) = 0;\\n  virtual void circle(int cx, int cy, int r) = 0;\\n  // Everything drawn so far, one primitive per line.\\n  virtual std::string result() const = 0;\\n};\\n\\n// The \\\"abstraction\\\" side: what is being drawn. A shape never knows which backend it talks to.\\nclass Shape {\\n public:\\n  virtual ~Shape() = default;\\n  virtual void draw() const = 0;\\n  virtual void move(int dx, int dy) = 0;\\n  virtual void setRenderer(Renderer\u0026 renderer) = 0;\\n};\\n\",\"starter\":[{\"path\":\"solution.h\",\"content\":\"$42\"}],\"tests\":[{\"path\":\"tests.cpp\",\"conten
